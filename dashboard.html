HO e estruturalmente alta.\n\n8. **Insider selling cluster (persistente)**: LUNR CEO $14.7M (Aug 13 — mesmo dia Q2 miss); RKLB CEO Beck $286M Jul (10b5-1); NBIS vigiar Form 4. Regra: escala > 2% market cap em 3 dias = revisao de posicao."},{"title":"O que mudou esta semana","body":"*Vs sintese 2026-08-15.*\n\n| Ticker | Mudanca | Classificacao |\n|--------|---------|---------------|\n| EYPT | LUGANO primary endpoint MISS Aug 17; -69% para $4.57 | ❌ FALHOU BINARIO — REMOVIDA |\n| HYPE | Trump/CFTC endorsement Aug 19; ATH $77.62 Aug 21; +35% vs semana passada | ✅ NOVO CATALISADOR — atualizado |\n| CRWV | Q2 $2.58B beat; FY $12.4-13.2B raised; Anthropic+Meta; preco ~$90 | ATUALIZADO + ⚠️ preco revisto Aug-15 |\n| RKLB | Q2 $234.1M record; Neutron Q4 launchpad \"janela estreita\"; Iridium $870M/yr | ATUALIZADO |\n| IONQ | SkyWater concluido Jul 31; preco real $46.26 (nao $68 est.) | ⚠️ CORRECAO PRECO (Licao #23) |\n| AAVE | +15% esta semana; $98.88; approaching breakout $108 | ATUALIZADO |\n| ONDO | Abandoned blockchain plans Jul 28 (pivot para rede privada); $0.388 | ⚠️ PIVOT ESTRATEGICO |\n| VKTX | Maintenance study topline pendente; $34.29 (de $33.12 Aug-15) | CARRY |\n| PRME | PM647 IND/CTA Q3 pendente; Beam arbitragem confirmada; $3.29 | CARRY |\n| NBIS | $248.43; Burry short continua; nenhuma actualizacao material | CARRY |\n| LUNR | Recuperacao de -44% para -9% vs entrada | CARRY |\n| SPY | -1.4% esta semana ($776.34→$765.72); benchmark Apr-05 baixou de +10.5% para +9.0% | MERCADO |"}]},"thesis":{"date":"2026-08-26","intro":"Cinco nomes: os quatro que o dashboard esta a recomendar comprar este mes (LEU, KTOS, RKLB, IONQ) mais o outro score-5 que ficou de fora do cabaz (PRME). Carteira vazia, por isso o perimetro e o que muda uma decisao das proximas semanas. Nao ha alvos de preco aqui — ha juizo com analogia. Nao e conselho de investimento.","names":[{"ticker":"LEU","name":"Centrus Energy","theme":"Materiais & Energia","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"O melhor analogo desta empresa e **ela propria, ha doze anos**. A USEC — a antecessora\ndirecta da Centrus — pediu **Chapter 11 a 5 de Marco de 2014**, depois de nao conseguir\nencontrar investidores para os ~$4 mil milhoes do American Centrifuge Plant. **O projecto\nera o mesmo. O sitio era o mesmo: Piketon, Ohio. A tecnologia era a mesma familia de\ncentrifugas.** A empresa [saiu do Chapter 11 a 30 de Setembro de 2014 como Centrus](https://www.centrusenergy.com/news/centrus-energy-corp-emerges-from-chapter-11-restructuring/),\ncom nove milhoes de accoes novas e $240,4M de divida nova ([10-K FY2014](https://www.sec.gov/Archives/edgar/data/0001065059/000106505915000012/leu-20141231x10k.htm)).\nQuem tinha a accao antiga ficou sem nada.\n\n**O que e diferente agora:** ha um cliente que paga adiantado. O DOE atribuiu um contrato\nde HALEU que ja vai na Fase III e [foi prolongado por mais um ano em Junho de 2025](https://www.ans.org/news/2025-06-25/article-7134/doe-extends-centruss-haleu-production-contract-by-one-year/),\ne ha um award de $900M a suportar a expansao de Piketon. Em 2014 o Estado queria o produto\nmas nao assinava o cheque; em 2026 assina.\n\n**O que e igual:** a fabrica continua por construir e a empresa continua a nao a\nautofinanciar. A propria Centrus diz esperar as **primeiras centrifugas novas em Piketon\nem 2029**. Entre a narrativa e o caixa vao tres anos — exactamente o intervalo em que a\nUSEC morreu.","verdict":"","falsifier":""},{"title":"O invisivel","body":"Tres coisas que nao estao no comunicado:\n\n**Todo o HALEU produzido ao abrigo do contrato e propriedade do DOE.** A Centrus e um\ntransformador a feitio para o Estado, nao um vendedor no mercado. Isso significa que a\nconta de resultados de curto prazo **nao escala com o preco do uranio** — sobe o preco,\nnao muda a factura. Metade das pessoas que compram LEU como \"play do uranio\" esta a comprar\noutra coisa.\n\n**A escala contratada e minuscula.** A Fase III obriga a pelo menos **900 kg de HALEU UF6\npor ano**. Um unico nucleo inicial de reactor avancado esta na ordem das toneladas. Nao ha\nhoje reactores a HALEU em operacao comercial — a procura e uma promessa de politica publica,\nnao uma carteira de encomendas.\n\n**A tese certa pela razao errada:** se o HALEU for mesmo escasso e caro, o racional para os\nprojectistas de SMR nao e esperar — e **redesenhar para LEU+ (enriquecimento ate ~10%)**,\nque ja tem cadeia de fornecimento. O monopolio dissolve-se sem uma unica noticia ma sobre\na Centrus. A jusante, quem ganha com o programa nuclear americano sao os fabricantes de\ncombustivel e a logistica de deconversao e transporte, nao necessariamente quem enriquece.\n\n**Correccao a buy-list:** o catalisador registado — \"nova centrifuga Oak Ridge Q4 2026\" —\nmistura duas coisas. Oak Ridge e o centro de **fabrico** de centrifugas, e a\n[expansao anunciada em Janeiro de 2026](https://www.ans.org/news/2026-01-26/article-7697/centrus-to-expand-oak-ridge-facility/)\ne financiada em parte por $50M de um fundo estadual do Tennessee. Capacidade de\n**enriquecimento** nova e em Piketon, em 2029. E um marco industrial, nao um marco de receita.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"Nao por um modelo proprio — por comparacao com a propria historia da accao. Os screeners\npublicos poem o P/E TTM algures entre ~57x e ~80x contra uma **mediana a 5 anos de 14,6x**\npara a mesma empresa (GuruFocus e Simply Wall St, 2026 — opiniao de terceiros, nao facto\nauditado). Nao e preciso acreditar no numero exacto para ler o sinal: o multiplo esta varias\nvezes acima do que esta empresa negociou durante meia decada, com a fabrica ainda por\nconstruir.\n\nO segundo sinal e a volatilidade do proprio multiplo. Segundo a Investing.com, a accao caiu\nde ~$383 em Outubro de 2025 para ~$191,85 em Abril de 2026 — **-52% em seis meses** sem que\no contrato do DOE ou a data de 2029 se tenham mexido. Quando o preco se move dessa maneira e\nos factos nao, o que esta a mover-se e o apetite, e o apetite volta a mudar.","verdict":"caro","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | Deixa de ser um programa do Estado e passa a ter cliente comercial: um offtake de HALEU com contraparte privada nomeada | Um 8-K a nomear a contraparte de um contrato comercial de HALEU | baixa |\n| Base | Continua a ser um programa governamental bem financiado com caixa material so no fim da decada; a accao negoceia o sentimento nuclear, nao os resultados | Filings trimestrais a reafirmar 2029 para as primeiras centrifugas de Piketon | alta |\n| Bear | Expansao de capacidade europeia (Urenco/Orano) ou um corte orcamental encolhe o premio de escassez; ou uma emissao de accoes para financiar Piketon | Apropriacoes do DOE; qualquer 424B de aumento de capital | media |","verdict":"","falsifier":"um contrato de fornecimento de HALEU assinado com uma contraparte **nao governamental** antes do fim de 2027. Isso quebra a leitura de \"transformador a feitio\" e obriga a reavaliar o multiplo por inteiro."}],"verdict":"caro","verdictKey":"caro","falsifier":"um contrato de fornecimento de HALEU assinado com uma contraparte **nao governamental** antes do fim de 2027. Isso quebra a leitura de \"transformador a feitio\" e obriga a reavaliar o multiplo por inteiro."},{"ticker":"KTOS","name":"Kratos Defense","theme":"Geopolitica & Defesa","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"O analogo nao esta em 1980 — esta nos ultimos dois anos, no proprio programa. Em Janeiro de\n2024 a Forca Aerea americana financiou cinco desenhos de Collaborative Combat Aircraft\n(Anduril, Boeing, General Atomics, Lockheed, Northrop). Em\n[Abril de 2024 so a Anduril e a General Atomics avancaram](https://defensescoop.com/2024/04/24/anduril-general-atomics-air-force-cca-program/).\nE em [17 de Junho de 2026 a USAF adjudicou a producao do Incremento 1 — as primeiras 150\naeronaves — a Anduril e a General Atomics](https://defensescoop.com/2026/06/17/air-force-picks-anduril-general-atomics-to-build-first-operational-cca-drones/).\n\nA Kratos foi a empresa que **voou primeiro** o conceito, com o XQ-58A. Nao esta no contrato\nde producao. Este e o padrao mais antigo e mais caro da aquisicao de defesa americana: **quem\nganha o demonstrador nao ganha o programa**. O demonstrador prova que a coisa e possivel; o\nprograma vai para quem consegue industrializa-la e para quem controla o software de missao.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**A Kratos monetiza como fornecedor, nao como prime.** No unico CCA operacional ja\nadjudicado a uma equipa que a inclui — o MUX TACAIR dos Marines,\n[um OTA de $231,5M anunciado a 8 de Janeiro de 2026](https://defensescoop.com/2026/01/08/marine-corps-cca-drones-northrop-grumman-kratos-team-contract/)\n— **o prime e a Northrop Grumman**, que integra a sua arquitectura aberta de autonomia\n(Prism) na celula XQ-58 da Kratos ([USNI, 12 de Janeiro de 2026](https://news.usni.org/2026/01/12/northrop-grumman-to-advance-kratos-xq-58-valkyrie-drone-for-marines-corps-loyal-wingman-program)).\nMargem de fornecedor de celula nao e margem de prime de sistema de missao.\n\n**O valor esta a migrar da celula para o software.** Um aviao barato e barato para toda a\ngente construir; o que e dificil de replicar e a autonomia e a integracao de missao. Se a\ntese \"drones baratos ganham a proxima guerra\" estiver certa, o dinheiro pode ir quase todo\npara os donos do stack de autonomia — e a Kratos vende-lhes a fuselagem.\n\n**A escala nao bate certo com o preco.** A Kratos diz que vai subir a producao para\n**~40 Valkyries por ano ate ao fim de 2027**. O Incremento 1 sao 150 aeronaves e o Incremento\n2 podera chegar a ~2.350. A accao esta a ser comprada por um programa em que a empresa,\nhoje, nao esta.\n\n**Correccao a buy-list:** o `why_now` registado — \"unico loyal wingman US em producao\" —\ndeixou de ser verdade a 17 de Junho de 2026. Quem esta em producao e o YFQ-42A da General\nAtomics e o YFQ-44A da Anduril.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"Impossivel de dizer com honestidade — mas o onus da prova esta do lado optimista. Nao ha\naqui um multiplo comparavel util: a Kratos tem um negocio legado de alvos aereos e\nturbinas com margem baixa e previsivel, e por cima uma opcao sobre CCA. O que se pode dizer\nsem inventar e a assimetria de ordens de grandeza: o valor contratado **visivel e atribuivel**\nao programa Valkyrie sao dezenas de milhoes — um\n[contrato de $34,8M para integracao de sistema de missao](https://www.kratosdefense.com/newsroom/kratos-receives-34-8m-contract-for-valkyrie-mission-system-integration)\ne uma fatia de um OTA de $231,5M em que nao e prime — enquanto a tese que sustenta a accao\nfala de milhares de fuselagens num incremento cujos fornecedores ainda nao foram anunciados.\n\nNao ponho um alvo. Ponho a pergunta: quanto e que ja esta pago do Incremento 2?","verdict":"impossivel de dizer","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | A Kratos entra no Incremento 2 (ate ~2.350 aeronaves) ou fecha uma encomenda internacional grande de XQ-58 | Anuncio de fornecedores do Incremento 2 — data ainda nao publica | baixa a media |\n| Base | Fornecedor de celula e de alvos com crescimento real mas linear: ~40 Valkyries/ano ate fim de 2027, mais o legado | Divulgacoes de entregas em 2027; resultados trimestrais | alta |\n| Bear | Os primes de autonomia integram verticalmente a celula e a Kratos fica um fornecedor de componentes num mercado com muitos concorrentes | Qualquer CCA adjudicado a um prime que fabrique a propria fuselagem | media |","verdict":"","falsifier":"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa."}],"verdict":"impossivel de dizer","verdictKey":"incerto","falsifier":"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa."},{"ticker":"RKLB","name":"Rocket Lab USA","theme":"Espaco & Deep Tech","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"Outra vez a propria empresa. O **Electron** voou pela primeira vez a **25 de Maio de 2017**,\nchegou ao espaco e nao chegou a orbita por causa de uma falha de equipamento de comunicacoes\nem terra; **orbitou ao segundo voo, a 21 de Janeiro de 2018**. Oito meses entre \"quase\" e\n\"feito\", e um negocio real depois disso.\n\nO **Neutron** foi anunciado a **1 de Marco de 2021 com estreia prevista para 2024**. Passou\npara meados de 2025, depois para\n[o fim de 2026](https://spaceflightnow.com/2025/11/11/rocket-lab-delays-debut-of-neutron-rocket-to-2026/),\ne em Agosto de 2026 a\n[janela para 2026 \"esta a estreitar\"](https://spaceflightnow.com/2026/08/10/window-for-2026-launch-debut-of-rocket-labs-neutron-rocket-is-narrowing-as-development-continues/),\ncom [2027 em cima da mesa](https://spacenews.com/first-neutron-launch-may-slip-to-2027/).\nA 21 de Janeiro rebentou um tanque do primeiro andar num teste de carregamento com agua.\n\n**A licao do analogo e dupla, e as duas metades importam:** a Rocket Lab acaba por fazer o\nfoguetao voar — mas o calendario que anuncia nunca se cumpre. Quem comprou o Electron pela\ndata perdeu; quem comprou pela empresa ganhou. Cinco anos de derrapagem no Neutron sao\nconsistentes com o historico, nao uma anomalia.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**\"Entrega a rampa\" nao e \"lancamento\".** A linguagem do filing e sobre alinhar a producao do\ntanque do primeiro andar com a entrega do Neutron **a rampa** no Q4 2026. Entre estar na\nrampa e voar fica o **static fire integrado em Wallops** — descrito como o marco de maior\nrisco de todo o caminho. Quem le \"Q4 2026\" como data de voo esta a saltar o passo mais\nperigoso.\n\n**O mercado endereçavel do Neutron e \"quem nao e a SpaceX\".** O Neutron foi desenhado para\nmega-constelacoes, e o maior operador de mega-constelacoes do mundo tem foguetoes proprios e\nnao compra lancamentos. O que sobra e real — governo, operadores comerciais, defesa — mas e\nmenor do que o TAM que se cita.\n\n**A parte que ja ganha dinheiro nao e o foguetao.** A divisao de sistemas espaciais\n(componentes, satelites, Photon) e o negocio com receita hoje; o mercado esta a valorizar o\nlancador. Se o Neutron derrapar mais um ano, o que segura a empresa e o segmento que quase\nninguem discute.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"E a forma do \"caro\" importa: isto e uma opcao com theta. Nao vale a pena procurar um\nmultiplo: nao ha lucro estabilizado para dividir. A leitura\nhonesta e estrutural — o preco e essencialmente **uma opcao de compra sobre o Neutron\nfuncionar**, montada em cima de um negocio de componentes que gera receita. Opcoes perdem\nvalor com o tempo. Cada trimestre em que a estreia escorrega sem falha catastrofica nao e\nneutro: e premio a evaporar-se. Foi por isso que os avisos de carry ja registados\n(\"Neutron Q4 2026 nao reafirmado; escorregamento 2027 possivel\") sao a informacao mais\nimportante do nome, e nao um rodape.","verdict":"caro","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | Static fire integrado limpo e orbita no primeiro ou segundo voo ate meados de 2027; a carteira media-lift converte-se | Static fire integrado concluido em LC-3 sem anomalia | media |\n| Base | Entrega a rampa no Q4 2026, primeiro voo em 2027, orbita ao segundo — o padrao do proprio Electron | Anuncio de data de static fire; resultados trimestrais | alta |\n| Bear | Nova falha estrutural em teste empurra para 2028 e obriga a aumento de capital antes de haver receita de Neutron | Anomalia em teste; qualquer prospecto de emissao | media |","verdict":"","falsifier":"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \"aspiracao\" em \"plano\", e sobe o cenario base de uma prateleira."}],"verdict":"caro","verdictKey":"caro","falsifier":"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \"aspiracao\" em \"plano\", e sobe o cenario base de uma prateleira."},{"ticker":"IONQ","name":"IonQ","theme":"IA & Computacao","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"**Celera Genomics, 2000-2001.** A Celera sequenciou o genoma humano — a proeza cientifica da\ndecada — e a accao [chegou a ~$276 em Marco de 2000](https://money.cnn.com/2000/04/10/companies/celera/).\nEm [Abril de 2001 estava a $33,50](https://www.forbes.com/2001/04/11/0411sf.html). A ciencia\nestava certa. O modelo de negocio — vender acesso a dados genomicos — e que nao aguentou.\n\nO que aconteceu ao dinheiro e a parte que interessa: **foi para quem fazia as maquinas.**\nA Illumina fez IPO em Julho de 2000, tres anos antes de o Projecto Genoma acabar, levantando\n$96M a $16 por accao, e tornou-se a infraestrutura de medicao de toda a industria\n([Century of Bio](https://centuryofbio.com/p/illumina)). Numa revolucao de plataforma, o\nvalor assenta muitas vezes em quem vende as picaretas, nao em quem anuncia a descoberta.\n\n**O que e igual:** uma capacidade genuinamente nova, um vencedor simbolico, e um mercado\ndisposto a pagar hoje por receita que so faz sentido daqui a uma decada.\n**O que e diferente:** a IonQ tem receita a serio a entrar e clientes governamentais — a\nCelera nunca teve. O analogo avisa sobre a **forma** do risco, nao garante o desfecho.","verdict":" const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";

const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

/** Markdown de leitura: paragrafos e tabelas. Nao e um parser geral — cobre o que a tese usa. */
function rich(src, tableClass = "") {
  const lines = String(src ?? "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("|") && /^\|[\s:|-]+\|$/.test((lines[i + 1] ?? "").trim())) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      out.push(`<div class="tw"><table class="${tableClass}"><thead><tr>` +
        head.map((h) => `<th>${esc(h)}</th>`).join("") + `</tr></thead><tbody>` +
        rows.map((r) => `<tr>` + r.map((c, n) => {
          const prob = tableClass === "scen" && n === head.length - 1;
          // data-l e o rotulo que substitui o cabecalho quando a tabela vira cartoes no telemovel.
          const label = tableClass === "scen" && n > 0 ? ` data-l="${esc(head[n])}"` : "";
          return `<td${label}>${prob ? `<span class="prob" data-p="${esc(c.split(" ")[0])}">${esc(c)}</span>` : md(c)}</td>`;
        }).join("") + `</tr>`).join("") + `</tbody></table></div>`);
    } else if (!line.trim()) {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !lines[i].trim().startsWith("|")) para.push(lines[i++]);
      out.push(`<p>${md(para.join(" "))}</p>`);
    }
  }
  return out.join("");
}

  const parts = [`<p class="lede">Delta de ${esc(d.date)} — ${d.alerts.length} alertas, ${d.moves.length} movimentos.</p>`];

  if (d.alerts.length) {
    parts.push(`<div><h2 class="sec">Alertas</h2><div class="alerts">` + d.alerts.map((a) => `
      <div class="alert" data-l="${esc(a.level)}"><div class="stripe"></div><div class="in">

        <p>${md(a.body)}</p>
      </div></div>`).join("") + `</div></div>`);
  }

  if (d.carried) parts.push(`<div class="carry"><b>Carry sem novidade:</b> ${md(d.carried)}</div>`);

  if (d.moves.length) {
    parts.push(`<div><h2 class="sec">Movimentos</h2><div class="tw"><table>
      <thead><tr><th>Ticker</th><th>Movimento</th><th>Nota</th></tr></thead><tbody>` +
      d.moves.map((m) => {
        // Emoji do DELTA manda; senao, o sinal a abrir o texto. "~$765-766" nao e queda.
        const bare = m.move.replace(/[✅⚠️➡️❌]/gu, "").trim();
        const sign = bare.match(/^([+-])\s*\d/);
        const cls = /✅/.test(m.move) ? "up"
          : /⚠️|❌/.test(m.move) ? "down"
          : sign ? (sign[1] === "+" ? "up" : "down") : "flat";
        const glyph = { up: "▲", down: "▼", flat: "→" }[cls];
        return `<tr><td class="k">${esc(m.ticker)}</td>` +
          `<td class="dir ${cls} num"><span aria-hidden="true">${glyph}</span> ${esc(bare)}</td>` +
          `<td class="w">${esc(m.note)}</td></tr>`;
      }).join("") + `</tbody></table></div></div>`);
  }

  const nn = d.newNames.length
    ? `<div class="tw"><table><thead><tr>${Object.keys(d.newNames[0]).map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
      d.newNames.map((r) => `<tr>${Object.values(r).map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`
    : `<div class="empty">${md(d.newNamesText) || "Sem nomes novos."}</div>`;
  parts.push(`<div><h2 class="sec">Novos nomes</h2>${nn}</div>`);

  if (d.unchanged) parts.push(`<div class="carry">${md(d.unchanged)}</div>`);
  document.getElementById("p-hoje").innerHTML = parts.join("");
})();

/* ── Carteira ── */
(function () {
  const { rec, portfolio: pf } = D;
  const parts = [];

  if (rec.basket.length) {
    const spent = rec.basket.reduce((s, b) => s + b.amount, 0);
    parts.push(`<div class="hero">
      <div class="hero-head">
        <p class="eyebrow">O cabaz deste mes</p>
        <span class="amt num">€${spent}</span>
      </div>
      <ol class="basket">` + rec.basket.map((b) => `
        <li>
          <span class="line-amt num">€${b.amount}</span>
          <span class="line-id">
            <strong>${esc(b.pick.ticker)}</strong>
            <span class="co">${esc(b.pick.name)}</span>
          </span>
          <span class="line-th">${esc(b.theme)}<em>${pct(b.gap)} vs alvo</em></span>
          <span class="line-cat">${esc(b.pick.catalyst)}</span>
        </li>`).join("") + `</ol>
      <p class="why">Reparticao proporcional ao desvio face ao alvo. Executa como
        <strong>planos programados</strong> — €0 de comissao. Em ordens avulsas sao
        €${rec.basket.length} de settlement, ${((rec.basket.length / spent) * 100).toFixed(0)}% do aporte.</p>
    </div>`);

    const alts = rec.basket.filter((b) => b.alternatives.length);
    if (alts.length) {
      parts.push(`<div class="carry"><b>Alternativas por tema:</b> ` +
        alts.map((b) => `${esc(b.theme)} — ` +
          b.alternatives.map((a) => esc(a.ticker)).join(", ")).join(" · ") + `</div>`);
    }
  } else {
    parts.push(`<div class="hero hero-empty"><p class="eyebrow">O cabaz deste mes</p>
      <p class="why">Nenhum candidato passou o filtro — todos os nomes dos temas mais descobertos estao travados por flag, lockup, praca por confirmar ou marcados como indisponiveis.</p></div>`);
  }

  // Folga de 25% para a marca de alvo nunca encostar a borda da barra.
  const max = Math.max(...rec.rows.map((r) => Math.max(r.pct, r.actual)), 1) * 1.25;
  const inBasket = new Set(rec.basket.map((b) => b.theme));
  parts.push(`<div><h2 class="sec">Alocacao — actual vs alvo</h2><div class="alloc">` +
    [...rec.rows].sort((a, b) => b.gap - a.gap).map((r) => `
      <div class="alloc-row ${inBasket.has(r.theme) ? "lead" : ""}" title="${esc(r.theme)}: ${r.actual.toFixed(1)}% actual, alvo ${r.pct}%">
        <span class="nm">${esc(r.theme)}</span>
        <span class="track">
          <span class="fill" style="width:${Math.max((r.actual / max) * 100, 0.8)}%"></span>
          <span class="mark" style="left:${(r.pct / max) * 100}%"></span>
        </span>
        <span class="val num">${r.actual.toFixed(0)}% / ${r.pct}%</span>
      </div>`).join("") +
    `</div><div class="alloc-key">
      <span><i style="background:var(--accent)"></i>Peso actual</span>
      <span><i style="background:var(--ink);width:2px"></i>Alvo</span>
    </div></div>`);

  const pos = pf.positions;
  parts.push(`<div><h2 class="sec">Posicoes</h2>` + (pos.length ? `<div class="tw"><table>
    <thead><tr><th>Data</th><th>Ticker</th><th>Nome</th><th>Tema</th><th>Unidades</th><th>Custo</th><th>Valor</th></tr></thead>
    <tbody>` + pos.map((p) => `<tr>
      <td class="num">${esc(p.date)}</td><td class="k">${esc(p.ticker)}</td><td>${esc(p.name)}</td>
      <td>${esc(p.theme)}</td><td class="num">${esc(p.units)}</td>
      <td class="num">€${p.cost.toFixed(2)}</td><td class="num">${p.value ? "€" + p.value.toFixed(2) : "—"}</td>
    </tr>`).join("") + `</tbody></table></div>
    <p class="lede" style="margin-top:12px">Total investido: <span class="num">€${pos.reduce((s, p) => s + p.cost, 0).toFixed(2)}</span>${rec.total ? ` · valor actual <span class="num">€${rec.total.toFixed(2)}</span>` : ""}</p>`
    : `<div class="empty">Carteira vazia. Regista a primeira compra em <strong>PORTFOLIO.md</strong> e esta vista ganha vida.</div>`) + `</div>`);

  document.getElementById("p-carteira").innerHTML = parts.join("");
})();


/* ── Tese ── */
(function () {
  const t = D.thesis;
  const host = document.getElementById("p-tese");
  if (!t.names.length) {
    host.innerHTML = `<div class="empty">Ainda sem tese profunda. Corre a rotina de sabado
      (<strong>prompts/10-tese-profunda.md</strong>) e os nomes da carteira aparecem aqui.</div>`;
    return;
  }

  const slug = (x) => "th-" + x.toLowerCase().replace(/[^a-z0-9]/g, "");
  host.innerHTML = `<p class="lede">${esc(t.intro)}</p>
    <nav class="thesis-nav" aria-label="Nomes analisados">` +
      t.names.map((n) => `<a href="#${slug(n.ticker)}"><b>${esc(n.ticker)}</b>${esc(n.name)}</a>`).join("") +
    `</nav>
    <div class="thesis">` + t.names.map((n) => `
      <article id="${slug(n.ticker)}">
        <header class="th-head">
          <div class="th-title">
            <span class="tk">${esc(n.ticker)}</span>
            <h3>${esc(n.name)}</h3>
            ${n.verdictKey ? `<span class="verdict" data-v="${esc(n.verdictKey)}" title="${esc(n.verdict)}">${esc(n.verdictKey)}</span>` : ""}
          </div>
          <div class="th-meta">
            <span>${esc(n.theme)}</span>
            ${n.why ? `<span><span class="k">porque entrou:</span> ${esc(n.why)}</span>` : ""}
            ${n.confidence ? `<span><span class="k">confianca:</span> ${esc(n.confidence)}</span>` : ""}
          </div>
        </header>
        <div class="lens">` +
          n.lenses.map((l) => `<section>
            <h4>${esc(l.title)}</h4>
            <div class="prose">${rich(l.body, /Cenario/i.test(l.title) ? "scen" : "")}</div>
          </section>`).join("") +
          (n.falsifier ? `<p class="falsifier"><b>Falsificador</b><span>${md(n.falsifier)}</span></p>` : "") +
        `</div>
      </article>`).join("") + `</div>`;

  // A jump-nav e a unica navegacao util com cinco textos longos — mas o hash
  // muda de separador se o utilizador voltar mais tarde, por isso e interceptada.
  host.querySelectorAll(".thesis-nav a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById(a.getAttribute("href").slice(1))
      ?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }));
})();

/* ── Buy-list ── */
(function () {
  const b = D.buylist;
  const flag = {};
  b.carry.forEach((c) => (flag[c.ticker] = c));
  let sort = { k: "score", d: -1 };

  const host = document.getElementById("p-buylist");
  host.innerHTML = `<p class="lede">Buy-list de ${esc(b.date)} — ${b.picks.length} nomes no perimetro. A €${D.portfolio.monthly}/mes compras 1-2 por mes: isto e o funil, nao a lista de compras.</p>
    <div><h2 class="sec">Candidatos</h2><div class="tw"><table id="blt">
      <thead><tr>
        <th data-k="score">Score</th><th data-k="ticker">Ticker</th><th data-k="name">Nome</th>
        <th data-k="theme">Tema</th><th data-k="account">Conta</th><th data-k="entry">Entrada</th>
        <th>Catalisador</th><th>Flag</th>
      </tr></thead><tbody></tbody>
    </table></div></div>
    ${b.carry.length ? `<div><h2 class="sec">Alertas de carry</h2><div class="tw"><table><thead><tr><th>Ticker</th><th>Flag</th><th>Nota</th></tr></thead><tbody>` +
      b.carry.map((c) => `<tr><td class="k">${esc(c.ticker)}</td><td><span class="chip ${/INVALIDADO/i.test(c.flag) ? "high" : "warn"}">${esc(c.flag.replace(/[⚠️]/g, "").trim())}</span></td><td class="w">${esc(c.note)}</td></tr>`).join("") +
      `</tbody></table></div></div>` : ""}
    ${b.excluded.length ? `<div><h2 class="sec">Fora do perimetro</h2><div class="tw"><table><thead><tr><th>Ticker</th><th>Nome</th><th>Motivo</th></tr></thead><tbody>` +
      b.excluded.map((x) => `<tr><td class="k">${esc(x.ticker)}</td><td>${esc(x.name)}</td><td class="w">${esc(x.reason)}</td></tr>`).join("") +
      `</tbody></table></div></div>` : ""}`;

  const tbody = host.querySelector("#blt tbody");
  function draw() {
    const rows = [...b.picks].sort((x, y) => {
      const a = x[sort.k], c = y[sort.k];
      if (typeof a === "number") return (a - c) * sort.d;
      return String(a).localeCompare(String(c)) * sort.d;
    });
    tbody.innerHTML = rows.map((p) => {
      const f = flag[p.ticker];
      return `<tr>
        <td><span class="sc num" data-s="${p.score}">${p.score}</span></td>
        <td class="k">${esc(p.ticker)}</td><td>${esc(p.name)}</td><td>${esc(p.theme)}</td>
        <td><span class="chip" data-acct="${esc(p.account)}">${esc(p.account)}</span></td><td class="num">${esc(p.entry)}</td>
        <td class="w">${esc(p.catalyst)}</td>
        <td>${f ? `<span class="chip ${/INVALIDADO/i.test(f.flag) ? "high" : "warn"}" title="${esc(f.note)}">${esc(f.flag.replace(/[⚠️]/g, "").trim())}</span>` : ""}</td>
      </tr>`;
    }).join("");
    host.querySelectorAll("#blt th[data-k]").forEach((th) => {
      th.innerHTML = th.innerHTML.replace(/\s*<span class="ar">.*?<\/span>/, "") +
        (th.dataset.k === sort.k ? `<span class="ar">${sort.d === 1 ? " ▲" : " ▼"}</span>` : "");
    });
  }
  host.querySelectorAll("#blt th[data-k]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.k;
    sort = { k, d: sort.k === k ? -sort.d : k === "score" ? -1 : 1 };
    draw();
  }));
  draw();
})();

/* ── Semana ── */
(function () {
  const w = D.weekly;
  document.getElementById("p-semana").innerHTML = w.blocks.length
    ? `<p class="lede">Sintese semanal de ${esc(w.date)}.</p><div class="wk">` +
      w.blocks.map((s) => `<article><h3>${esc(s.title)}</h3><div class="body">${md(s.body)}</div></article>`).join("") + `</div>`
    : `<div class="empty">Ainda sem sintese semanal.</div>`;
})();

show(localStorage.getItem("scanner_tab") || "hoje");
</script>
