<style>
/* ═══ Tokens — dark-first (.impeccable.md: refined dark / warm neutrals / gold) ═══ */
:root {
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;

  --bg:          oklch(10% 0.008 55);
  --surface:     oklch(13.5% 0.008 55);
  --surface-2:   oklch(17% 0.008 55);
  --hover:       oklch(20% 0.01 55);
  --line:        oklch(22% 0.008 55);
  --line-soft:   oklch(17% 0.006 55);

  --ink:         oklch(93% 0.01 55);
  --ink-2:       oklch(68% 0.01 55);
  --ink-3:       oklch(48% 0.008 55);

  --accent:      oklch(76% 0.13 78);
  --accent-dim:  oklch(76% 0.13 78 / 0.14);
  --accent-line: oklch(76% 0.13 78 / 0.35);

  --good:        oklch(72% 0.15 148);
  --good-dim:    oklch(72% 0.15 148 / 0.13);
  --bad:         oklch(68% 0.19 25);
  --bad-dim:     oklch(68% 0.19 25 / 0.13);
  --warn:        oklch(78% 0.14 82);
  --warn-dim:    oklch(78% 0.14 82 / 0.13);

  --weight: 350;
  --shadow: none;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        oklch(97.5% 0.005 65);
    --surface:   oklch(100% 0.002 65);
    --surface-2: oklch(95% 0.006 65);
    --hover:     oklch(93% 0.008 65);
    --line:      oklch(88% 0.007 65);
    --line-soft: oklch(93% 0.005 65);

    --ink:       oklch(20% 0.012 55);
    --ink-2:     oklch(45% 0.011 55);
    --ink-3:     oklch(62% 0.009 55);

    --accent:      oklch(52% 0.13 62);
    --accent-dim:  oklch(52% 0.13 62 / 0.10);
    --accent-line: oklch(52% 0.13 62 / 0.30);

    --good:      oklch(46% 0.14 148);
    --good-dim:  oklch(46% 0.14 148 / 0.10);
    --bad:       oklch(49% 0.18 25);
    --bad-dim:   oklch(49% 0.18 25 / 0.10);
    --warn:      oklch(52% 0.13 72);
    --warn-dim:  oklch(52% 0.13 72 / 0.12);

    --weight: 400;
    --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);
  }
}

:root[data-theme="light"] {
  --bg:        oklch(97.5% 0.005 65);
  --surface:   oklch(100% 0.002 65);
  --surface-2: oklch(95% 0.006 65);
  --hover:     oklch(93% 0.008 65);
  --line:      oklch(88% 0.007 65);
  --line-soft: oklch(93% 0.005 65);

  --ink:       oklch(20% 0.012 55);
  --ink-2:     oklch(45% 0.011 55);
  --ink-3:     oklch(62% 0.009 55);

  --accent:      oklch(52% 0.13 62);
  --accent-dim:  oklch(52% 0.13 62 / 0.10);
  --accent-line: oklch(52% 0.13 62 / 0.30);

  --good:      oklch(46% 0.14 148);
  --good-dim:  oklch(46% 0.14 148 / 0.10);
  --bad:       oklch(49% 0.18 25);
  --bad-dim:   oklch(49% 0.18 25 / 0.10);
  --warn:      oklch(52% 0.13 72);
  --warn-dim:  oklch(52% 0.13 72 / 0.12);

  --weight: 400;
  --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);
}

*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: var(--weight);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.num { font-variant-numeric: tabular-nums; }

/* ═══ Header ═══ */
.top {
  display: flex; align-items: baseline; gap: 16px;
  padding: 22px 32px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.wordmark span { color: var(--accent); }
.top .meta { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--ink-3); }

.theme-btn {
  background: none; border: 1px solid var(--line); color: var(--ink-3);
  width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
  display: grid; place-items: center; transition: color .15s, border-color .15s;
}
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.theme-btn svg { width: 15px; height: 15px; }
:root[data-theme="light"] .i-sun { display: none; }
:root:not([data-theme="dark"]) .i-sun { display: none; }
:root:not([data-theme="dark"]) .i-moon { display: block; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .i-moon { display: none; }
  :root:not([data-theme="dark"]) .i-sun { display: block; }
}
:root[data-theme="dark"] .i-sun { display: block; }
:root[data-theme="dark"] .i-moon { display: none; }
:root[data-theme="light"] .i-moon { display: block; }

/* ═══ Tabs ═══ */
.tabs { display: flex; gap: 2px; padding: 0 32px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.tab {
  appearance: none; background: none; border: none; font: inherit;
  padding: 13px 16px; font-size: 13px; font-weight: 500; color: var(--ink-3);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .15s;
}
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .badge {
  display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 20px;
  background: var(--surface-2); color: var(--ink-3); font-size: 11px; font-weight: 600;
}
.tab[aria-selected="true"] .badge { background: var(--accent-dim); color: var(--accent); }

/* ═══ Layout ═══ */
main { max-width: 1080px; margin: 0 auto; padding: 34px 32px 90px; }
.panel { display: none; flex-direction: column; gap: 30px; }
.panel.on { display: flex; }

.lede { font-size: 13px; color: var(--ink-3); margin: -8px 0 0; max-width: 82ch; }

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .89em; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-2); color: var(--ink-2);
}

h2.sec {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); margin: 0 0 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line-soft);
}

.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; box-shadow: var(--shadow); }

/* ═══ Hero — a compra do mes ═══ */
.hero { padding: 30px 32px; border: 1px solid var(--accent-line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.hero .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin: 0; }
.hero-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.hero .amt { margin-left: auto; font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
.hero .why { margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-3); max-width: 68ch; }
.hero .why strong { color: var(--ink-2); font-weight: 600; }
.hero-empty { padding: 30px 32px; }

/* Linhas do cabaz */
.basket { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.basket li {
  display: grid; grid-template-columns: 62px minmax(150px, 1.1fr) minmax(120px, .9fr) 1.4fr;
  align-items: baseline; gap: 18px;
  padding: 14px 0; border-top: 1px solid var(--line-soft);
}
.basket li:first-child { border-top: none; padding-top: 0; }
.line-amt { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.line-id strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.line-id .co { display: block; font-size: 12.5px; color: var(--ink-3); }
.line-th { font-size: 12.5px; color: var(--ink-2); }
.line-th em { display: block; font-style: normal; font-size: 11.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
.line-cat { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 720px) {
  .basket li { grid-template-columns: 58px 1fr; gap: 6px 14px; }
  .line-th, .line-cat { grid-column: 2; }
}

/* ═══ Barras de alocacao (alvo vs actual) ═══ */
.alloc { display: flex; flex-direction: column; gap: 3px; }
.alloc-row {
  display: grid; grid-template-columns: 168px 1fr 74px; align-items: center; gap: 16px;
  padding: 9px 12px; border-radius: 8px; transition: background .15s;
}
.alloc-row:hover { background: var(--hover); }
.alloc-row .nm { font-size: 13px; color: var(--ink-2); }
.alloc-row.lead .nm { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 22px; background: var(--surface-2); border-radius: 4px; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; min-width: 2px; }
.alloc-row:not(.lead) .fill { background: var(--ink-3); }
.mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.mark::after {
  content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--ink);
}
.alloc-row .val { font-size: 12.5px; color: var(--ink-3); text-align: right; }
.alloc-key { display: flex; gap: 20px; margin-top: 14px; font-size: 11.5px; color: var(--ink-3); }
.alloc-key i { display: inline-block; width: 11px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ═══ Alertas ═══ */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: grid; grid-template-columns: 3px 1fr; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-soft); }
.alert .stripe { background: var(--ink-3); }
.alert[data-l="high"] .stripe { background: var(--bad); }
.alert[data-l="warn"] .stripe { background: var(--warn); }
.alert[data-l="info"] .stripe { background: var(--good); }
.alert .in { padding: 15px 18px; }
.alert .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.alert .t { font-size: 13.5px; font-weight: 600; }
.alert p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 74ch; }

.chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--ink-2); }
.chip.tick { background: var(--accent-dim); color: var(--accent); }
.chip[data-acct="verificar"] { background: var(--warn-dim); color: var(--warn); }
.chip[data-acct="cto-pea"] { background: var(--good-dim); color: var(--good); }
.chip.high { background: var(--bad-dim); color: var(--bad); }
.chip.warn { background: var(--warn-dim); color: var(--warn); }
.chip.info { background: var(--good-dim); color: var(--good); }

.carry { padding: 14px 18px; font-size: 12.5px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; }
.carry b { color: var(--ink-2); font-weight: 600; }

/* ═══ Tabelas ═══ */
.tw { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 11px 14px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
th[data-k] { cursor: pointer; user-select: none; }
th[data-k]:hover { color: var(--ink-2); }
th .ar { color: var(--accent); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--hover); }
td.k { color: var(--ink); font-weight: 500; white-space: nowrap; }
td.w { min-width: 260px; font-size: 12.5px; }
.sc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.sc[data-s="5"] { background: var(--accent-dim); color: var(--accent); }
.sc[data-s="4"] { background: var(--good-dim); color: var(--good); }
.dir { font-weight: 600; white-space: nowrap; }
.dir.up { color: var(--good); }
.dir.down { color: var(--bad); }
.dir.flat { color: var(--ink-3); }

.empty { padding: 30px; text-align: center; color: var(--ink-3); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }

/* ═══ Sintese ═══ */
.wk { display: flex; flex-direction: column; gap: 24px; }
.wk article { padding: 22px 26px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; }
.wk h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; text-wrap: balance; }
.wk .body { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; max-width: 78ch; overflow-wrap: break-word; }
.wk .body strong { color: var(--ink); font-weight: 600; }

.foot { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-3); }

/* ═══ Tese profunda ═══ */
.thesis-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.thesis-nav a {
  display: inline-flex; align-items: baseline; gap: 7px; text-decoration: none;
  padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); font-size: 12px; color: var(--ink-2);
  transition: border-color .15s, color .15s;
}
.thesis-nav a:hover { border-color: var(--accent-line); color: var(--ink); }
.thesis-nav b { font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }

.thesis { display: flex; flex-direction: column; gap: 42px; }
.thesis > article { scroll-margin-top: 16px; }

.th-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.th-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.th-title h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.th-title .tk {
  font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px;
  border-radius: 6px; background: var(--accent-dim); color: var(--accent);
}
.th-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 9px; font-size: 12px; color: var(--ink-3); }
.th-meta .k { color: var(--ink-2); }

.verdict {
  margin-left: auto; display: inline-flex; align-items: baseline; gap: 8px;
  padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.verdict::before { content: "valor"; font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }
.verdict[data-v="caro"]   { background: var(--warn-dim); color: var(--warn); border-color: transparent; }
.verdict[data-v="barato"] { background: var(--good-dim); color: var(--good); border-color: transparent; }
.verdict[data-v="justo"]  { background: var(--surface-2); color: var(--ink); }

.lens { display: flex; flex-direction: column; gap: 26px; }
.lens section { display: flex; flex-direction: column; gap: 10px; }
.lens h4 {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); margin: 0;
}
.lens .prose { display: flex; flex-direction: column; gap: 13px; }
/* A largura de leitura e do texto; a tabela de cenarios usa a largura toda. */
.lens .prose > p { font-size: 14px; line-height: 1.72; color: var(--ink-2); max-width: 68ch; }
.lens .prose strong { color: var(--ink); font-weight: 600; }
.lens .prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }
.lens .prose a:hover { border-bottom-color: var(--accent); }

.scen td:first-child { color: var(--ink); font-weight: 600; white-space: nowrap; }
.prob { font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
.prob[data-p="alta"]  { color: var(--ink); }
.prob[data-p="baixa"] { color: var(--ink-3); }

.falsifier {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline;
  padding: 15px 18px; border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-2); max-width: 74ch;
}
.falsifier b {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); white-space: nowrap;
}
.falsifier strong { color: var(--ink); font-weight: 600; }

@media (max-width: 720px) {
  .th-title h3 { font-size: 17px; }
  .verdict { margin-left: 0; }
  .falsifier { grid-template-columns: 1fr; gap: 6px; }

  /* Quatro colunas de prosa nao cabem num telemovel — cada cenario vira um cartao. */
  .scen thead { display: none; }
  .scen, .scen tbody, .scen tr, .scen td { display: block; width: 100%; }
  .scen tr { padding: 14px 0 16px; border-bottom: 1px solid var(--line-soft); }
  .scen tr:last-child { border-bottom: none; }
  .scen tbody tr:hover { background: none; }
  .scen td { border: none; padding: 3px 15px; }
  .scen td[data-l]::before {
    content: attr(data-l); display: block; margin-bottom: 1px;
    font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .09em; color: var(--ink-3);
  }
  .scen td:first-child { font-size: 15px; padding-bottom: 8px; }
}

@media (max-width: 720px) {
  .top, .tabs, main { padding-left: 18px; padding-right: 18px; }
  .alloc-row { grid-template-columns: 108px 1fr 62px; gap: 10px; }
  .hero { padding: 24px 20px; }
  .hero .amt { margin-left: 0; }
}
</style>

<script id="page-source" type="application/json">"\u003c!doctype html>\n\u003chtml lang=\"pt\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Investment Scanner\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n\u003cstyle>\n/* ═══ Tokens — dark-first (.impeccable.md: refined dark / warm neutrals / gold) ═══ */\n:root {\n  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;\n\n  --bg:          oklch(10% 0.008 55);\n  --surface:     oklch(13.5% 0.008 55);\n  --surface-2:   oklch(17% 0.008 55);\n  --hover:       oklch(20% 0.01 55);\n  --line:        oklch(22% 0.008 55);\n  --line-soft:   oklch(17% 0.006 55);\n\n  --ink:         oklch(93% 0.01 55);\n  --ink-2:       oklch(68% 0.01 55);\n  --ink-3:       oklch(48% 0.008 55);\n\n  --accent:      oklch(76% 0.13 78);\n  --accent-dim:  oklch(76% 0.13 78 / 0.14);\n  --accent-line: oklch(76% 0.13 78 / 0.35);\n\n  --good:        oklch(72% 0.15 148);\n  --good-dim:    oklch(72% 0.15 148 / 0.13);\n  --bad:         oklch(68% 0.19 25);\n  --bad-dim:     oklch(68% 0.19 25 / 0.13);\n  --warn:        oklch(78% 0.14 82);\n  --warn-dim:    oklch(78% 0.14 82 / 0.13);\n\n  --weight: 350;\n  --shadow: none;\n}\n\n@media (prefers-color-scheme: light) {\n  :root:not([data-theme=\"dark\"]) {\n    --bg:        oklch(97.5% 0.005 65);\n    --surface:   oklch(100% 0.002 65);\n    --surface-2: oklch(95% 0.006 65);\n    --hover:     oklch(93% 0.008 65);\n    --line:      oklch(88% 0.007 65);\n    --line-soft: oklch(93% 0.005 65);\n\n    --ink:       oklch(20% 0.012 55);\n    --ink-2:     oklch(45% 0.011 55);\n    --ink-3:     oklch(62% 0.009 55);\n\n    --accent:      oklch(52% 0.13 62);\n    --accent-dim:  oklch(52% 0.13 62 / 0.10);\n    --accent-line: oklch(52% 0.13 62 / 0.30);\n\n    --good:      oklch(46% 0.14 148);\n    --good-dim:  oklch(46% 0.14 148 / 0.10);\n    --bad:       oklch(49% 0.18 25);\n    --bad-dim:   oklch(49% 0.18 25 / 0.10);\n    --warn:      oklch(52% 0.13 72);\n    --warn-dim:  oklch(52% 0.13 72 / 0.12);\n\n    --weight: 400;\n    --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);\n  }\n}\n\n:root[data-theme=\"light\"] {\n  --bg:        oklch(97.5% 0.005 65);\n  --surface:   oklch(100% 0.002 65);\n  --surface-2: oklch(95% 0.006 65);\n  --hover:     oklch(93% 0.008 65);\n  --line:      oklch(88% 0.007 65);\n  --line-soft: oklch(93% 0.005 65);\n\n  --ink:       oklch(20% 0.012 55);\n  --ink-2:     oklch(45% 0.011 55);\n  --ink-3:     oklch(62% 0.009 55);\n\n  --accent:      oklch(52% 0.13 62);\n  --accent-dim:  oklch(52% 0.13 62 / 0.10);\n  --accent-line: oklch(52% 0.13 62 / 0.30);\n\n  --good:      oklch(46% 0.14 148);\n  --good-dim:  oklch(46% 0.14 148 / 0.10);\n  --bad:       oklch(49% 0.18 25);\n  --bad-dim:   oklch(49% 0.18 25 / 0.10);\n  --warn:      oklch(52% 0.13 72);\n  --warn-dim:  oklch(52% 0.13 72 / 0.12);\n\n  --weight: 400;\n  --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);\n}\n\n*, *::before, *::after { box-sizing: border-box; }\nh1, h2, h3, h4, p, figure, blockquote { margin: 0; }\nul, ol { margin: 0; padding: 0; list-style: none; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nimg, svg { max-width: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--font);\n  font-weight: var(--weight);\n  font-size: 15px;\n  line-height: 1.6;\n  -webkit-font-smoothing: antialiased;\n}\n\n:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }\n@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }\n\n.num { font-variant-numeric: tabular-nums; }\n\n/* ═══ Header ═══ */\n.top {\n  display: flex; align-items: baseline; gap: 16px;\n  padding: 22px 32px 18px;\n  border-bottom: 1px solid var(--line-soft);\n}\n.wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }\n.wordmark span { color: var(--accent); }\n.top .meta { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--ink-3); }\n\n.theme-btn {\n  background: none; border: 1px solid var(--line); color: var(--ink-3);\n  width: 30px; height: 30px; border-radius: 7px; cursor: pointer;\n  display: grid; place-items: center; transition: color .15s, border-color .15s;\n}\n.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }\n.theme-btn svg { width: 15px; height: 15px; }\n:root[data-theme=\"light\"] .i-sun { display: none; }\n:root:not([data-theme=\"dark\"]) .i-sun { display: none; }\n:root:not([data-theme=\"dark\"]) .i-moon { display: block; }\n@media (prefers-color-scheme: light) {\n  :root:not([data-theme=\"dark\"]) .i-moon { display: none; }\n  :root:not([data-theme=\"dark\"]) .i-sun { display: block; }\n}\n:root[data-theme=\"dark\"] .i-sun { display: block; }\n:root[data-theme=\"dark\"] .i-moon { display: none; }\n:root[data-theme=\"light\"] .i-moon { display: block; }\n\n/* ═══ Tabs ═══ */\n.tabs { display: flex; gap: 2px; padding: 0 32px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }\n.tab {\n  appearance: none; background: none; border: none; font: inherit;\n  padding: 13px 16px; font-size: 13px; font-weight: 500; color: var(--ink-3);\n  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;\n  transition: color .15s;\n}\n.tab:hover { color: var(--ink-2); }\n.tab[aria-selected=\"true\"] { color: var(--ink); border-bottom-color: var(--accent); }\n.tab .badge {\n  display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 20px;\n  background: var(--surface-2); color: var(--ink-3); font-size: 11px; font-weight: 600;\n}\n.tab[aria-selected=\"true\"] .badge { background: var(--accent-dim); color: var(--accent); }\n\n/* ═══ Layout ═══ */\nmain { max-width: 1080px; margin: 0 auto; padding: 34px 32px 90px; }\n.panel { display: none; flex-direction: column; gap: 30px; }\n.panel.on { display: flex; }\n\n.lede { font-size: 13px; color: var(--ink-3); margin: -8px 0 0; max-width: 82ch; }\n\ncode {\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  font-size: .89em; padding: 1px 5px; border-radius: 4px;\n  background: var(--surface-2); color: var(--ink-2);\n}\n\nh2.sec {\n  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;\n  color: var(--ink-3); margin: 0 0 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line-soft);\n}\n\n.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; box-shadow: var(--shadow); }\n\n/* ═══ Hero — a compra do mes ═══ */\n.hero { padding: 30px 32px; border: 1px solid var(--accent-line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }\n.hero .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin: 0; }\n.hero-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }\n.hero .amt { margin-left: auto; font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }\n.hero .why { margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-3); max-width: 68ch; }\n.hero .why strong { color: var(--ink-2); font-weight: 600; }\n.hero-empty { padding: 30px 32px; }\n\n/* Linhas do cabaz */\n.basket { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }\n.basket li {\n  display: grid; grid-template-columns: 62px minmax(150px, 1.1fr) minmax(120px, .9fr) 1.4fr;\n  align-items: baseline; gap: 18px;\n  padding: 14px 0; border-top: 1px solid var(--line-soft);\n}\n.basket li:first-child { border-top: none; padding-top: 0; }\n.line-amt { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }\n.line-id strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }\n.line-id .co { display: block; font-size: 12.5px; color: var(--ink-3); }\n.line-th { font-size: 12.5px; color: var(--ink-2); }\n.line-th em { display: block; font-style: normal; font-size: 11.5px; color: var(--accent); font-variant-numeric: tabular-nums; }\n.line-cat { font-size: 12.5px; color: var(--ink-3); }\n@media (max-width: 720px) {\n  .basket li { grid-template-columns: 58px 1fr; gap: 6px 14px; }\n  .line-th, .line-cat { grid-column: 2; }\n}\n\n/* ═══ Barras de alocacao (alvo vs actual) ═══ */\n.alloc { display: flex; flex-direction: column; gap: 3px; }\n.alloc-row {\n  display: grid; grid-template-columns: 168px 1fr 74px; align-items: center; gap: 16px;\n  padding: 9px 12px; border-radius: 8px; transition: background .15s;\n}\n.alloc-row:hover { background: var(--hover); }\n.alloc-row .nm { font-size: 13px; color: var(--ink-2); }\n.alloc-row.lead .nm { color: var(--ink); font-weight: 600; }\n.track { position: relative; height: 22px; background: var(--surface-2); border-radius: 4px; }\n.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; min-width: 2px; }\n.alloc-row:not(.lead) .fill { background: var(--ink-3); }\n.mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }\n.mark::after {\n  content: \"\"; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);\n  border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--ink);\n}\n.alloc-row .val { font-size: 12.5px; color: var(--ink-3); text-align: right; }\n.alloc-key { display: flex; gap: 20px; margin-top: 14px; font-size: 11.5px; color: var(--ink-3); }\n.alloc-key i { display: inline-block; width: 11px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }\n\n/* ═══ Alertas ═══ */\n.alerts { display: flex; flex-direction: column; gap: 10px; }\n.alert { display: grid; grid-template-columns: 3px 1fr; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-soft); }\n.alert .stripe { background: var(--ink-3); }\n.alert[data-l=\"high\"] .stripe { background: var(--bad); }\n.alert[data-l=\"warn\"] .stripe { background: var(--warn); }\n.alert[data-l=\"info\"] .stripe { background: var(--good); }\n.alert .in { padding: 15px 18px; }\n.alert .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }\n.alert .t { font-size: 13.5px; font-weight: 600; }\n.alert p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 74ch; }\n\n.chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--ink-2); }\n.chip.tick { background: var(--accent-dim); color: var(--accent); }\n.chip[data-acct=\"verificar\"] { background: var(--warn-dim); color: var(--warn); }\n.chip[data-acct=\"cto-pea\"] { background: var(--good-dim); color: var(--good); }\n.chip.high { background: var(--bad-dim); color: var(--bad); }\n.chip.warn { background: var(--warn-dim); color: var(--warn); }\n.chip.info { background: var(--good-dim); color: var(--good); }\n\n.carry { padding: 14px 18px; font-size: 12.5px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; }\n.carry b { color: var(--ink-2); font-weight: 600; }\n\n/* ═══ Tabelas ═══ */\n.tw { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }\ntable { width: 100%; border-collapse: collapse; font-size: 13px; }\nth {\n  text-align: left; padding: 11px 14px; font-size: 11px; font-weight: 600;\n  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3);\n  border-bottom: 1px solid var(--line); white-space: nowrap;\n}\nth[data-k] { cursor: pointer; user-select: none; }\nth[data-k]:hover { color: var(--ink-2); }\nth .ar { color: var(--accent); }\ntd { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }\ntr:last-child td { border-bottom: none; }\ntbody tr:hover { background: var(--hover); }\ntd.k { color: var(--ink); font-weight: 500; white-space: nowrap; }\ntd.w { min-width: 260px; font-size: 12.5px; }\n.sc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }\n.sc[data-s=\"5\"] { background: var(--accent-dim); color: var(--accent); }\n.sc[data-s=\"4\"] { background: var(--good-dim); color: var(--good); }\n.dir { font-weight: 600; white-space: nowrap; }\n.dir.up { color: var(--good); }\n.dir.down { color: var(--bad); }\n.dir.flat { color: var(--ink-3); }\n\n.empty { padding: 30px; text-align: center; color: var(--ink-3); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }\n\n/* ═══ Sintese ═══ */\n.wk { display: flex; flex-direction: column; gap: 24px; }\n.wk article { padding: 22px 26px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; }\n.wk h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; text-wrap: balance; }\n.wk .body { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; max-width: 78ch; overflow-wrap: break-word; }\n.wk .body strong { color: var(--ink); font-weight: 600; }\n\n.foot { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-3); }\n\n/* ═══ Tese profunda ═══ */\n.thesis-nav { display: flex; flex-wrap: wrap; gap: 6px; }\n.thesis-nav a {\n  display: inline-flex; align-items: baseline; gap: 7px; text-decoration: none;\n  padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;\n  background: var(--surface); font-size: 12px; color: var(--ink-2);\n  transition: border-color .15s, color .15s;\n}\n.thesis-nav a:hover { border-color: var(--accent-line); color: var(--ink); }\n.thesis-nav b { font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }\n\n.thesis { display: flex; flex-direction: column; gap: 42px; }\n.thesis > article { scroll-margin-top: 16px; }\n\n.th-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }\n.th-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }\n.th-title h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }\n.th-title .tk {\n  font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px;\n  border-radius: 6px; background: var(--accent-dim); color: var(--accent);\n}\n.th-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 9px; font-size: 12px; color: var(--ink-3); }\n.th-meta .k { color: var(--ink-2); }\n\n.verdict {\n  margin-left: auto; display: inline-flex; align-items: baseline; gap: 8px;\n  padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;\n  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);\n}\n.verdict::before { content: \"valor\"; font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }\n.verdict[data-v=\"caro\"]   { background: var(--warn-dim); color: var(--warn); border-color: transparent; }\n.verdict[data-v=\"barato\"] { background: var(--good-dim); color: var(--good); border-color: transparent; }\n.verdict[data-v=\"justo\"]  { background: var(--surface-2); color: var(--ink); }\n\n.lens { display: flex; flex-direction: column; gap: 26px; }\n.lens section { display: flex; flex-direction: column; gap: 10px; }\n.lens h4 {\n  font-size: 10.5px; font-weight: 600; text-transform: uppercase; ada recomendada pos-lockup |\\n| NXE | 4 | Materiais | neobroker | ~€10 | Rook I milestones CNSC 2026; producao 2029 | uranio high-grade; horizonte medio |\\n| UUUU | 4 | Materiais | neobroker | ~€10 | Phase 1 HREE completa Q4 2026; NdPr ramp | down-trend severo; vigiar suporte |\\n| EXOS.PA | 4 | Geopolitica | neobroker | ~€10 | FY2026 upper end €520-540M; H2 defense | Euronext Paris; EBITDA 33% record |\\n| HAG.DE | 4 | Geopolitica | neobroker | ~€10 | FY2026 €2.75B; Bundeswehr Q3-Q4 | ⚠️ Jefferies Hold; JPMorgan EUR 85; rotacao → R3NK |\\n| KTOS | 4 | Geopolitica | neobroker | ~€10 | Valkyrie 8→40 unidades; Space Force $446.8M | Q2 beat cumprido; JPMorgan Overweight |\\n| PL | 4 | Geopolitica | neobroker | ~€10 | Backlog $900M +79%; defense/intel Q3-Q4 | melhor pick historico coorte Apr-05 |\\n| R3NK.DE | 4 | Geopolitica | neobroker | ~€10 | David Brown Defence Q4 2026; US Army IDIQ $691M | JPMorgan prefere vs HAG.DE; backlog 5.3x TTM |\\n| THEON.AS | 4 | Geopolitica | neobroker | ~€10 | HGH closing H1 2027; NATO procurement | EBITDA >40%; leverage 3.0x |\\n| CRWV | 4 | IA | neobroker | ~€20 | Q3 earnings Nov; FY $12.4-13.2B; Anthropic/Meta | ⚠️ preco ~$90 (vs $105 est. Aug-15); +29% vs entrada |\\n| INOD | 4 | IA | neobroker | ~€10 | CEO transition Sep 30 (Singhal); FY >=40% | ⚠️ -18% vs entrada Jun-20; vigiar Singhal |\\n| IONQ | 4 | IA | neobroker | ~€10 | SkyWater fab H1 2027; FY $280-290M | ⚠️ preco real $46.26 (nao $68 est.); +22% vs entrada |\\n| SOUN | 4 | IA | neobroker | ~€10 | Q3 earnings Nov; FY guidance $230-260M | Q2 record; $6.94 Aug 20; +26% vs entrada Jul-20 |\\n| ASTS | 4 | Espaco | neobroker | ~€10 | Beta D2D service H2 2026; Q3 earnings Nov | ⚠️ Q2 miss operacional; BofA PT $80 |\\n| LUNR | 4 | Espaco | neobroker | ~€10 | IM-3 date confirmacao; SDA contracts | ⚠️⚠️ Q2 miss + CEO insider $14.7M; \"},{\"title\":\"Riscos sistemicos\",\"body\":\"*Cross-tema — afetam multiplos picks simultaneamente.*\\n\\n1. **Concentracao binarios biotech Q3 2026**: VKTX maintenance topline, PRME PM647 IND, QURE BLA AMT-130 — tres eventos binarios no mesmo trimestre. EYPT LUGANO provou que -70% em 24h e literal, nao teorico. Posicoes max 3-5% por pick binario; diversificar datas de catalisador.\\n\\n2. **Correçao de mercado SPY -1.4% esta semana**: SPY $776.34→$765.72. Setembro historicamente e o pior mes do ano para SPY (media -0.5% a -1.5%). Outubro-Novembro tem earnings cluster (NBIS, CRWV, IONQ, SOUN, VIRT, BGC, RKLB). Correçao ate $740-750 possivel antes de novo high.\\n\\n3. **Estimativas de preco sem fonte primaria**: Esta semana IONQ foi corrigido de \\\"$68 est.\\\" para $46.26 real (-32% de diferença). CRWV foi corrigido de \\\"$105 est.\\\" para ~$90. Padrao Licoes #15, #22, #23 — \\\"est.\\\" sem fonte e inventado. Rever todos os precos \\\"est.\\\" no track record com fontes primarias no proximo update.\\n\\n4. **HYPE/CFTC: endorsement nao e aprovacao**: ATH $77.62 foi atingido por catalisador politico-narrativo (Trump). Mecanismo de compliance (KYC on-chain, leverage caps, custody rules) ainda nao definido. Se CFTC anunciar regras onerosas ou processo demorado, correccao -30-40% possivel. Nao aumentar posicao em ATH sem mais clareza regulatoria.\\n\\n5. **Cluster AI compute — NBIS, CRWV, IONQ, SOUN**: Todos dependem de capex AI dos hyperscalers. Se Meta, Google ou Microsoft guiarem para freeze de capex em Q3 earnings (Nov 2026), o sector corrige simultaneamente. Vigiar Meta Q3 Nov — primeiro gate.\\n\\n6. **Rearmamento europeu valuation stretch**: HAG.DE Jefferies Hold, JPMorgan Neutral EUR 85. R3NK.DE, THEON.AS, EXOS.PA todos com valuations elevadas vs historico. Tese de rearmamento intacta mas re-rating individual ficou mais dificil — rotacao intra-sector, nao saida do tema.\\n\\n7. **Correlacao cripto intra-sector**: HYPE +35% esta semana por catalisador especifico. AAVE +15%. ONDO +18% de low. Quando BTC corrige, todos descem independentemente dos catalisadores individuais. Correlacao BTC de HYPE, AAVE, ONDO, MORPHO e estruturalmente alta.\\n\\n8. **Insider selling cluster (persistente)**: LUNR CEO $14.7M (Aug 13 — mesmo dia Q2 miss); RKLB CEO Beck $286M Jul (10b5-1); NBIS vigiar Form 4. Regra: escala > 2% market cap em 3 dias = revisao de posicao.\"},{\"title\":\"O que mudou esta semana\",\"body\":\"*Vs sintese 2026-08-15.*\\n\\n| Ticker | Mudanca | Classificacao |\\n|--------|---------|---------------|\\n| EYPT | LUGANO primary endpoint MISS Aug 17; -69% para $4.57 | ❌ FALHOU BINARIO — REMOVIDA |\\n| HYPE | Trump/CFTC endorsement Aug 19; ATH $77.62 Aug 21; +35% vs semana passada | ✅ NOVO CATALISADOR — atualizado |\\n| CRWV | Q2 $2.58B beat; FY $12.4-13.2B raised; Anthropic+Meta; preco ~$90 | ATUALIZADO + ⚠️ preco revisto Aug-15 |\\n| RKLB | Q2 $234.1M record; Neutron Q4 launchpad \\\"janela estreita\\\"; Iridium $870M/yr | ATUALIZADO |\\n| IONQ | SkyWater concluido Jul 31; preco real $46.26 (nao $68 est.) | ⚠️ CORRECAO PRECO (Licao #23) |\\n| AAVE | +15% esta semana; $98.88; approaching breakout $108 | ATUALIZADO |\\n| ONDO | Abandoned blockchain plans Jul 28 (pivot para rede privada); $0.388 | ⚠️ PIVOT ESTRATEGICO |\\n| VKTX | Maintenance study topline pendente; $34.29 (de $33.12 Aug-15) | CARRY |\\n| PRME | PM647 IND/CTA Q3 pendente; Beam arbitragem confirmada; $3.29 | CARRY |\\n| NBIS | $248.43; Burry short continua; nenhuma actualizacao material | CARRY |\\n| LUNR | Recuperacao de -44% para -9% vs entrada | CARRY |\\n| SPY | -1.4% esta semana ($776.34→$765.72); benchmark Apr-05 baixou de +10.5% para +9.0% | MERCADO |\"}]},\"thesis\":{\"date\":\"2026-08-26\",\"intro\":\"Cinco nomes: os quatro que o dashboard esta a recomendar comprar este mes (LEU, KTOS, RKLB, IONQ) mais o outro score-5 que ficou de fora do cabaz (PRME). Carteira vazia, por isso o perimetro e o que muda uma decisao das proximas semanas. Nao ha alvos de preco aqui — ha juizo com analogia. Nao e conselho de investimento.\",\"names\":[{\"ticker\":\"LEU\",\"name\":\"Centrus Energy\",\"theme\":\"Materiais & Energia\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"O melhor analogo desta empresa e **ela propria, ha doze anos**. A USEC — a antecessora\\ndirecta da Centrus — pediu **Chapter 11 a 5 de Marco de 2014**, depois de nao conseguir\\nencontrar investidores para os ~$4 mil milhoes do American Centrifuge Plant. **O projecto\\nera o mesmo. O sitio era o mesmo: Piketon, Ohio. A tecnologia era a mesma familia de\\ncentrifugas.** A empresa [saiu do Chapter 11 a 30 de Setembro de 2014 como Centrus](https://www.centrusenergy.com/news/centrus-energy-corp-emerges-from-chapter-11-restructuring/),\\ncom nove milhoes de accoes novas e $240,4M de divida nova ([10-K FY2014](https://www.sec.gov/Archives/edgar/data/0001065059/000106505915000012/leu-20141231x10k.htm)).\\nQuem tinha a accao antiga ficou sem nada.\\n\\n**O que e diferente agora:** ha um cliente que paga adiantado. O DOE atribuiu um contrato\\nde HALEU que ja vai na Fase III e [foi prolongado por mais um ano em Junho de 2025](https://www.ans.org/news/2025-06-25/article-7134/doe-extends-centruss-haleu-production-contract-by-one-year/),\\ne ha um award de $900M a suportar a expansao de Piketon. Em 2014 o Estado queria o produto\\nmas nao assinava o cheque; em 2026 assina.\\n\\n**O que e igual:** a fabrica continua por construir e a empresa continua a nao a\\nautofinanciar. A propria Centrus diz esperar as **primeiras centrifugas novas em Piketon\\nem 2029**. Entre a narrativa e o caixa vao tres anos — exactamente o intervalo em que a\\nUSEC morreu.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"Tres coisas que nao estao no comunicado:\\n\\n**Todo o HALEU produzido ao abrigo do contrato e propriedade do DOE.** A Centrus e um\\ntransformador a feitio para o Estado, nao um vendedor no mercado. Isso significa que a\\nconta de resultados de curto prazo **nao escala com o preco do uranio** — sobe o preco,\\nnao muda a factura. Metade das pessoas que compram LEU como \\\"play do uranio\\\" esta a comprar\\noutra coisa.\\n\\n**A escala contratada e minuscula.** A Fase III obriga a pelo menos **900 kg de HALEU UF6\\npor ano**. Um unico nucleo inicial de reactor avancado esta na ordem das toneladas. Nao ha\\nhoje reactores a HALEU em operacao comercial — a procura e uma promessa de politica publica,\\nnao uma carteira de encomendas.\\n\\n**A tese certa pela razao errada:** se o HALEU for mesmo escasso e caro, o racional para os\\nprojectistas de SMR nao e esperar — e **redesenhar para LEU+ (enriquecimento ate ~10%)**,\\nque ja tem cadeia de fornecimento. O monopolio dissolve-se sem uma unica noticia ma sobre\\na Centrus. A jusante, quem ganha com o programa nuclear americano sao os fabricantes de\\ncombustivel e a logistica de deconversao e transporte, nao necessariamente quem enriquece.\\n\\n**Correccao a buy-list:** o catalisador registado — \\\"nova centrifuga Oak Ridge Q4 2026\\\" —\\nmistura duas coisas. Oak Ridge e o centro de **fabrico** de centrifugas, e a\\n[expansao anunciada em Janeiro de 2026](https://www.ans.org/news/2026-01-26/article-7697/centrus-to-expand-oak-ridge-facility/)\\ne financiada em parte por $50M de um fundo estadual do Tennessee. Capacidade de\\n**enriquecimento** nova e em Piketon, em 2029. E um marco industrial, nao um marco de receita.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"Nao por um modelo proprio — por comparacao com a propria historia da accao. Os screeners\\npublicos poem o P/E TTM algures entre ~57x e ~80x contra uma **mediana a 5 anos de 14,6x**\\npara a mesma empresa (GuruFocus e Simply Wall St, 2026 — opiniao de terceiros, nao facto\\nauditado). Nao e preciso acreditar no numero exacto para ler o sinal: o multiplo esta varias\\nvezes acima do que esta empresa negociou durante meia decada, com a fabrica ainda por\\nconstruir.\\n\\nO segundo sinal e a volatilidade do proprio multiplo. Segundo a Investing.com, a accao caiu\\nde ~$383 em Outubro de 2025 para ~$191,85 em Abril de 2026 — **-52% em seis meses** sem que\\no contrato do DOE ou a data de 2029 se tenham mexido. Quando o preco se move dessa maneira e\\nos factos nao, o que esta a mover-se e o apetite, e o apetite volta a mudar.\",\"verdict\":\"caro\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | Deixa de ser um programa do Estado e passa a ter cliente comercial: um offtake de HALEU com contraparte privada nomeada | Um 8-K a nomear a contraparte de um contrato comercial de HALEU | baixa |\\n| Base | Continua a ser um programa governamental bem financiado com caixa material so no fim da decada; a accao negoceia o sentimento nuclear, nao os resultados | Filings trimestrais a reafirmar 2029 para as primeiras centrifugas de Piketon | alta |\\n| Bear | Expansao de capacidade europeia (Urenco/Orano) ou um corte orcamental encolhe o premio de escassez; ou uma emissao de accoes para financiar Piketon | Apropriacoes do DOE; qualquer 424B de aumento de capital | media |\",\"verdict\":\"\",\"falsifier\":\"um contrato de fornecimento de HALEU assinado com uma contraparte **nao governamental** antes do fim de 2027. Isso quebra a leitura de \\\"transformador a feitio\\\" e obriga a reavaliar o multiplo por inteiro.\"}],\"verdict\":\"caro\",\"verdictKey\":\"caro\",\"falsifier\":\"um contrato de fornecimento de HALEU assinado com uma contraparte **nao governamental** antes do fim de 2027. Isso quebra a leitura de \\\"transformador a feitio\\\" e obriga a reavaliar o multiplo por inteiro.\"},{\"ticker\":\"KTOS\",\"name\":\"Kratos Defense\",\"theme\":\"Geopolitica & Defesa\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"O analogo nao esta em 1980 — esta nos ultimos dois anos, no proprio programa. Em Janeiro de\\n2024 a Forca Aerea americana financiou cinco desenhos de Collaborative Combat Aircraft\\n(Anduril, Boeing, General Atomics, Lockheed, Northrop). Em\\n[Abril de 2024 so a Anduril e a General Atomics avancaram](https://defensescoop.com/2024/04/24/anduril-general-atomics-air-force-cca-program/).\\nE em [17 de Junho de 2026 a USAF adjudicou a producao do Incremento 1 — as primeiras 150\\naeronaves — a Anduril e a General Atomics](https://defensescoop.com/2026/06/17/air-force-picks-anduril-general-atomics-to-build-first-operational-cca-drones/).\\n\\nA Kratos foi a empresa que **voou primeiro** o conceito, com o XQ-58A. Nao esta no contrato\\nde producao. Este e o padrao mais antigo e mais caro da aquisicao de defesa americana: **quem\\nganha o demonstrador nao ganha o programa**. O demonstrador prova que a coisa e possivel; o\\nprograma vai para quem consegue industrializa-la e para quem controla o software de missao.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**A Kratos monetiza como fornecedor, nao como prime.** No unico CCA operacional ja\\nadjudicado a uma equipa que a inclui — o MUX TACAIR dos Marines,\\n[um OTA de $231,5M anunciado a 8 de Janeiro de 2026](https://defensescoop.com/2026/01/08/marine-corps-cca-drones-northrop-grumman-kratos-team-contract/)\\n— **o prime e a Northrop Grumman**, que integra a sua arquitectura aberta de autonomia\\n(Prism) na celula XQ-58 da Kratos ([USNI, 12 de Janeiro de 2026](https://news.usni.org/2026/01/12/northrop-grumman-to-advance-kratos-xq-58-valkyrie-drone-for-marines-corps-loyal-wingman-program)).\\nMargem de fornecedor de celula nao e margem de prime de sistema de missao.\\n\\n**O valor esta a migrar da celula para o software.** Um aviao barato e barato para toda a\\ngente construir; o que e dificil de replicar e a autonomia e a integracao de missao. Se a\\ntese \\\"drones baratos ganham a proxima guerra\\\" estiver certa, o dinheiro pode ir quase todo\\npara os donos do stack de autonomia — e a Kratos vende-lhes a fuselagem.\\n\\n**A escala nao bate certo com o preco.** A Kratos diz que vai subir a producao para\\n**~40 Valkyries por ano ate ao fim de 2027**. O Incremento 1 sao 150 aeronaves e o Incremento\\n2 podera chegar a ~2.350. A accao esta a ser comprada por um programa em que a empresa,\\nhoje, nao esta.\\n\\n**Correccao a buy-list:** o `why_now` registado — \\\"unico loyal wingman US em producao\\\" —\\ndeixou de ser verdade a 17 de Junho de 2026. Quem esta em producao e o YFQ-42A da General\\nAtomics e o YFQ-44A da Anduril.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"Impossivel de dizer com honestidade — mas o onus da prova esta do lado optimista. Nao ha\\naqui um multiplo comparavel util: a Kratos tem um negocio legado de alvos aereos e\\nturbinas com margem baixa e previsivel, e por cima uma opcao sobre CCA. O que se pode dizer\\nsem inventar e a assimetria de ordens de grandeza: o valor contratado **visivel e atribuivel**\\nao programa Valkyrie sao dezenas de milhoes — um\\n[contrato de $34,8M para integracao de sistema de missao](https://www.kratosdefense.com/newsroom/kratos-receives-34-8m-contract-for-valkyrie-mission-system-integration)\\ne uma fatia de um OTA de $231,5M em que nao e prime — enquanto a tese que sustenta a accao\\nfala de milhares de fuselagens num incremento cujos fornecedores ainda nao foram anunciados.\\n\\nNao ponho um alvo. Ponho a pergunta: quanto e que ja esta pago do Incremento 2?\",\"verdict\":\"impossivel de dizer\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | A Kratos entra no Incremento 2 (ate ~2.350 aeronaves) ou fecha uma encomenda internacional grande de XQ-58 | Anuncio de fornecedores do Incremento 2 — data ainda nao publica | baixa a media |\\n| Base | Fornecedor de celula e de alvos com crescimento real mas linear: ~40 Valkyries/ano ate fim de 2027, mais o legado | Divulgacoes de entregas em 2027; resultados trimestrais | alta |\\n| Bear | Os primes de autonomia integram verticalmente a celula e a Kratos fica um fornecedor de componentes num mercado com muitos concorrentes | Qualquer CCA adjudicado a um prime que fabrique a propria fuselagem | media |\",\"verdict\":\"\",\"falsifier\":\"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa.\"}],\"verdict\":\"impossivel de dizer\",\"verdictKey\":\"incerto\",\"falsifier\":\"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa.\"},{\"ticker\":\"RKLB\",\"name\":\"Rocket Lab USA\",\"theme\":\"Espaco & Deep Tech\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"Outra vez a propria empresa. O **Electron** voou pela primeira vez a **25 de Maio de 2017**,\\nchegou ao espaco e nao chegou a orbita por causa de uma falha de equipamento de comunicacoes\\nem terra; **orbitou ao segundo voo, a 21 de Janeiro de 2018**. Oito meses entre \\\"quase\\\" e\\n\\\"feito\\\", e um negocio real depois disso.\\n\\nO **Neutron** foi anunciado a **1 de Marco de 2021 com estreia prevista para 2024**. Passou\\npara meados de 2025, depois para\\n[o fim de 2026](https://spaceflightnow.com/2025/11/11/rocket-lab-delays-debut-of-neutron-rocket-to-2026/),\\ne em Agosto de 2026 a\\n[janela para 2026 \\\"esta a estreitar\\\"](https://spaceflightnow.com/2026/08/10/window-for-2026-launch-debut-of-rocket-labs-neutron-rocket-is-narrowing-as-development-continues/),\\ncom [2027 em cima da mesa](https://spacenews.com/first-neutron-launch-may-slip-to-2027/).\\nA 21 de Janeiro rebentou um tanque do primeiro andar num teste de carregamento com agua.\\n\\n**A licao do analogo e dupla, e as duas metades importam:** a Rocket Lab acaba por fazer o\\nfoguetao voar — mas o calendario que anuncia nunca se cumpre. Quem comprou o Electron pela\\ndata perdeu; quem comprou pela empresa ganhou. Cinco anos de derrapagem no Neutron sao\\nconsistentes com o historico, nao uma anomalia.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**\\\"Entrega a rampa\\\" nao e \\\"lancamento\\\".** A linguagem do filing e sobre alinhar a producao do\\ntanque do primeiro andar com a entrega do Neutron **a rampa** no Q4 2026. Entre estar na\\nrampa e voar fica o **static fire integrado em Wallops** — descrito como o marco de maior\\nrisco de todo o caminho. Quem le \\\"Q4 2026\\\" como data de voo esta a saltar o passo mais\\nperigoso.\\n\\n**O mercado endereçavel do Neutron e \\\"quem nao e a SpaceX\\\".** O Neutron foi desenhado para\\nmega-constelacoes, e o maior operador de mega-constelacoes do mundo tem foguetoes proprios e\\nnao compra lancamentos. O que sobra e real — governo, operadores comerciais, defesa — mas e\\nmenor do que o TAM que se cita.\\n\\n**A parte que ja ganha dinheiro nao e o foguetao.** A divisao de sistemas espaciais\\n(componentes, satelites, Photon) e o negocio com receita hoje; o mercado esta a valorizar o\\nlancador. Se o Neutron derrapar mais um ano, o que segura a empresa e o segmento que quase\\nninguem discute.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"E a forma do \\\"caro\\\" importa: isto e uma opcao com theta. Nao vale a pena procurar um\\nmultiplo: nao ha lucro estabilizado para dividir. A leitura\\nhonesta e estrutural — o preco e essencialmente **uma opcao de compra sobre o Neutron\\nfuncionar**, montada em cima de um negocio de componentes que gera receita. Opcoes perdem\\nvalor com o tempo. Cada trimestre em que a estreia escorrega sem falha catastrofica nao e\\nneutro: e premio a evaporar-se. Foi por isso que os avisos de carry ja registados\\n(\\\"Neutron Q4 2026 nao reafirmado; escorregamento 2027 possivel\\\") sao a informacao mais\\nimportante do nome, e nao um rodape.\",\"verdict\":\"caro\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | Static fire integrado limpo e orbita no primeiro ou segundo voo ate meados de 2027; a carteira media-lift converte-se | Static fire integrado concluido em LC-3 sem anomalia | media |\\n| Base | Entrega a rampa no Q4 2026, primeiro voo em 2027, orbita ao segundo — o padrao do proprio Electron | Anuncio de data de static fire; resultados trimestrais | alta |\\n| Bear | Nova falha estrutural em teste empurra para 2028 e obriga a aumento de capital antes de haver receita de Neutron | Anomalia em teste; qualquer prospecto de emissao | media |\",\"verdict\":\"\",\"falsifier\":\"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \\\"aspiracao\\\" em \\\"plano\\\", e sobe o cenario base de uma prateleira.\"}],\"verdict\":\"caro\",\"verdictKey\":\"caro\",\"falsifier\":\"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \\\"aspiracao\\\" em \\\"plano\\\", e sobe o cenario base de uma prateleira.\"},{\"ticker\":\"IONQ\",\"name\":\"IonQ\",\"theme\":\"IA & Computacao\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"**Celera Genomics, 2000-2001.** A Celera sequenciou o genoma humano — a proeza cientifica da\\ndecada — e a accao [chegou a ~$276 em Marco de 2000](https://money.cnn.com/2000/04/10/companies/celera/).\\nEm [Abril de 2001 estava a $33,50](https://www.forbes.com/2001/04/11/0411sf.html). A ciencia\\nestava certa. O modelo de negocio — vender acesso a dados genomicos — e que nao aguentou.\\n\\nO que aconteceu ao dinheiro e a parte que interessa: **foi para quem fazia as maquinas.**\\nA Illumina fez IPO em Julho de 2000, tres anos antes de o Projecto Genoma acabar, levantando\\n$96M a $16 por accao, e tornou-se a infraestrutura de medicao de toda a industria\\n([Century of Bio](https://centuryofbio.com/p/illumina)). Numa revolucao de plataforma, o\\nvalor assenta muitas vezes em quem vende as picaretas, nao em quem anuncia a descoberta.\\n\\n**O que e igual:** uma capacidade genuinamente nova, um vencedor simbolico, e um mercado\\ndisposto a pagar hoje por receita que so faz sentido daqui a uma decada.\\n**O que e diferente:** a IonQ tem receita a serio a entrar e clientes governamentais — a\\nCelera nunca teve. O analogo avisa sobre a **forma** do risco, nao garante o desfecho.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**A qualidade da receita nao e a quantidade.** A IonQ reportou\\n[$64,7M no Q1 2026, +755% em termos homologos](https://www.businesswire.com/news/home/20260506736198/en/IonQ-Announces-First-Quarter-2026-Financial-Results),\\ne subiu o guidance anual para $280-290M. Mas parte material desse crescimento vem de\\n**aquisicoes e de trabalho especializado de hardware**, nao de adopcao organica de\\ncomputacao quantica por iao aprisionado. Crescimento comprado e crescimento; nao e prova de\\nmercado.\\n\\n**A IonQ esta a comprar as suas proprias picaretas.** Recebeu os primeiros QPUs\\ncompletamente integrados da **SkyWater** — uma fundicao. Na analogia da Celera, isso poe a\\nIonQ do lado de quem *usa* o instrumento. Quem fornece fundicao, criogenia, lasers e\\nfotonica vende a toda a industria quantica, ganhe quem ganhar a arquitectura.\\n\\n**A arquitectura nao e exclusiva.** Iao aprisionado tem concorrentes directos — Quantinuum,\\nAlpine Quantum Technologies. E a exclusao da IonQ de um pacote federal de ~$2 mil milhoes\\npara quantica e um sinal de que o Estado nao esta a tratar a empresa como campea nacional\\nunica. Ambos os pontos vem de comentario publico, nao de filings: **confianca parcial**.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"A empresa diz que espera perdas significativas e despesa operacional crescente no futuro\\nprevisivel. Nao ha lucro para multiplicar, e um multiplo sobre vendas de uma receita\\nparcialmente adquirida compara mal com o que quer que seja. O ancoradouro honesto e\\nqualitativo: **o preco e uma afirmacao sobre marcos tecnicos futuros**, e uma parte\\ndesproporcionada dele depende de coisas — correccao de erros a escala util, o roadmap de\\n256 e 10.000 qubits — que ainda nao aconteceram.\\n\\nNota de honestidade que este projecto ja pagou para aprender: em Agosto de 2026 o\\n`TRACK_RECORD.md` corrigiu um preco de IONQ que tinha sido \\\"estimado\\\" em $68 quando o real\\nera $46,26 (Licao #23). Aqui nao ha estimativa nenhuma. Ha um veredicto e a razao dele.\",\"verdict\":\"caro\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | Vantagem quantica demonstrada num problema comercial real com cliente pagante nomeado, e receita organica a ultrapassar a adquirida | Publicacao revista por pares + contrato comercial nomeado | baixa |\\n| Base | Receita continua a crescer por aquisicao e contratos governamentais; a accao negoceia marcos tecnicos e sentimento sobre IA | Resultados trimestrais; anuncios de roadmap | alta |\\n| Bear | Um concorrente de iao aprisionado chega primeiro a um marco de correccao de erros, ou o financiamento publico roda para outra arquitectura | Adjudicacoes federais; marcos anunciados por Quantinuum/AQT | media |\",\"verdict\":\"\",\"falsifier\":\"receita **organica** de computacao quantica (excluindo aquisicoes e trabalho de hardware a feitio) a crescer mais depressa que a adquirida, dois trimestres seguidos. Isso transformaria a tese de \\\"aposta em marcos\\\" em \\\"negocio\\\".\"}],\"verdict\":\"caro\",\"verdictKey\":\"caro\",\"falsifier\":\"receita **organica** de computacao quantica (excluindo aquisicoes e trabalho de hardware a feitio) a crescer mais depressa que a adquirida, dois trimestres seguidos. Isso transformaria a tese de \\\"aposta em marcos\\\" em \\\"negocio\\\".\"},{\"ticker\":\"PRME\",\"name\":\"Prime Medicine\",\"theme\":\"Longevidade & Saude\",\"why\":\"score-5 fora do cabaz\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"**Casgevy, 2023-2026.** A primeira terapia de edicao genetica CRISPR aprovada — a prova\\ndefinitiva de que a tecnologia funciona em doentes. E depois: **mais de dois anos apos a\\naprovacao, cerca de 60 doentes tratados** nos EUA, Medio Oriente e Europa somados. As vendas\\nde 2025 foram $116M com 64 infusoes ([BioSpace](https://www.biospace.com/business/vertex-crispr-set-lofty-goal-for-casgevy-gene-therapy-as-patient-starts-ramp)).\\n\\nO gargalo e a parte que ninguem tinha modelado. Segundo o\\n[STAT, a 5 de Fevereiro de 2026](https://www.statnews.com/2026/02/05/vertex-crispr-sickle-cell-treatment-casgevy-faces-rollout-bottleneck/),\\nos centros especializados descobriram que **nao conseguem recolher celulas suficientes** para\\nfabricar o tratamento. Nao foi a ciencia, nao foi o regulador, nao foi o pagador — foi a\\nafereses. Aprovacao nao e receita, e a restricao que decide costuma ser operacional e\\naborrecida.\\n\\n**A desanalogia, que joga a favor da PRME:** os programas principais da Prime para a doenca\\nde Wilson e para o defice de alfa-1-antitripsina sao **in vivo**, entregues ao figado. Nao ha\\nrecolha de celulas do doente, logo o gargalo especifico do Casgevy nao se aplica. O analogo\\navisa que ha *sempre* um gargalo operacional invisivel — nao que seja o mesmo.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**O verdadeiro catalisador de curto prazo nao e o IND. E o financiamento.** A Prime reportou\\n**$149,2M de caixa e equivalentes a 31 de Marco de 2026, com runway \\\"para dentro de 2027\\\"**\\n([resultados Q1 2026](https://investors.primemedicine.com/news-releases/news-release-details/prime-medicine-reports-first-quarter-2026-financial-results-and)).\\nOs dados clinicos iniciais do PM647 sao esperados **em 2027**. Faz-se a conta: a caixa acaba\\nmais ou menos quando os dados chegam. Ou entra dinheiro antes dos dados — em condicoes\\nditadas por quem empresta — ou a empresa negoceia a partir de uma posicao fraca. Um aumento\\nde capital antes do readout e o cenario base, nao o risco de cauda.\\n\\n**O programa mais avancado nao e o que a buy-list segue.** O PM577a para Wilson **ja tem IND\\naprovado nos EUA e CTA na Nova Zelandia** e esta a entrar num Fase 1/2 global, com um\\n[estudo de pre-selecao ja registado](https://clinicaltrials.gov/study/NCT07226622). O\\nPM647 (AATD) e que espera submissao no Q3 2026. A cronologia real e mais avancada do que\\n\\\"dois catalisadores sequenciais\\\" sugere — e tambem mais dependente de um so activo.\\n\\n**A resolucao da arbitragem com a Beam** ([Prime Medicine, 2026](https://investors.primemedicine.com/news-releases/news-release-details/prime-medicine-announces-positive-resolution-arbitration-beam))\\ntirou um overhang, mas o que fez em substancia foi clarificar fronteiras de propriedade\\nintelectual entre edicao de base e prime editing. Isso importa mais para um futuro\\nlicenciador do que para o proximo trimestre.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"E biotecnologia pre-receita: nao ha multiplo. Qualquer numero que eu produzisse aqui seria\\ninventado, e este projecto ja aprendeu essa licao tres vezes (#15 VKTX, #22 PRME, #23 IONQ —\\na #22 e literalmente sobre este nome, um preco \\\"estimado\\\" de $4,50 quando o real era $3,19).\\n\\nO unico ancoradouro legitimo e a relacao entre **caixa e tempo**: $149,2M a 31 de Marco de\\n2026, dados em 2027. Quem comprar aqui esta a comprar o direito de participar numa\\nrecapitalizacao provavel antes de ver os dados. Isso pode compensar — mas e o que se esta a\\ncomprar, e vale a pena dize-lo em voz alta.\",\"verdict\":\"impossi  * 100, 0.8)}%\">\u003c/span>\n          \u003cspan class=\"mark\" style=\"left:${(r.pct / max) * 100}%\">\u003c/span>\n        \u003c/span>\n        \u003cspan class=\"val num\">${r.actual.toFixed(0)}% / ${r.pct}%\u003c/span>\n      \u003c/div>`).join(\"\") +\n    `\u003c/div>\u003cdiv class=\"alloc-key\">\n      \u003cspan>\u003ci style=\"background:var(--accent)\">\u003c/i>Peso actual\u003c/span>\n      \u003cspan>\u003ci style=\"background:var(--ink);width:2px\">\u003c/i>Alvo\u003c/span>\n    \u003c/div>\u003c/div>`);\n\n  const pos = pf.positions;\n  parts.push(`\u003cdiv>\u003ch2 class=\"sec\">Posicoes\u003c/h2>` + (pos.length ? `\u003cdiv class=\"tw\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Data\u003c/th>\u003cth>Ticker\u003c/th>\u003cth>Nome\u003c/th>\u003cth>Tema\u003c/th>\u003cth>Unidades\u003c/th>\u003cth>Custo\u003c/th>\u003cth>Valor\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>` + pos.map((p) => `\u003ctr>\n      \u003ctd class=\"num\">${esc(p.date)}\u003c/td>\u003ctd class=\"k\">${esc(p.ticker)}\u003c/td>\u003ctd>${esc(p.name)}\u003c/td>\n      \u003ctd>${esc(p.theme)}\u003c/td>\u003ctd class=\"num\">${esc(p.units)}\u003c/td>\n      \u003ctd class=\"num\">€${p.cost.toFixed(2)}\u003c/td>\u003ctd class=\"num\">${p.value ? \"€\" + p.value.toFixed(2) : \"—\"}\u003c/td>\n    \u003c/tr>`).join(\"\") + `\u003c/tbody>\u003c/table>\u003c/div>\n    \u003cp class=\"lede\" style=\"margin-top:12px\">Total investido: \u003cspan class=\"num\">€${pos.reduce((s, p) => s + p.cost, 0).toFixed(2)}\u003c/span>${rec.total ? ` · valor actual \u003cspan class=\"num\">€${rec.total.toFixed(2)}\u003c/span>` : \"\"}\u003c/p>`\n    : `\u003cdiv class=\"empty\">Carteira vazia. Regista a primeira compra em \u003cstrong>PORTFOLIO.md\u003c/strong> e esta vista ganha vida.\u003c/div>`) + `\u003c/div>`);\n\n  document.getElementById(\"p-carteira\").innerHTML = parts.join(\"\");\n})();\n\n\n/* ── Tese ── */\n(function () {\n  const t = D.thesis;\n  const host = document.getElementById(\"p-tese\");\n  if (!t.names.length) {\n    host.innerHTML = `\u003cdiv class=\"empty\">Ainda sem tese profunda. Corre a rotina de sabado\n      (\u003cstrong>prompts/10-tese-profunda.md\u003c/strong>) e os nomes da carteira aparecem aqui.\u003c/div>`;\n    return;\n  }\n\n  const slug = (x) => \"th-\" + x.toLowerCase().replace(/[^a-z0-9]/g, \"\");\n  host.innerHTML = `\u003cp class=\"lede\">${esc(t.intro)}\u003c/p>\n    \u003cnav class=\"thesis-nav\" aria-label=\"Nomes analisados\">` +\n      t.names.map((n) => `\u003ca href=\"#${slug(n.ticker)}\">\u003cb>${esc(n.ticker)}\u003c/b>${esc(n.name)}\u003c/a>`).join(\"\") +\n    `\u003c/nav>\n    \u003cdiv class=\"thesis\">` + t.names.map((n) => `\n      \u003carticle id=\"${slug(n.ticker)}\">\n        \u003cheader class=\"th-head\">\n          \u003cdiv class=\"th-title\">\n            \u003cspan class=\"tk\">${esc(n.ticker)}\u003c/span>\n            \u003ch3>${esc(n.name)}\u003c/h3>\n            ${n.verdictKey ? `\u003cspan class=\"verdict\" data-v=\"${esc(n.verdictKey)}\" title=\"${esc(n.verdict)}\">${esc(n.verdictKey)}\u003c/span>` : \"\"}\n          \u003c/div>\n          \u003cdiv class=\"th-meta\">\n            \u003cspan>${esc(n.theme)}\u003c/span>\n            ${n.why ? `\u003cspan>\u003cspan class=\"k\">porque entrou:\u003c/span> ${esc(n.why)}\u003c/span>` : \"\"}\n            ${n.confidence ? `\u003cspan>\u003cspan class=\"k\">confianca:\u003c/span> ${esc(n.confidence)}\u003c/span>` : \"\"}\n          \u003c/div>\n        \u003c/header>\n        \u003cdiv class=\"lens\">` +\n          n.lenses.map((l) => `\u003csection>\n            \u003ch4>${esc(l.title)}\u003c/h4>\n            \u003cdiv class=\"prose\">${rich(l.body, /Cenario/i.test(l.title) ? \"scen\" : \"\")}\u003c/div>\n          \u003c/section>`).join(\"\") +\n          (n.falsifier ? `\u003cp class=\"falsifier\">\u003cb>Falsificador\u003c/b>\u003cspan>${md(n.falsifier)}\u003c/span>\u003c/p>` : \"\") +\n        `\u003c/div>\n      \u003c/arti
