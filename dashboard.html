<title>Investment Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══ Tokens — dark-first (.impeccable.md: refined dark / warm neutrals / gold) ═══ */
:root {
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;

  --bg:          oklch(10% 0.008 55);
  --surface:     oklch(13.5% 0.008 55);
  --surface-2:   oklch(17% 0.008 55);
  --hover:       oklch(20% 0.01 55);
  --line:        oklch(22% 0.008 55);
  --line-soft:   oklch(17% 0.006 55);

  --ink:         oklch(93% 0.01 55);
  --ink-2:       oklch(68% 0.01 55);
  --ink-3:       oklch(48% 0.008 55);

  --accent:      oklch(76% 0.13 78);
  --accent-dim:  oklch(76% 0.13 78 / 0.14);
  --accent-line: oklch(76% 0.13 78 / 0.35);

  --good:        oklch(72% 0.15 148);
  --good-dim:    oklch(72% 0.15 148 / 0.13);
  --bad:         oklch(68% 0.19 25);
  --bad-dim:     oklch(68% 0.19 25 / 0.13);
  --warn:        oklch(78% 0.14 82);
  --warn-dim:    oklch(78% 0.14 82 / 0.13);

  --on-accent:   oklch(16% 0.02 60);

  --weight: 350;
  --shadow: none;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        oklch(97.5% 0.005 65);
    --surface:   oklch(100% 0.002 65);
    --surface-2: oklch(95% 0.006 65);
    --hover:     oklch(93% 0.008 65);
    --line:      oklch(88% 0.007 65);
    --line-soft: oklch(93% 0.005 65);

    --ink:       oklch(20% 0.012 55);
    --ink-2:     oklch(45% 0.011 55);
    --ink-3:     oklch(62% 0.009 55);

    --accent:      oklch(52% 0.13 62);
    --accent-dim:  oklch(52% 0.13 62 / 0.10);
    --accent-line: oklch(52% 0.13 62 / 0.30);

    --good:      oklch(46% 0.14 148);
    --good-dim:  oklch(46% 0.14 148 / 0.10);
    --bad:       oklch(49% 0.18 25);
    --bad-dim:   oklch(49% 0.18 25 / 0.10);
    --warn:      oklch(52% 0.13 72);
    --warn-dim:  oklch(52% 0.13 72 / 0.12);
    --on-accent: oklch(99% 0.005 65);

    --weight: 400;
    --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);
  }
}

:root[data-theme="light"] {
  --bg:        oklch(97.5% 0.005 65);
  --surface:   oklch(100% 0.002 65);
  --surface-2: oklch(95% 0.006 65);
  --hover:     oklch(93% 0.008 65);
  --line:      oklch(88% 0.007 65);
  --line-soft: oklch(93% 0.005 65);

  --ink:       oklch(20% 0.012 55);
  --ink-2:     oklch(45% 0.011 55);
  --ink-3:     oklch(62% 0.009 55);

  --accent:      oklch(52% 0.13 62);
  --accent-dim:  oklch(52% 0.13 62 / 0.10);
  --accent-line: oklch(52% 0.13 62 / 0.30);

  --good:      oklch(46% 0.14 148);
  --good-dim:  oklch(46% 0.14 148 / 0.10);
  --bad:       oklch(49% 0.18 25);
  --bad-dim:   oklch(49% 0.18 25 / 0.10);
  --warn:      oklch(52% 0.13 72);
  --warn-dim:  oklch(52% 0.13 72 / 0.12);
  --on-accent: oklch(99% 0.005 65);

  --weight: 400;
  --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);
}

*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: var(--weight);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.num { font-variant-numeric: tabular-nums; }

/* ═══ Header ═══ */
.top {
  display: flex; align-items: baseline; gap: 16px;
  padding: 22px 32px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.wordmark span { color: var(--accent); }
.top .meta { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--ink-3); }

.theme-btn {
  background: none; border: 1px solid var(--line); color: var(--ink-3);
  width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
  display: grid; place-items: center; transition: color .15s, border-color .15s;
}
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.theme-btn svg { width: 15px; height: 15px; }
:root[data-theme="light"] .i-sun { display: none; }
:root:not([data-theme="dark"]) .i-sun { display: none; }
:root:not([data-theme="dark"]) .i-moon { display: block; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .i-moon { display: none; }
  :root:not([data-theme="dark"]) .i-sun { display: block; }
}
:root[data-theme="dark"] .i-sun { display: block; }
:root[data-theme="dark"] .i-moon { display: none; }
:root[data-theme="light"] .i-moon { display: block; }

/* ═══ Tabs ═══ */
.tabs { display: flex; gap: 2px; padding: 0 32px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.tab {
  appearance: none; background: none; border: none; font: inherit;
  padding: 13px 16px; font-size: 13px; font-weight: 500; color: var(--ink-3);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .15s;
}
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); margin-left: 6px; vertical-align: 3px;
}
.tab .badge {
  display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 20px;
  background: var(--surface-2); color: var(--ink-3); font-size: 11px; font-weight: 600;
}
.tab[aria-selected="true"] .badge { background: var(--accent-dim); color: var(--accent); }

/* ═══ Layout ═══ */
main { max-width: 1080px; margin: 0 auto; padding: 34px 32px 90px; }
.panel { display: none; flex-direction: column; gap: 30px; }
.panel.on { display: flex; }

.lede { font-size: 13px; color: var(--ink-3); margin: -8px 0 0; max-width: 82ch; }

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .89em; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-2); color: var(--ink-2);
}

h2.sec {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); margin: 0 0 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line-soft);
}

.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; box-shadow: var(--shadow); }

/* ═══ Hero — a compra do mes ═══ */
.hero { padding: 30px 32px; border: 1px solid var(--accent-line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.hero .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin: 0; }
.hero-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.hero .amt { margin-left: auto; font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
.hero .why { margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-3); max-width: 68ch; }
.hero .why strong { color: var(--ink-2); font-weight: 600; }
.hero-empty { padding: 30px 32px; }

/* Linhas do cabaz */
.basket { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.basket li {
  display: grid; grid-template-columns: 62px minmax(150px, 1.1fr) minmax(120px, .9fr) 1.4fr;
  align-items: baseline; gap: 18px;
  padding: 14px 0; border-top: 1px solid var(--line-soft);
}
.basket li:first-child { border-top: none; padding-top: 0; }
.line-amt { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.line-id strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.line-id .co { display: block; font-size: 12.5px; color: var(--ink-3); }
.line-th { font-size: 12.5px; color: var(--ink-2); }
.line-th em { display: block; font-style: normal; font-size: 11.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
.line-cat { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 720px) {
  .basket li { grid-template-columns: 58px 1fr; gap: 6px 14px; }
  .line-th, .line-cat { grid-column: 2; }
}

/* ═══ Barras de alocacao (alvo vs actual) ═══ */
.alloc { display: flex; flex-direction: column; gap: 3px; }
.alloc-row {
  display: grid; grid-template-columns: 168px 1fr 74px; align-items: center; gap: 16px;
  padding: 9px 12px; border-radius: 8px; transition: background .15s;
}
.alloc-row:hover { background: var(--hover); }
.alloc-row .nm { font-size: 13px; color: var(--ink-2); }
.alloc-row.lead .nm { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 22px; background: var(--surface-2); border-radius: 4px; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; min-width: 2px; }
.alloc-row:not(.lead) .fill { background: var(--ink-3); }
.mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.mark::after {
  content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--ink);
}
.alloc-row .val { font-size: 12.5px; color: var(--ink-3); text-align: right; }
.alloc-key { display: flex; gap: 20px; margin-top: 14px; font-size: 11.5px; color: var(--ink-3); }
.alloc-key i { display: inline-block; width: 11px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ═══ Alertas ═══ */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: grid; grid-template-columns: 3px 1fr; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-soft); }
.alert .stripe { background: var(--ink-3); }
.alert[data-l="high"] .stripe { background: var(--bad); }
.alert[data-l="warn"] .stripe { background: var(--warn); }
.alert[data-l="info"] .stripe { background: var(--good); }
.alert .in { padding: 15px 18px; }
.alert .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.alert .t { font-size: 13.5px; font-weight: 600; }
.alert p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 74ch; }

.chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--ink-2); }
.chip.tick { background: var(--accent-dim); color: var(--accent); }
.chip[data-acct="verificar"] { background: var(--warn-dim); color: var(--warn); }
.chip[data-acct="cto-pea"] { background: var(--good-dim); color: var(--good); }
.chip.high { background: var(--bad-dim); color: var(--bad); }
.chip.warn { background: var(--warn-dim); color: var(--warn); }
.chip.info { background: var(--good-dim); color: var(--good); }

.carry { padding: 14px 18px; font-size: 12.5px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; }
.carry b { color: var(--ink-2); font-weight: 600; }

/* ═══ Tabelas ═══ */
.tw { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 11px 14px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
th[data-k] { cursor: pointer; user-select: none; }
th[data-k]:hover { color: var(--ink-2); }
th .ar { color: var(--accent); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--hover); }
td.k { color: var(--ink); font-weight: 500; white-space: nowrap; }
td.w { min-width: 260px; font-size: 12.5px; }
.sc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.sc[data-s="5"] { background: var(--accent-dim); color: var(--accent); }
.sc[data-s="4"] { background: var(--good-dim); color: var(--good); }
.dir { font-weight: 600; white-space: nowrap; }
.dir.up { color: var(--good); }
.dir.down { color: var(--bad); }
.dir.flat { color: var(--ink-3); }

.empty { padding: 30px; text-align: center; color: var(--ink-3); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }

/* ═══ Sintese ═══ */
.wk { display: flex; flex-direction: column; gap: 24px; }
.wk article { padding: 22px 26px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; }
.wk h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; text-wrap: balance; }
.wk .body { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; max-width: 78ch; overflow-wrap: break-word; }
.wk .body strong { color: var(--ink); font-weight: 600; }

.foot { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-3); }

/* ═══ Carteira viva — resumo, P/L e formulario ═══ */

/* Quatro numeros que se leem de relance. Nao e um grafico: com 1-4 linhas e uma
   captura de preco por dia, qualquer grafico seria decoracao. */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface); padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 3px; }
.stat .lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.stat b { font-size: 23px; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.stat .sep { color: var(--ink-3); font-weight: 400; margin: 0 5px; }
.stat em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }

/* Verde/vermelho e estado, nao o accent. O sinal vai sempre no texto — a cor
   nunca e o unico portador da informacao. */
.pl.up { color: var(--good); }
.pl.down { color: var(--bad); }
.pl.flat { color: var(--ink-2); }
td .sub { display: block; font-style: normal; font-size: 11px; }
.dash { color: var(--ink-3); }

.stale {
  display: inline-block; margin-left: 5px; padding: 1px 6px; border-radius: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: .02em;
  background: var(--warn-dim); color: var(--warn); vertical-align: 1px;
}

table.pos td { vertical-align: middle; }
.rowact { white-space: nowrap; text-align: right; }
.mini {
  appearance: none; background: none; border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink-3); font-size: 11.5px; padding: 3px 9px; cursor: pointer; margin-left: 5px;
  transition: color .15s, border-color .15s;
}
.mini:hover { color: var(--ink); border-color: var(--ink-3); }

/* ── formulario ── */
.posform {
  margin-top: 16px; padding: 20px 22px 18px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 16px;
}
.posform[inert] { opacity: .55; }
.form-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.form-head h3 { font-size: 13.5px; font-weight: 600; }
.form-mode { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }

.pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; margin-right: 6px; }
.pill.ok { background: var(--good-dim); color: var(--good); }
.pill.warn { background: var(--warn-dim); color: var(--warn); }
.pill.wait { background: var(--surface-2); color: var(--ink-3); }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 14px; }
.fields .wide { grid-column: span 2; }
@media (max-width: 480px) { .fields .wide { grid-column: span 1; } }
.fields label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.fields input, .fields select {
  appearance: none; font: inherit; font-size: 14px; font-weight: 400;
  text-transform: none; letter-spacing: 0; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; width: 100%; min-width: 0;
}
.fields select {
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 14px center, right 9px center;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px;
}
.fields input:focus, .fields select:focus { border-color: var(--accent-line); }
.fields input::placeholder { color: var(--ink-3); }

.form-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.form-actions button {
  appearance: none; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  padding: 9px 18px; border-radius: 8px; border: 1px solid transparent;
  background: var(--accent); color: var(--on-accent);
  transition: filter .15s;
}
.form-actions button:hover:not(:disabled) { filter: brightness(1.08); }
.form-actions button:disabled { opacity: .45; cursor: default; }
.form-actions .ghost { background: none; border-color: var(--line); color: var(--ink-2); font-weight: 500; }
.form-note { font-size: 12px; color: var(--ink-3); }

@media (max-width: 720px) {
  .stat b { font-size: 20px; }
  .posform { padding: 18px 16px 16px; }
  .form-mode { margin-left: 0; width: 100%; }
}

/* ═══ Noticias ═══ */
.news { display: flex; flex-direction: column; gap: 12px; }
.item {
  display: grid; grid-template-columns: 3px 1fr; border-radius: 10px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line-soft);
}
.item .stripe { background: var(--line); }
.item[data-r="carteira"] { border-color: var(--accent-line); }
.item[data-r="carteira"] .stripe { background: var(--accent); }
.item[data-r="cabaz"] .stripe { background: var(--ink-3); }
.item .in { padding: 15px 18px; display: flex; flex-direction: column; gap: 7px; }
.item .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.item .co { font-size: 13px; font-weight: 600; }
.item .tag {
  margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--ink-3);
}
.item[data-r="carteira"] .tag { color: var(--accent); }
.item p { font-size: 13px; color: var(--ink-2); max-width: 76ch; }
.item .why { color: var(--ink-3); }
.item .why b { color: var(--ink-2); font-weight: 600; }
.item a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }
.item a:hover { border-bottom-color: var(--accent); }
@media (max-width: 720px) { .item .tag { margin-left: 0; } }

/* Prazo de catalisador — so aparece quando a data foi lida do texto, nunca adivinhada. */
.due {
  display: inline-block; padding: 1px 7px; border-radius: 20px; white-space: nowrap;
  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
  background: var(--surface-2); color: var(--ink-3);
}
.due[data-d="ja"]     { background: var(--bad-dim); color: var(--bad); }
.due[data-d="perto"]  { background: var(--warn-dim); color: var(--warn); }
.due[data-d="passou"] { background: var(--surface-2); color: var(--ink-3); }

.novo {
  padding: 12px 16px; border-radius: 10px; font-size: 12.5px; color: var(--ink-2);
  background: var(--accent-dim); border: 1px solid var(--accent-line);
}
.novo b { color: var(--accent); font-weight: 600; margin-right: 8px; }

/* ═══ Tese profunda ═══ */
.thesis-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.thesis-nav a {
  display: inline-flex; align-items: baseline; gap: 7px; text-decoration: none;
  padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); font-size: 12px; color: var(--ink-2);
  transition: border-color .15s, color .15s;
}
.thesis-nav a:hover { border-color: var(--accent-line); color: var(--ink); }
.thesis-nav b { font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }

.thesis { display: flex; flex-direction: column; gap: 42px; }
.thesis > article { scroll-margin-top: 16px; }

.th-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.th-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.th-title h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.th-title .tk {
  font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px;
  border-radius: 6px; background: var(--accent-dim); color: var(--accent);
}
.th-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 9px; font-size: 12px; color: var(--ink-3); }
.th-meta .k { color: var(--ink-2); }

.verdict {
  margin-left: auto; display: inline-flex; align-items: baseline; gap: 8px;
  padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.verdict::before { content: "valor"; font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }
.verdict[data-v="caro"]   { background: var(--warn-dim); color: var(--warn); border-color: transparent; }
.verdict[data-v="barato"] { background: var(--good-dim); color: var(--good); border-color: transparent; }
.verdict[data-v="justo"]  { background: var(--surface-2); color: var(--ink); }

.lens { display: flex; flex-direction: column; gap: 26px; }
.lens section { display: flex; flex-direction: column; gap: 10px; }
.lens h4 {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); margin: 0;
}
.lens .prose { display: flex; flex-direction: column; gap: 13px; }
/* A largura de leitura e do texto; a tabela de cenarios usa a largura toda. */
.lens .prose > p { font-size: 14px; line-height: 1.72; color: var(--ink-2); max-width: 68ch; }
.lens .prose strong { color: var(--ink); font-weight: 600; }
.lens .prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }
.lens .prose a:hover { border-bottom-color: var(--accent); }

.scen td:first-child { color: var(--ink); font-weight: 600; white-space: nowrap; }
.prob { font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
.prob[data-p="alta"]  { color: var(--ink); }
.prob[data-p="baixa"] { color: var(--ink-3); }

.falsifier {
  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline;
  padding: 15px 18px; border-radius: 10px; background: var(--surface-2);
  border: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-2); max-width: 74ch;
}
.falsifier b {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); white-space: nowrap;
}
.falsifier strong { color: var(--ink); font-weight: 600; }

@media (max-width: 720px) {
  .th-title h3 { font-size: 17px; }
  .verdict { margin-left: 0; }
  .falsifier { grid-template-columns: 1fr; gap: 6px; }

  .scen thead { display: none; }
  .scen, .scen tbody, .scen tr, .scen td { display: block; width: 100%; }
  .scen tr { padding: 14px 0 16px; border-bottom: 1px solid var(--line-soft); }
  .scen tr:last-child { border-bottom: none; }
  .scen tbody tr:hover { background: none; }
  .scen td { border: none; padding: 3px 15px; }
  .scen td[data-l]::before {
    content: attr(data-l); display: block; margin-bottom: 1px;
    font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .09em; color: var(--ink-3);
  }
  .scen td:first-child { font-size: 15px; padding-bottom: 8px; }
}

@media (max-width: 720px) {

  .tab { padding-left: 10px; padding-right: 10px; }

  .alloc-row { grid-template-columns: 108px 1fr 62px; gap: 10px; }
  .hero { padding: 24px 20px; }
  .hero .amt { margin-left: 0; }
}

18px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-3); }\n\n/* ═══ Carteira viva — resumo, P/L e formulario ═══ */\n\n/* Quatro numeros que se leem de relance. Nao e um grafico: com 1-4 linhas e uma\n   captura de preco por dia, qualquer grafico seria decoracao. */\n.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }\n.stat { background: var(--surface); padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 3px; }\n.stat .lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }\n.stat b { font-size: 23px; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }\n.stat .sep { color: var(--ink-3); font-weight: 400; margin: 0 5px; }\n.stat em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }\n\n/* Verde/vermelho e estado, nao o accent. O sinal vai sempre no texto — a cor\n   nunca e o unico portador da informacao. */\n.pl.up { color: var(--good); }\n.pl.down { color: var(--bad); }\n.pl.flat { color: var(--ink-2); }\ntd .sub { display: block; font-style: normal; font-size: 11px; }\n.dash { color: var(--ink-3); }\n\n.stale {\n  display: inline-block; margin-left: 5px; padding: 1px 6px; border-radius: 5px;\n  font-size: 10px; font-weight: 600; letter-spacing: .02em;\n  background: var(--warn-dim); color: var(--warn); vertical-align: 1px;\n}\n\ntable.pos td { vertical-align: middle; }\n.rowact { white-space: nowrap; text-align: right; }\n.mini {\n  appearance: none; background: none; border: 1px solid var(--line); border-radius: 6px;\n  color: var(--ink-3); font-size: 11.5px; padding: 3px 9px; cursor: pointer; margin-left: 5px;\n  transition: color .15s, border-color .15s;\n}\n.mini:hover { color: var(--ink); border-color: var(--ink-3); }\n\n/* ── formulario ── */\n.posform {\n  margin-top: 16px; padding: 20px 22px 18px; border-radius: 12px;\n  background: var(--surface); border: 1px solid var(--line-soft);\n  display: flex; flex-direction: column; gap: 16px;\n}\n.posform[inert] { opacity: .55; }\n.form-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }\n.form-head h3 { font-size: 13.5px; font-weight: 600; }\n.form-mode { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }\n\n.pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; margin-right: 6px; }\n.pill.ok { background: var(--good-dim); color: var(--good); }\n.pill.warn { background: var(--warn-dim); color: var(--warn); }\n.pill.wait { background: var(--surface-2); color: var(--ink-3); }\n\n.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 14px; }\n.fields .wide { grid-column: span 2; }\n@media (max-width: 480px) { .fields .wide { grid-column: span 1; } }\n.fields label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }\n.fields input, .fields select {\n  appearance: none; font: inherit; font-size: 14px; font-weight: 400;\n  text-transform: none; letter-spacing: 0; color: var(--ink);\n  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;\n  padding: 8px 11px; width: 100%; min-width: 0;\n}\n.fields select {\n  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);\n  background-position: right 14px center, right 9px center;\n  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px;\n}\n.fields input:focus, .fields select:focus { border-color: var(--accent-line); }\n.fields input::placeholder { color: var(--ink-3); }\n\n.form-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }\n.form-actions button {\n  appearance: none; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;\n  padding: 9px 18px; border-radius: 8px; border: 1px solid transparent;\n  background: var(--accent); color: var(--on-accent);\n  transition: filter .15s;\n}\n.form-actions button:hover:not(:disabled) { filter: brightness(1.08); }\n.form-actions button:disabled { opacity: .45; cursor: default; }\n.form-actions .ghost { background: none; border-color: var(--line); color: var(--ink-2); font-weight: 500; }\n.form-note { font-size: 12px; color: var(--ink-3); }\n\n@media (max-width: 720px) {\n  .stat b { font-size: 20px; }\n  .posform { padding: 18px 16px 16px; }\n  .form-mode { margin-left: 0; width: 100%; }\n}\n\n/* ═══ Noticias ═══ */\n.news { display: flex; flex-direction: column; gap: 12px; }\n.item {\n  display: grid; grid-template-columns: 3px 1fr; border-radius: 10px; overflow: hidden;\n  background: var(--surface); border: 1px solid var(--line-soft);\n}\n.item .stripe { background: var(--line); }\n.item[data-r=\"carteira\"] { border-color: var(--accent-line); }\n.item[data-r=\"carteira\"] .stripe { background: var(--accent); }\n.item[data-r=\"cabaz\"] .stripe { background: var(--ink-3); }\n.item .in { padding: 15px 18px; display: flex; flex-direction: column; gap: 7px; }\n.item .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }\n.item .co { font-size: 13px; font-weight: 600; }\n.item .tag {\n  margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .05em;\n  text-transform: uppercase; color: var(--ink-3);\n}\n.item[data-r=\"carteira\"] .tag { color: var(--accent); }\n.item p { font-size: 13px; color: var(--ink-2); max-width: 76ch; }\n.item .why { color: var(--ink-3); }\n.item .why b { color: var(--ink-2); font-weight: 600; }\n.item a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }\n.item a:hover { border-bottom-color: var(--accent); }\n@media (max-width: 720px) { .item .tag { margin-left: 0; } }\n\n/* Prazo de catalisador — so aparece quando a data foi lida do texto, nunca adivinhada. */\n.due {\n  display: inline-block; padding: 1px 7px; border-radius: 20px; white-space: nowrap;\n  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;\n  background: var(--surface-2); color: var(--ink-3);\n}\n.due[data-d=\"ja\"]     { background: var(--bad-dim); color: var(--bad); }\n.due[data-d=\"perto\"]  { background: var(--warn-dim); color: var(--warn); }\n.due[data-d=\"passou\"] { background: var(--surface-2); color: var(--ink-3); }\n\n.novo {\n  padding: 12px 16px; border-radius: 10px; font-size: 12.5px; color: var(--ink-2);\n  background: var(--accent-dim); border: 1px solid var(--accent-line);\n}\n.novo b { color: var(--accent); font-weight: 600; margin-right: 8px; }\n\n/* ═══ Tese profunda ═══ */\n.thesis-nav { display: flex; flex-wrap: wrap; gap: 6px; }\n.thesis-nav a {\n  display: inline-flex; align-items: baseline; gap: 7px; text-decoration: none;\n  padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px;\n  background: var(--surface); font-size: 12px; color: var(--ink-2);\n  transition: border-color .15s, color .15s;\n}\n.thesis-nav a:hover { border-color: var(--accent-line); color: var(--ink); }\n.thesis-nav b { font-size: 12.5px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }\n\n.thesis { display: flex; flex-direction: column; gap: 42px; }\n.thesis > article { scroll-margin-top: 16px; }\n\n.th-head { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }\n.th-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }\n.th-title h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }\n.th-title .tk {\n  font-size: 12px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px;\n  border-radius: 6px; background: var(--accent-dim); color: var(--accent);\n}\n.th-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 9px; font-size: 12px; color: var(--ink-3); }\n.th-meta .k { color: var(--ink-2); }\n\n.verdict {\n  margin-left: auto; display: inline-flex; align-items: baseline; gap: 8px;\n  padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600;\n  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);\n}\n.verdict::before { content: \"valor\"; font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }\n.verdict[data-v=\"caro\"]   { background: var(--warn-dim); color: var(--warn); border-color: transparent; }\n.verdict[data-v=\"barato\"] { background: var(--good-dim); color: var(--good); border-color: transparent; }\n.verdict[data-v=\"justo\"]  { background: var(--surface-2); color: var(--ink); }\n\n.lens { display: flex; flex-direction: column; gap: 26px; }\n.lens section { display: flex; flex-direction: column; gap: 10px; }\n.lens h4 {\n  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;\n  color: var(--accent); margin: 0;\n}\n.lens .prose { display: flex; flex-direction: column; gap: 13px; }\n/* A largura de leitura e do texto; a tabela de cenarios usa a largura toda. */\n.lens .prose > p { font-size: 14px; line-height: 1.72; color: var(--ink-2); max-width: 68ch; }\n.lens .prose strong { color: var(--ink); font-weight: 600; }\n.lens .prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-line); }\n.lens .prose a:hover { border-bottom-color: var(--accent); }\n\n.scen td:first-child { color: var(--ink); font-weight: 600; white-space: nowrap; }\n.prob { font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }\n.prob[data-p=\"alta\"]  { color: var(--ink); }\n.prob[data-p=\"baixa\"] { color: var(--ink-3); }\n\n.falsifier {\n  display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline;\n  padding: 15px 18px; border-radius: 10px; background: var(--surface-2);\n  border: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-2); max-width: 74ch;\n}\n.falsifier b {\n  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;\n  color: var(--ink-3); white-space: nowrap;\n}\n.falsifier strong { color: var(--ink); font-weight: 600; }\n\n@media (max-width: 720px) {\n  .th-title h3 { font-size: 17px; }\n  .verdict { margin-left: 0; }\n  .falsifier { grid-template-columns: 1fr; gap: 6px; }\n\n  /* Quatro colunas de prosa nao cabem num telemovel — cada cenario vira um cartao. */\n  .scen thead { display: none; }\n  .scen, .scen tbody, .scen tr, .scen td { display: block; width: 100%; }\n  .scen tr { padding: 14px 0 16px; border-bottom: 1px solid var(--line-soft); }\n  .scen tr:last-child { border-bottom: none; }\n  .scen tbody tr:hover { background: none; }\n  .scen td { border: none; padding: 3px 15px; }\n  .scen td[data-l]::before {\n    content: attr(data-l); display: block; margin-bottom: 1px;\n    font-size: 9.5px; font-weight: 600; text-transform: uppercase;\n    letter-spacing: .09em; color: var(--ink-3);\n  }\n  .scen td:first-child { font-size: 15px; padding-bottom: 8px; }\n}\n\n@media (max-width: 720px) {\n  .top, .tabs, main { padding-left: 18px; padding-right: 18px; }\n  /* Aperta os separadores para o seguinte ficar meio a vista — e essa fatia que\n     diz que a fila continua para a direita. */\n  .tab { padding-left: 10px; padding-right: 10px; }\n  .tabs { padding-right: 0; }\n  .alloc-row { grid-template-columns: 108px 1fr 62px; gap: 10px; }\n  .hero { padding: 24px 20px; }\n  .hero .amt { margin-left: 0; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\n  \u003ch1 class=\"wordmark\">Investment \u003cspan>Scanner\u003c/span>\u003c/h1>\n  \u003cdiv class=\"meta\">\n    \u003cspan class=\"num\" id=\"stamp\">\u003c/span>\n    \u003cbutton class=\"theme-btn\" id=\"themeBtn\" aria-label=\"Alternar tema\">\n      \u003csvg class=\"i-moon\" viewBox=\"0 0 24 24\" fill=\"none\ ipts/prices.ts + scripts/valuation.ts —\n   a mesma conta de P/L que corre no build corre aqui. Nao editar a mao. */\nconst emptyBook = () => ({\n  asof: \"\",\n  fx: {},\n  prices: {},\n  benchmark: { ticker: \"SPY\", currency: \"USD\", source: \"\", history: {} }\n});\nconst DATE = /^\\d{4}-\\d{2}-\\d{2}$/;\nconst URL_RE = /^https?:\\/\\/\\S+$/;\nfunction quoteErrors(ticker, q) {\n  const e = [];\n  if (!q || typeof q !== \"object\")\n    return [`${ticker}: cotacao nao e um objecto`];\n  if (typeof q.price !== \"number\" || !Number.isFinite(q.price) || q.price \u003c= 0)\n    e.push(`${ticker}: price tem de ser um numero positivo`);\n  if (!q.currency || typeof q.currency !== \"string\")\n    e.push(`${ticker}: falta currency`);\n  if (!DATE.test(String(q.asof ?? \"\")))\n    e.push(`${ticker}: asof tem de ser YYYY-MM-DD`);\n  if (!URL_RE.test(String(q.source ?? \"\")))\n    e.push(`${ticker}: source tem de ser um URL — um preco sem fonte e inventado (Licao #23)`);\n  return e;\n}\nfunction parseBook(raw) {\n  if (!raw || !raw.trim())\n    return { book: emptyBook(), reason: \"sem output/prices.json\" };\n  let d;\n  try {\n    d = JSON.parse(raw);\n  } catch (err) {\n    return { book: emptyBook(), reason: `prices.json com JSON malformado: ${err.message}` };\n  }\n  const base = emptyBook();\n  const book = {\n    asof: typeof d?.asof === \"string\" ? d.asof : \"\",\n    fx: d?.fx && typeof d.fx === \"object\" ? d.fx : {},\n    prices: {},\n    benchmark: { ...base.benchmark, ...d?.benchmark ?? {} }\n  };\n  let dropped = 0;\n  for (const [t, q] of Object.entries(d?.prices ?? {})) {\n    if (quoteErrors(t, q).length)\n      dropped++;\n    else\n      book.prices[t] = q;\n  }\n  if (!book.benchmark.history || typeof book.benchmark.history !== \"object\")\n    book.benchmark.history = {};\n  return { book, reason: dropped ? `ok (${dropped} cotacao(oes) rejeitada(s) por falta de fonte/data)` : \"ok\" };\n}\nfunction applyQuotes(book, patch) {\n  const log = [];\n  const out = { ...book, prices: { ...book.prices } };\n  for (const [ticker, q] of Object.entries(patch ?? {})) {\n    const errs = quoteErrors(ticker, q);\n    if (errs.length) {\n      log.push(`recusado — ${errs.join(\"; \")}` + (book.prices[ticker] ? \" (fica o preco anterior)\" : \"\"));\n      continue;\n    }\n    const before = book.prices[ticker];\n    out.prices[ticker] = q;\n    log.push(before ? `${ticker}: ${before.price} (${before.asof}) → ${q.price} (${q.asof})` : `${ticker}: ${q.price} ${q.currency} (${q.asof}) — novo`);\n  }\n  return { book: out, log };\n}\nfunction daysBetween(from, to) {\n  const a = Date.parse(from + \"T00:00:00Z\"), b = Date.parse(to + \"T00:00:00Z\");\n  if (!Number.isFinite(a) || !Number.isFinite(b))\n    return 1 / 0;\n  return Math.round((b - a) / 86400000);\n}\nconst STALE_AFTER_DAYS = 4;\nfunction toEur(amount, currency, book) {\n  if (currency === \"EUR\")\n    return amount;\n  const fx = book.fx[currency];\n  if (!fx || !(fx.per_eur > 0))\n    return null;\n  return amount / fx.per_eur;\n}\nfunction benchAt(book, date) {\n  const dates = Object.keys(book.benchmark.history ?? {}).filter((d) => DATE.test(d)).sort();\n  let hit = null;\n  for (const d of dates) {\n    if (d \u003c= date)\n      hit = d;\n    else\n      break;\n  }\n  return hit ? { date: hit, point: book.benchmark.history[hit] } : null;\n}\nfunction benchLatest(book) {\n  const dates = Object.keys(book.benchmark.history ?? {}).filter((d) => DATE.test(d)).sort();\n  return dates.length ? { date: dates.at(-1), point: book.benchmark.history[dates.at(-1)] } : null;\n}\n\nfunction valuePositions(positions, book, today) {\n  const valued = positions.map((p) => {\n    const q = book.prices[p.ticker];\n    const eur = q ? toEur(q.price, q.currency, book) : null;\n    let value = null;\n    let valueFrom = null;\n    if (p.value_eur && p.value_eur > 0) {\n      value = p.value_eur;\n      valueFrom = \"manual\";\n    } else if (eur !== null) {\n      value = eur * p.units;\n      valueFrom = \"mercado\";\n    }\n    return {\n      ...p,\n      price: q ? q.price : null,\n      priceCurrency: q?.currency ?? \"\",\n      priceAsof: q?.asof ?? \"\",\n      priceSource: q?.source ?? \"\",\n      stale: !!q && daysBetween(q.asof, today) > STALE_AFTER_DAYS,\n      value,\n      valueFrom,\n      pl: value === null ? null : value - p.cost_eur,\n      plPct: value === null || !p.cost_eur ? null : (value - p.cost_eur) / p.cost_eur * 100\n    };\n  });\n  const byTicker = new Map;\n  for (const p of valued) {\n    const h = byTicker.get(p.ticker) ?? {\n      ticker: p.ticker,\n      name: p.name,\n      theme: p.theme,\n      units: 0,\n      cost: 0,\n      lines: 0,\n      avgCost: 0,\n      value: null,\n      pl: null,\n      plPct: null,\n      price: p.price,\n      priceCurrency: p.priceCurrency,\n      priceAsof: p.priceAsof,\n      stale: p.stale\n    };\n    h.units += p.units;\n    h.cost += p.cost_eur;\n    h.lines += 1;\n    if (p.value !== null)\n      h.value = (h.value ?? 0) + p.value;\n    byTicker.set(p.ticker, h);\n  }\n  const holdings = [...byTicker.values()].map((h) => ({\n    ...h,\n    avgCost: h.units ? h.cost / h.units : 0,\n    pl: h.value === null ? null : h.value - h.cost,\n    plPct: h.value === null || !h.cost ? null : (h.value - h.cost) / h.cost * 100\n  }));\n  const invested = valued.reduce((s, p) => s + p.cost_eur, 0);\n  const pricedRows = valued.filter((p) => p.value !== null);\n  const value = pricedRows.length ? pricedRows.reduce((s, p) => s + (p.value ?? 0), 0) : null;\n  const complete = pricedRows.length === valued.length && valued.length > 0;\n  return {\n    positions: valued,\n    holdings,\n    totals: {\n      invested,\n      value,\n      pl: complete && value !== null ? value - invested : null,\n      plPct: complete && value !== null && invested ? (value - invested) / invested * 100 : null,\n      priced: pricedRows.length,\n      unpriced: valued.length - pricedRows.length,\n      anyStale: valued.some((p) => p.stale),\n      bench: benchmark(valued, book)\n    }\n  };\n}\nfunction benchmark(positions, book) {\n  const now = benchLatest(book);\n  if (!now || !positions.length)\n    return null;\n  const eurNow = now.point.spy / now.point.usd_per_eur;\n  let cost = 0, value = 0, covered = 0, uncovered = 0;\n  for (const p of positions) {\n    const then = p.date ? benchAt(book, p.date) : null;\n    if (!then || !(then.point.usd_per_eur > 0) || !(then.point.spy > 0)) {\n      uncovered++;\n      continue;\n    }\n    const eurThen = then.point.spy / then.point.usd_per_eur;\n    cost += p.cost_eur;\n    value += p.cost_eur * (eurNow / eurThen);\n    covered++;\n  }\n  if (!covered)\n    return { ticker: book.benchmark.ticker, covered, uncovered, cost: 0, value: null, plPct: null, asof: now.date };\n  return {\n    ticker: book.benchmark.ticker,\n    covered,\n    uncovered,\n    cost,\n    value,\n    plPct: cost ? (value - cost) / cost * 100 : null,\n    asof: now.date\n  };\n}\nfunction themeRows(positions, targets) {\n  const byTheme = {};\n  let total = 0;\n  for (const p of positions) {\n    const v = p.value ?? p.cost_eur;\n    byTheme[p.theme] = (byTheme[p.theme] ?? 0) + v;\n    total += v;\n  }\n  const rows = targets.map((t) => {\n    const value = byTheme[t.theme] ?? 0;\n    const actual = total > 0 ? value / total * 100 : 0;\n    return { ...t, value, actual, gap: t.pct - actual };\n  });\n  return { rows, total };\n}\n\nconst D = {\"built\":\"2026-08-26\",\"portfolio\":{\"targets\":[{\"theme\":\"Geopolitica & Defesa\",\"pct\":20,\"rationale\":\"Hit-rate 4/4 na coorte Apr-05; backlogs multi-ano visiveis (Renk 5.3x TTM); rearmamento NATO e estrutural, nao ciclico. Varias sao UE → elegiveis a PEA no futuro\"},{\"theme\":\"Materiais & Energia\",\"pct\":20,\"rationale\":\"Ativos reais e defice estrutural de uranio; hit-rate 4/8. Aloja a unica score-5 do momento (LEU)\"},{\"theme\":\"Espaco & Deep Tech\",\"pct\":15,\"rationale\":\"Hit-rate mpliance (KYC on-chain, leverage caps, custody rules) ainda nao definido. Se CFTC anunciar regras onerosas ou processo demorado, correccao -30-40% possivel. Nao aumentar posicao em ATH sem mais clareza regulatoria.\\n\\n5. **Cluster AI compute — NBIS, CRWV, IONQ, SOUN**: Todos dependem de capex AI dos hyperscalers. Se Meta, Google ou Microsoft guiarem para freeze de capex em Q3 earnings (Nov 2026), o sector corrige simultaneamente. Vigiar Meta Q3 Nov — primeiro gate.\\n\\n6. **Rearmamento europeu valuation stretch**: HAG.DE Jefferies Hold, JPMorgan Neutral EUR 85. R3NK.DE, THEON.AS, EXOS.PA todos com valuations elevadas vs historico. Tese de rearmamento intacta mas re-rating individual ficou mais dificil — rotacao intra-sector, nao saida do tema.\\n\\n7. **Correlacao cripto intra-sector**: HYPE +35% esta semana por catalisador especifico. AAVE +15%. ONDO +18% de low. Quando BTC corrige, todos descem independentemente dos catalisadores individuais. Correlacao BTC de HYPE, AAVE, ONDO, MORPHO e estruturalmente alta.\\n\\n8. **Insider selling cluster (persistente)**: LUNR CEO $14.7M (Aug 13 — mesmo dia Q2 miss); RKLB CEO Beck $286M Jul (10b5-1); NBIS vigiar Form 4. Regra: escala > 2% market cap em 3 dias = revisao de posicao.\"},{\"title\":\"O que mudou esta semana\",\"body\":\"*Vs sintese 2026-08-15.*\\n\\n| Ticker | Mudanca | Classificacao |\\n|--------|---------|---------------|\\n| EYPT | LUGANO primary endpoint MISS Aug 17; -69% para $4.57 | ❌ FALHOU BINARIO — REMOVIDA |\\n| HYPE | Trump/CFTC endorsement Aug 19; ATH $77.62 Aug 21; +35% vs semana passada | ✅ NOVO CATALISADOR — atualizado |\\n| CRWV | Q2 $2.58B beat; FY $12.4-13.2B raised; Anthropic+Meta; preco ~$90 | ATUALIZADO + ⚠️ preco revisto Aug-15 |\\n| RKLB | Q2 $234.1M record; Neutron Q4 launchpad \\\"janela estreita\\\"; Iridium $870M/yr | ATUALIZADO |\\n| IONQ | SkyWater concluido Jul 31; preco real $46.26 (nao $68 est.) | ⚠️ CORRECAO PRECO (Licao #23) |\\n| AAVE | +15% esta semana; $98.88; approaching breakout $108 | ATUALIZADO |\\n| ONDO | Abandoned blockchain plans Jul 28 (pivot para rede privada); $0.388 | ⚠️ PIVOT ESTRATEGICO |\\n| VKTX | Maintenance study topline pendente; $34.29 (de $33.12 Aug-15) | CARRY |\\n| PRME | PM647 IND/CTA Q3 pendente; Beam arbitragem confirmada; $3.29 | CARRY |\\n| NBIS | $248.43; Burry short continua; nenhuma actualizacao material | CARRY |\\n| LUNR | Recuperacao de -44% para -9% vs entrada | CARRY |\\n| SPY | -1.4% esta semana ($776.34→$765.72); benchmark Apr-05 baixou de +10.5% para +9.0% | MERCADO |\"}]},\"thesis\":{\"date\":\"2026-08-26\",\"intro\":\"Cinco nomes: os quatro que o dashboard esta a recomendar comprar este mes (LEU, KTOS, RKLB, IONQ) mais o outro score-5 que ficou de fora do cabaz (PRME). Carteira vazia, por isso o perimetro e o que muda uma decisao das proximas semanas. Nao ha alvos de preco aqui — ha juizo com analogia. Nao e conselho de investimento.  **A seccao LEU foi corrigida na mesma ronda** — o falsificador que eu tinha escrito ja tinha disparado a 6 de Agosto. A correccao esta a vista dentro da seccao.\",\"names\":[{\"ticker\":\"LEU\",\"name\":\"Centrus Energy\",\"theme\":\"Materiais & Energia\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"O melhor analogo desta empresa e **ela propria, ha doze anos**. A USEC — a antecessora\\ndirecta da Centrus — pediu **Chapter 11 a 5 de Marco de 2014**, depois de nao conseguir\\nencontrar investidores para os ~$4 mil milhoes do American Centrifuge Plant. **O projecto\\nera o mesmo. O sitio era o mesmo: Piketon, Ohio. A tecnologia era a mesma familia de\\ncentrifugas.** A empresa [saiu do Chapter 11 a 30 de Setembro de 2014 como Centrus](https://www.centrusenergy.com/news/centrus-energy-corp-emerges-from-chapter-11-restructuring/),\\ncom nove milhoes de accoes novas e $240,4M de divida nova ([10-K FY2014](https://www.sec.gov/Archives/edgar/data/0001065059/000106505915000012/leu-20141231x10k.htm)).\\nQuem tinha a accao antiga ficou sem nada.\\n\\n**O que e diferente agora — e a diferenca e maior do que eu tinha lido.** A USEC morreu por\\nnao conseguir financiar a fabrica. A Centrus esta a financia-la com dinheiro que nao e nem\\ncapital proprio nem divida: um award de $900M do DOE, e agora **prepagamentos de clientes**.\\nNo acordo com a X-energy, o CEO Amir Vexler diz textualmente que acordos destes fornecem\\n[\\\"non-dilutive, non-debt capital to support our build out\\\"](https://www.centrusenergy.com/news/centrus-energy-signs-leu-and-haleu-supply-agreement-with-x-energy/).\\nE exactamente o mecanismo que faltou em 2014.\\n\\n**O que continua igual:** a fabrica ainda nao produz. A gestao mantem **2029** como alvo de\\nproducao comercial em Piketon, com \\\"esforcos em curso para avaliar se o calendario pode ser\\ncomprimido\\\". Entre a assinatura e a entrega vao anos — e foi no intervalo que a USEC morreu.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**Isto e uma historia de balanco disfarcada de historia de resultados.** O backlog comercial\\nchega a **$4,5 mil milhoes ate 2040**, dos quais $3,0B de enriquecimento contingente de LEU e\\nHALEU ([Q2 2026](https://www.centrusenergy.com/news/centrus-reports-second-quarter-2026-results/)).\\nO prepagamento entra agora; a receita correspondente entra a partir de 2029-2030. Quem compra\\na accao pelo backlog esta a comprar uma data, nao um fluxo.\\n\\n**Prepagamento e um passivo com uma obrigacao de entrega a prazo fixo.** Resolve o\\nfinanciamento e, ao mesmo tempo, vende enriquecimento em avanco. Se o preco do SWU subir\\nmuito ate 2030, parte da capacidade nova esta comprometida a precos de 2026. O mercado ve o\\nlado bom do prepagamento — e o lado que financia — e nao costuma olhar para o outro.\\n\\n**A tese certa pela razao errada:** se o HALEU for mesmo escasso e caro, o racional para os\\nprojectistas de SMR nao e esperar — e **redesenhar para LEU+ (enriquecimento ate ~10%)**,\\nque ja tem cadeia de fornecimento. Nesse mundo a Centrus continua a vender LEU, mas o premio\\nde monopolio do HALEU dissolve-se sem uma unica noticia ma sobre a empresa.\\n\\n**Nota sobre o contrato do DOE, que continua a valer:** o HALEU produzido ao abrigo desse\\ncontrato e propriedade do DOE. Essa parte do negocio nao escala com o preco do uranio. O que\\nmudou e que ja **nao e a unica parte** — e a distincao que a primeira versao desta tese\\nfalhou.\\n\\n**Sobre a buy-list:** o catalisador registado — \\\"nova centrifuga Oak Ridge Q4 2026\\\" — **esta\\ncorrecto**. A empresa espera concluir a primeira centrifuga nova em Oak Ridge ate ao fim de\\n2026. Vale so distinguir o que e: Oak Ridge e **fabrico** e o marco prova que a cadeia de\\nfornecimento fecha; **producao comercial** e em Piketon, em 2029.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"Com uma qualificacao que a primeira versao nao tinha: a empresa da lucro. O Q2 2026 trouxe\\n**$176,1M de receita, $16,8M de resultado liquido GAAP ($0,77 por accao diluida) e $1,77 de\\nEPS ajustado**. Nao e uma promessa; e uma demonstracao de resultados.\\n\\nO \\\"caro\\\" e sobre o multiplo, nao sobre a qualidade. Os screeners publicos poem o P/E TTM\\nalgures entre ~57x e ~80x contra uma **mediana a 5 anos de 14,6x** para a mesma empresa\\n(GuruFocus e Simply Wall St, 2026 — opiniao de terceiros, nao facto auditado). Nao e preciso\\nacreditar no numero exacto para ler o sinal: o mercado esta a pagar hoje pelo Piketon de 2029.\\n\\nO segundo sinal e a volatilidade do proprio multiplo. Segundo a Investing.com, a accao caiu\\nde ~$383 em Outubro de 2025 para ~$191,85 em Abril de 2026 — **-52% em seis meses**. Quando o\\npreco se move dessa maneira e os factos estruturais nao, o que se move e o apetite.\",\"verdict\":\"caro\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | O calendario comprime-se: producao comercial em Piketon antes de 2029, e mais offtakes com prepagamento a empilhar-se sobre o da X-energy | Gestao a confirmar calendario comprimido; novos 8-K a nomear contrapartes | baixa a media |\\n| Base | Backlog e prepagamentos acumulam-se conforme o plano, com receita material so no fim da decada; a accao negoceia sentimento nuclear e nao resultados | Filings trimestrais a reafirmar 2029; marco de Oak Ridge ate ao fim de 2026 | alta |\\n| Bear | Derrapagem do calendario de Piketon, expansao europeia (Urenco/Orano) a comer o premio de escassez, ou o SWU a subir acima dos precos ja vendidos em prepagamento | Qualquer reafirmacao de data para depois de 2029; apropriacoes do DOE | media |\",\"verdict\":\"\",\"falsifier\":\"um adiamento da producao comercial de Piketon para depois de 2029, ou a renegociacao de um dos offtakes com prepagamento. **E o calendario que sustenta esta tese, nao a procura** — a procura ja esta contratada.\"}],\"verdict\":\"caro\",\"verdictKey\":\"caro\",\"falsifier\":\"um adiamento da producao comercial de Piketon para depois de 2029, ou a renegociacao de um dos offtakes com prepagamento. **E o calendario que sustenta esta tese, nao a procura** — a procura ja esta contratada.\"},{\"ticker\":\"KTOS\",\"name\":\"Kratos Defense\",\"theme\":\"Geopolitica & Defesa\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"O analogo nao esta em 1980 — esta nos ultimos dois anos, no proprio programa. Em Janeiro de\\n2024 a Forca Aerea americana financiou cinco desenhos de Collaborative Combat Aircraft\\n(Anduril, Boeing, General Atomics, Lockheed, Northrop). Em\\n[Abril de 2024 so a Anduril e a General Atomics avancaram](https://defensescoop.com/2024/04/24/anduril-general-atomics-air-force-cca-program/).\\nE em [17 de Junho de 2026 a USAF adjudicou a producao do Incremento 1 — as primeiras 150\\naeronaves — a Anduril e a General Atomics](https://defensescoop.com/2026/06/17/air-force-picks-anduril-general-atomics-to-build-first-operational-cca-drones/).\\n\\nA Kratos foi a empresa que **voou primeiro** o conceito, com o XQ-58A. Nao esta no contrato\\nde producao. Este e o padrao mais antigo e mais caro da aquisicao de defesa americana: **quem\\nganha o demonstrador nao ganha o programa**. O demonstrador prova que a coisa e possivel; o\\nprograma vai para quem consegue industrializa-la e para quem controla o software de missao.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**A Kratos monetiza como fornecedor, nao como prime.** No unico CCA operacional ja\\nadjudicado a uma equipa que a inclui — o MUX TACAIR dos Marines,\\n[um OTA de $231,5M anunciado a 8 de Janeiro de 2026](https://defensescoop.com/2026/01/08/marine-corps-cca-drones-northrop-grumman-kratos-team-contract/)\\n— **o prime e a Northrop Grumman**, que integra a sua arquitectura aberta de autonomia\\n(Prism) na celula XQ-58 da Kratos ([USNI, 12 de Janeiro de 2026](https://news.usni.org/2026/01/12/northrop-grumman-to-advance-kratos-xq-58-valkyrie-drone-for-marines-corps-loyal-wingman-program)).\\nMargem de fornecedor de celula nao e margem de prime de sistema de missao.\\n\\n**O valor esta a migrar da celula para o software.** Um aviao barato e barato para toda a\\ngente construir; o que e dificil de replicar e a autonomia e a integracao de missao. Se a\\ntese \\\"drones baratos ganham a proxima guerra\\\" estiver certa, o dinheiro pode ir quase todo\\npara os donos do stack de autonomia — e a Kratos vende-lhes a fuselagem.\\n\\n**A escala nao bate certo com o preco.** A Kratos diz que vai subir a producao para\\n**~40 Valkyries por ano ate ao fim de 2027**. O Incremento 1 sao 150 aeronaves e o Incremento\\n2 podera chegar a ~2.350. A accao esta a ser comprada por um programa em que a empresa,\\nhoje, nao esta.\\n\\n**Correccao a buy-list:** o `why_now` registado — \\\"unico loyal wingman US em producao\\\" —\\ndeixou de ser verdade a 17 de Junho de 2026. Quem esta em producao e o YFQ-42A da General\\nAtomics e o YFQ-44A da Anduril.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"Impossivel de dizer com honestidade — mas o onus da prova esta do lado optimista. Nao ha\\naqui um multiplo comparavel util: a Kratos tem um negocio legado de alvos aereos e\\nturbinas com margem baixa e previsivel, e por cima uma opcao sobre CCA. O que se pode dizer\\nsem inventar e a assimetria de ordens de grandeza: o valor contratado **visivel e atribuivel**\\nao programa Valkyrie sao dezenas de milhoes — um\\n[contrato de $34,8M para integracao de sistema de missao](https://www.kratosdefense.com/newsroom/kratos-receives-34-8m-contract-for-valkyrie-mission-system-integration)\\ne uma fatia de um OTA de $231,5M em que nao e prime — enquanto a tese que sustenta a accao\\nfala de milhares de fuselagens num incremento cujos fornecedores ainda nao foram anunciados.\\n\\nNao ponho um alvo. Ponho a pergunta: quanto e que ja esta pago do Incremento 2?\",\"verdict\":\"impossivel de dizer\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | A Kratos entra no Incremento 2 (ate ~2.350 aeronaves) ou fecha uma encomenda internacional grande de XQ-58 | Anuncio de fornecedores do Incremento 2 — data ainda nao publica | baixa a media |\\n| Base | Fornecedor de celula e de alvos com crescimento real mas linear: ~40 Valkyries/ano ate fim de 2027, mais o legado | Divulgacoes de entregas em 2027; resultados trimestrais | alta |\\n| Bear | Os primes de autonomia integram verticalmente a celula e a Kratos fica um fornecedor de componentes num mercado com muitos concorrentes | Qualquer CCA adjudicado a um prime que fabrique a propria fuselagem | media |\",\"verdict\":\"\",\"falsifier\":\"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa.\"}],\"verdict\":\"impossivel de dizer\",\"verdictKey\":\"incerto\",\"falsifier\":\"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa.\"},{\"ticker\":\"RKLB\",\"name\":\"Rocket Lab USA\",\"theme\":\"Espaco & Deep Tech\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"Outra vez a propria empresa. O **Electron** voou pela primeira vez a **25 de Maio de 2017**,\\nchegou ao espaco e nao chegou a orbita por causa de uma falha de equipamento de comunicacoes\\nem terra; **orbitou ao segundo voo, a 21 de Janeiro de 2018**. Oito meses entre \\\"quase\\\" e\\n\\\"feito\\\", e um negocio real depois disso.\\n\\nO **Neutron** foi anunciado a **1 de Marco de 2021 com estreia prevista para 2024**. Passou\\npara meados de 2025, depois para\\n[o fim de 2026](https://spaceflightnow.com/2025/11/11/rocket-lab-delays-debut-of-neutron-rocket-to-2026/),\\ne em Agosto de 2026 a\\n[janela para 2026 \\\"esta a estreitar\\\"](https://spaceflightnow.com/2026/08/10/window-for-2026-launch-debut-of-rocket-labs-neutron-rocket-is-narrowing-as-development-continues/),\\ncom [2027 em cima da mesa](https://spacenews.com/first-neutron-launch-may-slip-to-2027/).\\nA 21 de Janeiro rebentou um tanque do primeiro andar num teste de carregamento com agua.\\n\\n**A licao do analogo e dupla, e as duas metades importam:** a Rocket Lab acaba por fazer o\\nfoguetao voar — mas o calendario que anuncia nunca se cumpre. Quem comprou o Electron pela\\ndata perdeu; quem comprou pela empresa ganhou. Cinco anos de derrapagem no Neutron sao\\nconsistentes com o historico, nao uma anomalia.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**\\\"Entrega a rampa\\\" nao e \\\"lancamento\\\".** A linguagem do filing e sobre alinhar a producao do\\ntanque do primeiro andar com a entrega do Neutron **a rampa** no Q4 2026. Entre estar na\\nrampa e voar fica o **static fire integrado em Wallops** — descrito como o marco de maior\\nrisco de todo o caminho. Quem le \\\"Q4 2026\\\" como data de voo esta a saltar o passo mais\\nperigoso.\\n\\n**O mercado endereçavel do Neutron e \\\"quem nao e a SpaceX\\\".** O Neutron foi desenhado para\\nmega-constelacoes, e o maior operador de mega-constelacoes do mundo tem foguetoes proprios e\\nnao compra lancamentos. O que sobra e real — governo, operadores comerciais, defesa — mas e\\nmenor do que o TAM que se cita.\\n\\n**A parte que ja ganha dinheiro nao e o foguetao.** A divisao de sistemas espaciais\\n(componentes, satelites, Photon) e o negocio com receita hoje; o mercado esta a valorizar o\\nlancador. Se o Neutron derrapar mais um ano, o que segura a empresa e o segmento que quase\\nninguem discute.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"E a forma do \\\"caro\\\" importa: isto e uma opcao com theta. Nao vale a pena procurar um\\nmultiplo: nao ha lucro estabilizado para dividir. A leitura\\nhonesta e estrutural — o preco e essencialmente **uma opcao de compra sobre o Neutron\\nfuncionar**, montada em cima de um negocio de componentes que gera receita. Opcoes perdem\\nvalor com o tempo. Cada trimestre em que a estreia escorrega sem falha catastrofica nao e\\nneutro: e premio a evaporar-se. Foi por isso que os avisos de carry ja registados\\n(\\\"Neutron Q4 2026 nao reafirmado; escorregamento 2027 possivel\\\") sao a informacao mais\\nimportante do nome, e nao um rodape.\",\"verdict\":\"caro\",\"falsifier\":\"\"},{\"title\":\"Cenarios\",\"body\":\"| Cenario | Tese | Gatilho datavel | Probabilidade |\\n|---------|------|-----------------|---------------|\\n| Bull | Static fire integrado limpo e orbita no primeiro ou segundo voo ate meados de 2027; a carteira media-lift converte-se | Static fire integrado concluido em LC-3 sem anomalia | media |\\n| Base | Entrega a rampa no Q4 2026, primeiro voo em 2027, orbita ao segundo — o padrao do proprio Electron | Anuncio de data de static fire; resultados trimestrais | alta |\\n| Bear | Nova falha estrutural em teste empurra para 2028 e obriga a aumento de capital antes de haver receita de Neutron | Anomalia em teste; qualquer prospecto de emissao | media |\",\"verdict\":\"\",\"falsifier\":\"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \\\"aspiracao\\\" em \\\"plano\\\", e sobe o cenario base de uma prateleira.\"}],\"verdict\":\"caro\",\"verdictKey\":\"caro\",\"falsifier\":\"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \\\"aspiracao\\\" em \\\"plano\\\", e sobe o cenario base de uma prateleira.\"},{\"ticker\":\"IONQ\",\"name\":\"IonQ\",\"theme\":\"IA & Computacao\",\"why\":\"cabaz do mes\",\"confidence\":\"parcial\",\"lenses\":[{\"title\":\"Analogo historico\",\"body\":\"**Celera Genomics, 2000-2001.** A Celera sequenciou o genoma humano — a proeza cientifica da\\ndecada — e a accao [chegou a ~$276 em Marco de 2000](https://money.cnn.com/2000/04/10/companies/celera/).\\nEm [Abril de 2001 estava a $33,50](https://www.forbes.com/2001/04/11/0411sf.html). A ciencia\\nestava certa. O modelo de negocio — vender acesso a dados genomicos — e que nao aguentou.\\n\\nO que aconteceu ao dinheiro e a parte que interessa: **foi para quem fazia as maquinas.**\\nA Illumina fez IPO em Julho de 2000, tres anos antes de o Projecto Genoma acabar, levantando\\n$96M a $16 por accao, e tornou-se a infraestrutura de medicao de toda a industria\\n([Century of Bio](https://centuryofbio.com/p/illumina)). Numa revolucao de plataforma, o\\nvalor assenta muitas vezes em quem vende as picaretas, nao em quem anuncia a descoberta.\\n\\n**O que e igual:** uma capacidade genuinamente nova, um vencedor simbolico, e um mercado\\ndisposto a pagar hoje por receita que so faz sentido daqui a uma decada.\\n**O que e diferente:** a IonQ tem receita a serio a entrar e clientes governamentais — a\\nCelera nunca teve. O analogo avisa sobre a **forma** do risco, nao garante o desfecho.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"O invisivel\",\"body\":\"**A qualidade da receita nao e a quantidade.** A IonQ reportou\\n[$64,7M no Q1 2026, +755% em termos homologos](https://www.businesswire.com/news/home/20260506736198/en/IonQ-Announces-First-Quarter-2026-Financial-Results),\\ne subiu o guidance anual para $280-290M. Mas parte material desse crescimento vem de\\n**aquisicoes e de trabalho especializado de hardware**, nao de adopcao organica de\\ncomputacao quantica por iao aprisionado. Crescimento comprado e crescimento; nao e prova de\\nmercado.\\n\\n**A IonQ esta a comprar as suas proprias picaretas.** Recebeu os primeiros QPUs\\ncompletamente integrados da **SkyWater** — uma fundicao. Na analogia da Celera, isso poe a\\nIonQ do lado de quem *usa* o instrumento. Quem fornece fundicao, criogenia, lasers e\\nfotonica vende a toda a industria quantica, ganhe quem ganhar a arquitectura.\\n\\n**A arquitectura nao e exclusiva.** Iao aprisionado tem concorrentes directos — Quantinuum,\\nAlpine Quantum Technologies. E a exclusao da IonQ de um pacote federal de ~$2 mil milhoes\\npara quantica e um sinal de que o Estado nao esta a tratar a empresa como campea nacional\\nunica. Ambos os pontos vem de comentario publico, nao de filings: **confianca parcial**.\",\"verdict\":\"\",\"falsifier\":\"\"},{\"title\":\"Under/over-value\",\"body\":\"A empresa diz que espera perdas significativas e despesa operacional crescente no futuro\\nprevisivel. Nao ha lucro para multiplicar, e um multiplo sobre vendas de uma receita\\nparcialmente adquirida compara mal com o que quer que seja. O ancoradouro honesto e\\nqualitativo: **o preco e uma afirmacao sobre marcos tecnicos futuros**, e uma parte\\ndesproporcionada dele depende de coisas — correccao de erros a escala util, o roadmap de\\n
