<title>Investment Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══ Tokens — dark-first (.impeccable.md: refined dark / warm neutrals / gold) ═══ */
:root {
  --font: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;

  --bg:          oklch(10% 0.008 55);
  --surface:     oklch(13.5% 0.008 55);
  --surface-2:   oklch(17% 0.008 55);
  --hover:       oklch(20% 0.01 55);
  --line:        oklch(22% 0.008 55);
  --line-soft:   oklch(17% 0.006 55);

  --ink:         oklch(93% 0.01 55);
  --ink-2:       oklch(68% 0.01 55);
  --ink-3:       oklch(48% 0.008 55);

  --accent:      oklch(76% 0.13 78);
  --accent-dim:  oklch(76% 0.13 78 / 0.14);
  --accent-line: oklch(76% 0.13 78 / 0.35);

  --good:        oklch(72% 0.15 148);
  --good-dim:    oklch(72% 0.15 148 / 0.13);
  --bad:         oklch(68% 0.19 25);
  --bad-dim:     oklch(68% 0.19 25 / 0.13);
  --warn:        oklch(78% 0.14 82);
  --warn-dim:    oklch(78% 0.14 82 / 0.13);

  --on-accent:   oklch(16% 0.02 60);

  --weight: 350;
  --shadow: none;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        oklch(97.5% 0.005 65);
    --surface:   oklch(100% 0.002 65);
    --surface-2: oklch(95% 0.006 65);
    --hover:     oklch(93% 0.008 65);
    --line:      oklch(88% 0.007 65);
    --line-soft: oklch(93% 0.005 65);

    --ink:       oklch(20% 0.012 55);
    --ink-2:     oklch(45% 0.011 55);
    --ink-3:     oklch(62% 0.009 55);

    --accent:      oklch(52% 0.13 62);
    --accent-dim:  oklch(52% 0.13 62 / 0.10);
    --accent-line: oklch(52% 0.13 62 / 0.30);

    --good:      oklch(46% 0.14 148);
    --good-dim:  oklch(46% 0.14 148 / 0.10);
    --bad:       oklch(49% 0.18 25);
    --bad-dim:   oklch(49% 0.18 25 / 0.10);
    --warn:      oklch(52% 0.13 72);
    --warn-dim:  oklch(52% 0.13 72 / 0.12);
    --on-accent: oklch(99% 0.005 65);

    --weight: 400;
    --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);
  }
}

:root[data-theme="light"] {
  --bg:        oklch(97.5% 0.005 65);
  --surface:   oklch(100% 0.002 65);
  --surface-2: oklch(95% 0.006 65);
  --hover:     oklch(93% 0.008 65);
  --line:      oklch(88% 0.007 65);
  --line-soft: oklch(93% 0.005 65);

  --ink:       oklch(20% 0.012 55);
  --ink-2:     oklch(45% 0.011 55);
  --ink-3:     oklch(62% 0.009 55);

  --accent:      oklch(52% 0.13 62);
  --accent-dim:  oklch(52% 0.13 62 / 0.10);
  --accent-line: oklch(52% 0.13 62 / 0.30);

  --good:      oklch(46% 0.14 148);
  --good-dim:  oklch(46% 0.14 148 / 0.10);
  --bad:       oklch(49% 0.18 25);
  --bad-dim:   oklch(49% 0.18 25 / 0.10);
  --warn:      oklch(52% 0.13 72);
  --warn-dim:  oklch(52% 0.13 72 / 0.12);
  --on-accent: oklch(99% 0.005 65);

  --weight: 400;
  --shadow: 0 1px 2px oklch(20% 0.02 55 / 0.06), 0 4px 16px oklch(20% 0.02 55 / 0.04);
}

*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, p, figure, blockquote { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { max-width: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-weight: var(--weight);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ═══ Movimento ═══
   Regra unica: o movimento tem de mostrar alguma coisa — de onde veio o painel,
   que numero e aquele, o que acabou de mudar, que esta a gravar. Nada aqui e
   decoracao. A regra de prefers-reduced-motion acima desliga tudo isto de uma vez,
   e o JS tem o mesmo interruptor. */
:root {
  --ease:     cubic-bezier(.22, .61, .36, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --t-micro: .15s;
  --t-ui:    .26s;
  --t-enter: .52s;
}

@keyframes rise    { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
@keyframes fade    { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes ping    { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .45; } }
@keyframes flash   { from { background: var(--accent-dim); } to { background: transparent; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

/* O painel entra de baixo, em cascata — so na primeira vez que e aberto.
   O JS tira a classe `intro` no fim, para um re-render nao voltar a animar. */
.panel.on { animation: fade var(--t-ui) var(--ease); }
.panel.intro > * { animation: rise var(--t-enter) var(--ease-out) backwards; }
.panel.intro > *:nth-child(1)  { animation-delay: .01s; }
.panel.intro > *:nth-child(2)  { animation-delay: .05s; }
.panel.intro > *:nth-child(3)  { animation-delay: .09s; }
.panel.intro > *:nth-child(4)  { animation-delay: .13s; }
.panel.intro > *:nth-child(5)  { animation-delay: .17s; }
.panel.intro > *:nth-child(6)  { animation-delay: .21s; }
.panel.intro > *:nth-child(7)  { animation-delay: .25s; }
.panel.intro > *:nth-child(8)  { animation-delay: .29s; }
.panel.intro > *:nth-child(n+9) { animation-delay: .33s; }

/* A barra do separador activo desliza de um para o outro em vez de saltar —
   e o movimento que diz de onde vieste. */
.tab-ink {
  position: absolute; bottom: -1px; left: 0; width: 0; height: 2px;
  background: var(--accent); border-radius: 2px 2px 0 0; pointer-events: none;
  transition: transform var(--t-ui) var(--ease-out), width var(--t-ui) var(--ease-out);
}

/* A troca de tema so precisa de transicao durante a troca. */
:root.theming, :root.theming * {
  transition: background-color var(--t-ui) var(--ease), color var(--t-ui) var(--ease),
              border-color var(--t-ui) var(--ease) !important;
}

/* Gravar e um estado, nao um instante. */
.spin {
  display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* A linha que acabaste de escrever acende-se uma vez. */
tr[data-flash] { animation: flash 1.5s var(--ease); }

.num { font-variant-numeric: tabular-nums; }

/* ═══ Header ═══ */
.top {
  display: flex; align-items: baseline; gap: 16px;
  padding: 22px 32px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.wordmark span { color: var(--accent); }
.top .meta { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 12px; color: var(--ink-3); }

.theme-btn {
  background: none; border: 1px solid var(--line); color: var(--ink-3);
  width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
  display: grid; place-items: center; transition: color .15s, border-color .15s;
}
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.theme-btn svg { width: 15px; height: 15px; }
:root[data-theme="light"] .i-sun { display: none; }
:root:not([data-theme="dark"]) .i-sun { display: none; }
:root:not([data-theme="dark"]) .i-moon { display: block; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .i-moon { display: none; }
  :root:not([data-theme="dark"]) .i-sun { display: block; }
}
:root[data-theme="dark"] .i-sun { display: block; }
:root[data-theme="dark"] .i-moon { display: none; }
:root[data-theme="light"] .i-moon { display: block; }

/* ═══ Tabs ═══ */
.tabs { position: relative; display: flex; gap: 2px; padding: 0 32px; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
.tab {
  appearance: none; background: none; border: none; font: inherit;
  padding: 13px 16px; font-size: 13px; font-weight: 500; color: var(--ink-3);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  transition: color .15s;
}
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); }
/* Tres batidas e para — chama a atencao sem ficar a piscar para sempre. */
.tab .dot { animation: ping 1.9s var(--ease) 3; }
.tab .dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); margin-left: 6px; vertical-align: 3px;
}
.tab .badge {
  display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 20px;
  background: var(--surface-2); color: var(--ink-3); font-size: 11px; font-weight: 600;
}
.tab[aria-selected="true"] .badge { background: var(--accent-dim); color: var(--accent); }

/* ═══ Layout ═══ */
main { max-width: 1080px; margin: 0 auto; padding: 34px 32px 90px; }
.panel { display: none; flex-direction: column; gap: 30px; }
.panel.on { display: flex; }

.lede { font-size: 13px; color: var(--ink-3); margin: -8px 0 0; max-width: 82ch; }

code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .89em; padding: 1px 5px; border-radius: 4px;
  background: var(--surface-2); color: var(--ink-2);
}

h2.sec {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
  color: var(--ink-3); margin: 0 0 14px; padding-bottom: 9px; border-bottom: 1px solid var(--line-soft);
}

.card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px; box-shadow: var(--shadow); }

/* ═══ Hero — a compra do mes ═══ */
.hero { padding: 30px 32px; border: 1px solid var(--accent-line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.hero .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--accent); margin: 0; }
.hero-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.hero .amt { margin-left: auto; font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
.hero .why { margin: 20px 0 0; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-3); max-width: 68ch; }
.hero .why strong { color: var(--ink-2); font-weight: 600; }
.hero-empty { padding: 30px 32px; }

/* Linhas do cabaz */
.basket { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.basket li {
  display: grid; grid-template-columns: 62px minmax(150px, 1.1fr) minmax(120px, .9fr) 1.4fr;
  align-items: baseline; gap: 18px;
  padding: 14px 0; border-top: 1px solid var(--line-soft);
}
.basket li:first-child { border-top: none; padding-top: 0; }
.line-amt { font-size: 19px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.line-id strong { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.line-id .co { display: block; font-size: 12.5px; color: var(--ink-3); }
.line-th { font-size: 12.5px; color: var(--ink-2); }
.line-th em { display: block; font-style: normal; font-size: 11.5px; color: var(--accent); font-variant-numeric: tabular-nums; }
.line-cat { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 720px) {
  .basket li { grid-template-columns: 58px 1fr; gap: 6px 14px; }
  .line-th, .line-cat { grid-column: 2; }
}

/* ═══ Barras de alocacao (alvo vs actual) ═══ */
.alloc { display: flex; flex-direction: column; gap: 3px; }
.alloc-row {
  display: grid; grid-template-columns: 168px 1fr 74px; align-items: center; gap: 16px;
  padding: 9px 12px; border-radius: 8px; transition: background .15s;
}
.alloc-row:hover { background: var(--hover); }
.alloc-row .nm { font-size: 13px; color: var(--ink-2); }
.alloc-row.lead .nm { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 22px; background: var(--surface-2); border-radius: 4px; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; min-width: 2px; }
.alloc-row:not(.lead) .fill { background: var(--ink-3); }
.mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.mark::after {
  content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--ink);
}
.alloc-row .val { font-size: 12.5px; color: var(--ink-3); text-align: right; }
.alloc-key { display: flex; gap: 20px; margin-top: 14px; font-size: 11.5px; color: var(--ink-3); }
.alloc-key i { display: inline-block; width: 11px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* ═══ Alertas ═══ */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: grid; grid-template-columns: 3px 1fr; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--line-soft); }
.alert .stripe { background: var(--ink-3); }
.alert[data-l="high"] .stripe { background: var(--bad); }
.alert[data-l="warn"] .stripe { background: var(--warn); }
.alert[data-l="info"] .stripe { background: var(--good); }
.alert .in { padding: 15px 18px; }
.alert .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.alert .t { font-size: 13.5px; font-weight: 600; }
.alert p { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 74ch; }

.chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--ink-2); }
.chip.tick { background: var(--accent-dim); color: var(--accent); }
.chip[data-acct="verificar"] { background: var(--warn-dim); color: var(--warn); }
.chip[data-acct="cto-pea"] { background: var(--good-dim); color: var(--good); }
.chip.high { background: var(--bad-dim); color: var(--bad); }
.chip.warn { background: var(--warn-dim); color: var(--warn); }
.chip.info { background: var(--good-dim); color: var(--good); }

.carry { padding: 14px 18px; font-size: 12.5px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; }
.carry b { color: var(--ink-2); font-weight: 600; }

/* ═══ Tabelas ═══ */
.tw { overflow-x: auto; border: 1px solid var(--line-soft); border-radius: 10px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 11px 14px; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
th[data-k] { cursor: pointer; user-select: none; }
th[data-k]:hover { color: var(--ink-2); }
th .ar { color: var(--accent); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--hover); }
td.k { color: var(--ink); font-weight: 500; white-space: nowrap; }
td.w { min-width: 260px; font-size: 12.5px; }
.sc { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.sc[data-s="5"] { background: var(--accent-dim); color: var(--accent); }
.sc[data-s="4"] { background: var(--good-dim); color: var(--good); }
.dir { font-weight: 600; white-space: nowrap; }
.dir.up { color: var(--good); }
.dir.down { color: var(--bad); }
.dir.flat { color: var(--ink-3); }

.empty { padding: 30px; text-align: center; color: var(--ink-3); font-size: 13px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }

/* ═══ Sintese ═══ */
.wk { display: flex; flex-direction: column; gap: 24px; }
.wk article { padding: 22px 26px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; }
.wk h3 { margin: 0 0 12px; font-size: 15px; font-weight: 600; text-wrap: balance; }
.wk .body { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; max-width: 78ch; overflow-wrap: break-word; }
.wk .body strong { color: var(--ink); font-weight: 600; }

.foot { margin-top: 46px; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-3); }

/* ═══ Carteira viva — resumo, P/L e formulario ═══ */

/* Quatro numeros que se leem de relance. Nao e um grafico: com 1-4 linhas e uma
   captura de preco por dia, qualquer grafico seria decoracao. */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface); padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 3px; }
.stat .lbl { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); }
.stat b { font-size: 23px; font-weight: 700; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
.stat .sep { color: var(--ink-3); font-weight: 400; margin: 0 5px; }
.stat em { font-style: normal; font-size: 11.5px; color: var(--ink-3); }

/* Verde/vermelho e estado, nao o accent. O sinal vai sempre no texto — a cor
   nunca e o unico portador da informacao. */
.pl.up { color: var(--good); }
.pl.down { color: var(--bad); }
.pl.flat { color: var(--ink-2); }
td .sub { display: block; font-style: normal; font-size: 11px; }
.dash { color: var(--ink-3); }

.stale {
  display: inline-block; margin-left: 5px; padding: 1px 6px; border-radius: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: .02em;
  background: var(--warn-dim); color: var(--warn); vertical-align: 1px;
}

table.pos td { vertical-align: middle; }
.rowact { white-space: nowrap; text-align: right; }
.mini {
  appearance: none; background: none; border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink-3); font-size: 11.5px; padding: 3px 9px; cursor: pointer; margin-left: 5px;
  transition: color .15s, border-color .15s;
}
.mini:hover { color: var(--ink); border-color: var(--ink-3); }

/* ── formulario ── */
.posform {
  margin-top: 16px; padding: 20px 22px 18px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 16px;
}
.posform[inert] { opacity: .55; }
.form-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.form-head h3 { font-size: 13.5px; font-weight: 600; }
.form-mode { margin-left: auto; font-size: 11.5px; color: var(--ink-3); }

.pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; margin-right: 6px; }
.pill.ok { background: var(--good-dim); color: var(--good); }
.pill.warn { background: var(--warn-dim); color: var(--warn); }
.pill.wait { background: var(--surface-2); color: var(--ink-3); }

.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 14px; }
.fields .wide { grid-column: span 2; }
@media (max-width: 480px) { .fields .wide { grid-column: span 1; } }
.fields label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.fields input, .fields select {
  appearance: none; font: inherit; font-size: 14px; font-weight: 400;
  text-transform: none; letter-spacing: 0; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; width: 100%; min-width: 0;
}
.fields select {
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 14px center, right 9px center;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 30px;
}

<script>
/* Injectado pelo build a partir de scripts/prices.ts + scripts/valuation.ts —
   a mesma conta de P/L que corre no build corre aqui. Nao editar a mao. */
/*__SHARED__*/

const D = /*__DATA__*/null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";

const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

/** Markdown de leitura: paragrafos e tabelas. Nao e um parser geral — cobre o que a tese usa. */
function rich(src, tableClass = "") {
  const lines = String(src ?? "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("|") && /^\|[\s:|-]+\|$/.test((lines[i + 1] ?? "").trim())) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      out.push(`<div class="tw"><table class="${tableClass}"><thead><tr>` +
        head.map((h) => `<th>${esc(h)}</th>`).join("") + `</tr></thead><tbody>` +
        rows.map((r) => `<tr>` + r.map((c, n) => {
          const prob = tableClass === "scen" && n === head.length - 1;
          // data-l e o rotulo que substitui o cabecalho quando a tabela vira cartoes no telemovel.
          const label = tableClass === "scen" && n > 0 ? ` data-l="${esc(head[n])}"` : "";
          return `<td${label}>${prob ? `<span class="prob" data-p="${esc(c.split(" ")[0])}">${esc(c)}</span>` : md(c)}</td>`;
        }).join("") + `</tr>`).join("") + `</tbody></table></div>`);
    } else if (!line.trim()) {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !lines[i].trim().startsWith("|")) para.push(lines[i++]);
      out.push(`<p>${md(para.join(" "))}</p>`);
    }
  }
  return out.join("");
}

/* ── Movimento ──
   Um so interruptor. A folha de estilo ja desliga as animacoes CSS com
   prefers-reduced-motion; isto desliga as que sao feitas em JS. */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)");
const still = () => REDUCED.matches;

/**
 * Conta de 0 ate ao valor final preservando o que esta a volta ("€130.00",
 * "+2.5%", "5"). Elementos com filhos ficam de fora — nao vale a pena arriscar
 * destruir marcacao por causa de uma animacao.
 */
function countUp(el) {
  if (el.children.length) return;
  const txt = el.textContent;
  const m = txt.match(/\d+(?:[.,]\d+)?/);
  if (!m) return;
  const to = parseFloat(m[0].replace(",", "."));
  if (!isFinite(to) || to < 2) return;          // contar ate 1 nao e uma animacao
  const dec = (m[0].split(/[.,]/)[1] || "").length;
  const head = txt.slice(0, m.index), tail = txt.slice(m.index + m[0].length);
  const t0 = performance.now(), dur = 620;
  const tick = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = head + (to * (1 - Math.pow(1 - k, 3))).toFixed(dec) + tail;
    if (k < 1) requestAnimationFrame(tick);
    else el.textContent = txt;                  // o texto original volta intacto
  };
  requestAnimationFrame(tick);
}

/** A entrada corre uma vez por painel — um re-render nao a repete. */
const introduced = new Set();
function intro(id) {
  if (introduced.has(id)) return;
  introduced.add(id);
  const p = document.getElementById("p-" + id);
  if (!p || still()) return;
  p.classList.add("intro");
  p.querySelectorAll(".stat b.num, .hero .amt").forEach(countUp);
  setTimeout(() => p.classList.remove("intro"), 1100);
}

/* ── Tema ── */
let themeTimer = 0;
const themeBtn = document.getElementById("themeBtn");
const stored = localStorage.getItem("scanner_theme");
if (stored) document.documentElement.setAttribute("data-theme", stored);
themeBtn.addEventListener("click", () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").includes("10%");
  // A transicao de cor so existe durante a troca — fora disso nao ha custo nenhum.
  if (!still()) {
    root.classList.add("theming");
    clearTimeout(themeTimer);
    themeTimer = setTimeout(() => root.classList.remove("theming"), 320);
  }
  const next = dark ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("scanner_theme", next); } catch (e) {}
});

document.getElementById("stamp").textContent = D.delta.date || D.built;
document.getElementById("built").textContent = D.built;

/** Pill de prazo: so aparece quando a data foi mesmo lida do texto do catalisador. */
function deadlinePill(iso) {
  if (!iso) return "";
  const d = Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(D.built + "T00:00:00Z")) / 86400000);
  if (d < 0) return `<span class="due" data-d="passou">passou</span>`;
  if (d <= 7)  return `<span class="due" data-d="ja">${d === 0 ? "hoje" : d + "d"}</span>`;
  if (d <= 30) return `<span class="due" data-d="perto">${d}d</span>`;
  if (d <= 90) return `<span class="due" data-d="longe">${Math.round(d / 7)}sem</span>`;
  return "";
}

/* ── O que mudou desde a ultima visita ── */
/* Guardamos o que ja foi visto, nao a hora da visita: assim "novo" continua a
   ser novo mesmo que se abra a pagina duas vezes sem ler nada. */
const SEEN_KEY = "scanner_seen";
const seen = (() => {
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; }
})();
const fresh = {
  hoje: !!D.delta.date && seen.delta !== D.delta.date,
  noticias: !!D.news.date && seen.news !== D.news.date,
  tese: !!D.thesis.date && seen.thesis !== D.thesis.date,
  semana: !!D.weekly.date && seen.weekly !== D.weekly.date,
};
const firstVisit = !seen.delta && !seen.news && !seen.thesis && !seen.weekly;

function markSeen(id) {
  const key = { hoje: "delta", noticias: "news", tese: "thesis", semana: "weekly" }[id];
  const date = { hoje: D.delta.date, noticias: D.news.date, tese: D.thesis.date, semana: D.weekly.date }[id];
  if (!key || !date) return;
  fresh[id] = false;
  seen[key] = date;
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
  const dot = nav.querySelector(`.tab[data-t="${id}"] .dot`);
  if (dot) dot.remove();
}

/* ── Tabs ── */
const TABS = [
  { id: "hoje", label: "Hoje", badge: D.delta.alerts.length || null },
  { id: "carteira", label: "Carteira", badge: null },
  { id: "tese", label: "Tese", badge: D.thesis.names.length || null },
  { id: "noticias", label: "Noticias", badge: D.news.items.length || null },
  { id: "buylist", label: "Buy-list", badge: D.buylist.picks.length },
  { id: "semana", label: "Semana", badge: null },
];
const nav = document.getElementById("tabs");
nav.innerHTML = TABS.map((t, i) =>
  `<button class="tab" role="tab" id="tab-${t.id}" data-t="${t.id}"
     aria-controls="p-${t.id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${t.label}` +
  (t.badge ? `<span class="badge num">${t.badge}</span>` : "") +
  (fresh[t.id] && !firstVisit ? `<span class="dot" title="novidade desde a tua ultima visita"></span>` : "") +
  `</button>`
).join("");
const ink = document.createElement("span");
ink.className = "tab-ink";
nav.appendChild(ink);

/** Poe a barra por baixo do separador activo, em coordenadas do conteudo — a fila
 *  de separadores faz scroll no telemovel. */
function moveInk() {
  const btn = nav.querySelector('.tab[aria-selected="true"]');
  if (!btn) return;
  const a = nav.getBoundingClientRect(), b = btn.getBoundingClientRect();
  ink.style.width = b.width + "px";
  ink.style.transform = `translateX(${b.left - a.left + nav.scrollLeft}px)`;
}
addEventListener("resize", moveInk);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInk);

TABS.forEach((t) => {
  const p = document.getElementById("p-" + t.id);
  if (p) { p.setAttribute("aria-labelledby", "tab-" + t.id); p.tabIndex = 0; }
});

function show(id) {
  nav.querySelectorAll(".tab").forEach((b) => {
    const on = b.dataset.t === id;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === "p-" + id));
  try { localStorage.setItem("scanner_tab", id); } catch (e) {}
  markSeen(id);
  moveInk();
  intro(id);
}
window.__show = show;  // usado por scripts/shoot.mjs e scripts/page-checks.mjs

nav.addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (b) show(b.dataset.t);
});

/* Setas navegam entre separadores, como um tablist deve fazer. */
nav.addEventListener("keydown", (e) => {
  const keys = { ArrowRight: 1, ArrowLeft: -1, Home: "first", End: "last" };
  if (!(e.key in keys)) return;
  e.preventDefault();
  const ids = TABS.map((t) => t.id);
  const at = ids.indexOf(e.target.dataset.t);
  const next = keys[e.key] === "first" ? 0
    : keys[e.key] === "last" ? ids.length - 1
    : (at + keys[e.key] + ids.length) % ids.length;
  show(ids[next]);
  nav.querySelector(`.tab[data-t="${ids[next]}"]`).focus();
});

/* ── Hoje ── */
(function () {
  const d = D.delta;
  const parts = [];

  // Resumo antes do detalhe: o estado da carteira, o que se compra este mes e o
  // que e novo — legivel de relance antes de qualquer alerta.
  (function summary() {
    const t = D.valuation.totals;
    const held = D.portfolio.positions.length;
    const spent = D.rec.basket.reduce((s, b) => s + b.amount, 0);
    const worst = d.alerts.some((a) => a.level === "high") ? "high"
      : d.alerts.some((a) => a.level === "warn") ? "warn" : "info";
    const affects = D.news.items.filter((i) => i.relevance === "carteira").length;
    const days = (iso) => Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(D.built + "T00:00:00Z")) / 86400000);
    const soon = D.buylist.picks
      .filter((p) => p.deadline && days(p.deadline) >= 0 && days(p.deadline) <= 30)
      .sort((a, b) => days(a.deadline) - days(b.deadline));

    const tiles = [
      `<div class="stat"><span class="lbl">Carteira</span>
        <b class="num${t.pl === null ? "" : " pl " + (t.pl > 0 ? "up" : t.pl < 0 ? "down" : "flat")}">${
          held === 0 ? "vazia" : (t.value === null ? "€" + t.invested.toFixed(0) : "€" + t.value.toFixed(0))}</b>
        <em>${held === 0 ? "regista a primeira compra em Carteira"
          : (t.plPct === null ? `${held} linhas · falta preco` : `${held} linhas · ${t.plPct >= 0 ? "+" : "−"}${Math.abs(t.plPct).toFixed(1)}%`)}</em></div>`,
      `<div class="stat"><span class="lbl">Cabaz do mes</span>
        <b class="num">${spent ? "€" + spent : "—"}</b>
        <em>${D.rec.basket.length ? D.rec.basket.map((b) => esc(b.pick.ticker)).join(" · ") : "nenhum candidato passou o filtro"}</em></div>`,
      `<div class="stat"><span class="lbl">Alertas e noticias</span>
        <b class="num">${d.alerts.length}<span class="sep">·</span>${D.news.items.length}</b>
        <em>${d.alerts.length ? `mais severo: ${{ high: "carry duplo", warn: "atencao", info: "informativo" }[worst]}` : "nada a assinalar"}${
          affects ? ` · ${affects} afeta${affects === 1 ? "" : "m"} a carteira` : ""}</em></div>`,
      `<div class="stat"><span class="lbl">Prazos ≤30 dias</span>
        <b class="num">${soon.length}</b>
        <em>${soon.length
          ? soon.slice(0, 3).map((p) => `${esc(p.ticker)} ${days(p.deadline)}d`).join(" · ")
          : "nenhum catalisador datado no proximo mes"}</em></div>`,
    ];

    const novo = [
      fresh.hoje ? `delta de ${esc(d.date)}` : "",
      fresh.noticias && D.news.items.length ? `${D.news.items.length} noticias` : "",
      fresh.tese ? `tese de ${esc(D.thesis.date)}` : "",
      fresh.semana ? `sintese de ${esc(D.weekly.date)}` : "",
    ].filter(Boolean);

    parts.push(`<div class="stats">${tiles.join("")}</div>`);
    if (novo.length && !firstVisit) {
      parts.push(`<div class="novo"><b>Novo desde a tua ultima visita</b> ${novo.join(" · ")}</div>`);
    }
  })();

  parts.push(`<p class="lede">Delta de ${esc(d.date)} — ${d.alerts.length} alertas, ${d.moves.length} movimentos.</p>`);

  if (d.alerts.length) {
    parts.push(`<div><h2 class="sec">Alertas</h2><div class="alerts">` + d.alerts.map((a) => `
      <div class="alert" data-l="${esc(a.level)}"><div class="stripe"></div><div class="in">
        <div class="hd">${a.ticker ? `<span class="chip tick">${esc(a.ticker)}</span>` : ""}<span class="t">${esc(a.title)}</span></div>
        <p>${md(a.body)}</p>
      </div></div>`).join("") + `</div></div>`);
  }

  if (d.carried) parts.push(`<div class="carry"><b>Carry sem novidade:</b> ${md(d.carried)}</div>`);

  if (d.moves.length) {
    parts.push(`<div><h2 class="sec">Movimentos</h2><div class="tw"><table>
      <thead><tr><th>Ticker</th><th>Movimento</th><th>Nota</th></tr></thead><tbody>` +
      d.moves.map((m) => {
        // Emoji do DELTA manda; senao, o sinal a abrir o texto. "~$765-766" nao e queda.
        const bare = m.move.replace(/[✅⚠️➡️❌]/gu, "").trim();
        const sign = bare.match(/^([+-])\s*\d/);
        const cls = /✅/.test(m.move) ? "up"
          : /⚠️|❌/.test(m.move) ? "down"
          : sign ? (sign[1] === "+" ? "up" : "down") : "flat";
        const glyph = { up: "▲", down: "▼", flat: "→" }[cls];
        return `<tr><td class="k">${esc(m.ticker)}</td>` +
          `<td class="dir ${cls} num"><span aria-hidden="true">${glyph}</span> ${esc(bare)}</td>` +
          `<td class="w">${esc(m.note)}</td></tr>`;
      }).join("") + `</tbody></table></div></div>`);
  }

  const nn = d.newNames.length
    ? `<div class="tw"><table><thead><tr>${Object.keys(d.newNames[0]).map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
      d.newNames.map((r) => `<tr>${Object.values(r).map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("") + `</tbody></table></div>`
    : `<div class="empty">${md(d.newNamesText) || "Sem nomes novos."}</div>`;
  parts.push(`<div><h2 class="sec">Novos nomes</h2>${nn}</div>`);

  if (d.unchanged) parts.push(`<div class="carry">${md(d.unchanged)}</div>`);
  document.getElementById("p-hoje").innerHTML = parts.join("");
})();

/* ── Carteira ── */
(function () {
  const host = document.getElementById("p-carteira");
  const stateEl = document.getElementById("portfolio-state");
  const THEMES = D.portfolio.targets.map((t) => t.theme);

  /* Estado vivo da carteira. A fonte e o bloco #portfolio-state — nunca o DOM. */
  function readState() {
    try {
      const s = JSON.parse(stateEl.textContent);
      if (s && s.schema === 1 && Array.isArray(s.positions)) return s;
    } catch (e) { /* bloco partido: melhor carteira vazia que lixo */ }
    return { schema: 1, updated: "", positions: [] };
  }

  let state = readState();
  let artifact = null;
  let mode = "connecting";   // connecting · live · local · readonly
  let editing = null;
  let busy = false;
  let touched = null;   // a linha que acabou de ser escrita — acende-se uma vez
  let touchTimer = 0;

  /* ── modo local: so este browser, nunca chega ao repo ── */
  const LOCAL_KEY = "scanner_positions";
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      // Se a pagina foi republicada depois deste rascunho, a pagina ganha:
      // o repo e a carteira a serio, isto era so uma conveniencia.
      if (saved.basedOn !== state.updated) { localStorage.removeItem(LOCAL_KEY); return null; }
      return Array.isArray(saved.positions) ? saved.positions : null;
    } catch (e) { return null; }
  }
  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify({ basedOn: state.updated, positions: state.positions }));
    } catch (e) { /* browser sem storage: fica so em memoria */ }
  }

  /* ── republicar: espelho exacto de fill() em scripts/page-source.ts ──
     A ordem importa. O state primeiro, porque a fonte reinserida contem ela propria
     um %%PORTFOLIO_STATE%% que nao deve ser tocado. */
  const stateJson = (s) => JSON.stringify(s).replace(/</g, "\\u003c");
  function fullDocument(json) {
    const tpl = JSON.parse(document.getElementById("page-source").textContent);
    return tpl
      .replace("%%PORTFOLIO_STATE%%", () => json)
      .replace("%%PAGE_SOURCE%%", () => JSON.stringify(tpl).replace(/</g, "\\u003c"));
  }

  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
    : "pos-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36));

  /* ── ligacao a capability ── */
  const use = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("artifact").catch(() => null)
    : Promise.resolve(null);

  use.then((a) => {
    artifact = a;
    if (a) { setMode("live"); return; }
    const local = loadLocal();
    if (local) state = { ...state, positions: local };
    setMode("local");
  });

  function setMode(next) { mode = next; render(); }

  /* ── gravar ── */
  async function commit(positions, note) {
    const before = state;
    state = { schema: 1, updated: new Date().toISOString(), positions };
    editing = null;

    if (mode !== "live") { saveLocal(); render(note || "guardado neste browser"); return; }

    busy = true;
    render("a gravar…");
    try {
      // A vista recarrega depois de publicar; o rascunho do formulario sobrevive aqui.
      try { sessionStorage.setItem("scanner_form_note", note || ""); } catch (e) {}
      await publishWithRetry(fullDocument(stateJson(state)));
      // Normalmente a vista recarrega aqui. Se por alguma razao nao recarregar,
      // o formulario tem de voltar a funcionar em vez de ficar preso em "a gravar".
      busy = false;
      render("gravado");
    } catch (err) {
      busy = false;
      state = before;      // desfaz o optimismo: o que nao gravou nao aconteceu
      handleError(err);
    }
  }

  async function publishWithRetry(html) {
    try {
      return await artifact.publish(html);
    } catch (err) {
      // So o erro transitorio se repete, uma vez, com espera aleatoria.
      if (err && err.code === "upstream_error") {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        return await artifact.publish(html);
      }
      throw err;
    }
  }

  function handleError(err) {
    const code = (err && err.code) || "upstream_error";
    if (code === "conflict") {
      render("Alguem gravou primeiro — a pagina vai recarregar com a versao mais recente.");
      return;
    }
    if (["not_writer", "not_granted", "not_declared", "consent_required",
         "capability_disabled", "capability_removed"].includes(code)) {
      artifact = null;
      setMode("local");
      render("Esta vista nao pode gravar na pagina. As linhas ficam so neste browser.");
      return;
    }
    const msg = {
      too_large: "A pagina ficou grande demais para gravar. Regista esta compra em PORTFOLIO.md.",
      rate_limited: "Gravacoes a mais seguidas — espera um minuto e tenta outra vez.",
      invalid_content: "A pagina nao ficou num formato gravavel. Regista em PORTFOLIO.md e reconstroi.",
      transform_error: "A pagina nao ficou num formato gravavel. Regista em PORTFOLIO.md e reconstroi.",
    }[code] || "Nao foi possivel gravar. Tenta outra vez daqui a pouco.";
    render(msg);
  }

  /* ── acoes ── */
  function addOrUpdate(f) {
    const p = {
      id: editing || uuid(),
      date: f.date, ticker: f.ticker.trim().toUpperCase(), name: f.name.trim(),
      theme: f.theme, units: Number(f.units), cost_eur: Number(f.cost), value_eur: null,
    };
    const next = editing
      ? state.positions.map((x) => (x.id === editing ? { ...x, ...p } : x))
      : [...state.positions, p];
    touched = p.id;
    clearTimeout(touchTimer);
    touchTimer = setTimeout(() => { touched = null; }, 2500);
    commit(next, editing ? "linha actualizada" : "compra registada");
  }

  function remove(id) {
    const p = state.positions.find((x) => x.id === id);
    if (!p) return;
    if (!confirm(`Apagar ${p.ticker} — ${p.units} unidades por €${p.cost_eur.toFixed(2)}?`)) return;
    commit(state.positions.filter((x) => x.id !== id), "linha apagada");
  }

  /* ── render ── */
  function render(note) {
    const v = valuePositions(state.positions, D.book, D.built);
    const { rows } = themeRows(v.positions, D.portfolio.targets);
    const parts = [];

    if (state.positions.length) parts.push(statRow(v.totals));
    parts.push(basket());
    parts.push(alloc(rows));
    parts.push(positions(v, note));
    host.innerHTML = parts.join("");
    wire();
  }

  const eur = (n) => "€" + n.toFixed(2);
  const signed = (n, unit) => (n >= 0 ? "+" : "−") + unit + Math.abs(n).toFixed(unit === "€" ? 2 : 1) + (unit === "€" ? "" : "%");
  const dir = (n) => (n > 0 ? "up" : n < 0 ? "down" : "flat");
  const dm = (iso) => (iso || "").split("-").reverse().slice(0, 2).join("-");

  /* Resumo antes do detalhe. Nao e um grafico — sao quatro numeros que se leem de relance. */
  function statRow(t) {
    const tiles = [
      `<div class="stat"><span class="lbl">Investido</span><b class="num">${eur(t.invested)}</b>
        <em>${state.positions.length} linha${state.positions.length === 1 ? "" : "s"}</em></div>`,
      `<div class="stat"><span class="lbl">Valor actual</span>
        <b class="num">${t.value === null ? "—" : eur(t.value)}</b>
        <em>${t.unpriced
          ? `so ${t.priced} de ${state.positions.length} linhas — as outras sem preco`
          : (D.book.asof ? `preco de ${dm(D.book.asof)}` : "sem precos")}</em></div>`,
    ];

    tiles.push(t.pl === null
      ? `<div class="stat"><span class="lbl">P/L</span><b class="num">—</b>
          <em>falta preco em ${t.unpriced} linha${t.unpriced === 1 ? "" : "s"}</em></div>`
      : `<div class="stat"><span class="lbl">P/L</span>
          <b class="num pl ${dir(t.pl)}">${signed(t.pl, "€")}</b>
          <em class="pl ${dir(t.pl)}">${signed(t.plPct, "")}</em></div>`);

    const b = t.bench;
    if (b && b.plPct !== null && t.plPct !== null) {
      const d = t.plPct - b.plPct;
      tiles.push(`<div class="stat"><span class="lbl">vs ${esc(b.ticker)}</span>
        <b class="num pl ${dir(d)}">${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(1)} pp</b>
        <em>${esc(b.ticker)} ${signed(b.plPct, "")} no mesmo periodo${b.uncovered ? ` · ${b.uncovered} linha(s) sem historico` : ""}</em></div>`);
    } else if (b && b.plPct !== null) {
      // O benchmark sabe-se; o que falta e o nosso P/L. Mostrar o que se sabe e
      // dizer o que impede a comparacao — nao um travessao sem explicacao.
      tiles.push(`<div class="stat"><span class="lbl">${esc(b.ticker)} no mesmo periodo</span>
        <b class="num pl ${dir(b.plPct)}">${signed(b.plPct, "")}</b>
        <em>comparacao completa quando todas as linhas tiverem preco</em></div>`);
    } else if (b) {
      tiles.push(`<div class="stat"><span class="lbl">vs ${esc(b.ticker)}</span><b class="num">—</b>
        <em>sem historico do benchmark para ${b.uncovered} destas datas</em></div>`);
    }

    return `<div class="stats">${tiles.join("")}</div>` +
      (t.anyStale ? `<p class="lede">Ha precos com mais de ${D.staleAfterDays} dias — marcados na tabela.</p>` : "");
  }

  function basket() {
    const rec = D.rec;
    if (!rec.basket.length) {
      return `<div class="hero hero-empty"><p class="eyebrow">O cabaz deste mes</p>
        <p class="why">Nenhum candidato passou o filtro — todos os nomes dos temas mais descobertos
        estao travados por flag, lockup, praca por confirmar ou marcados como indisponiveis.</p></div>`;
    }
    const spent = rec.basket.reduce((s, b) => s + b.amount, 0);
    const alts = rec.basket.filter((b) => b.alternatives.length);
    return `<div class="hero">
      <div class="hero-head"><p class="eyebrow">O cabaz deste mes</p><span class="amt num">€${spent}</span></div>
      <ol class="basket">` + rec.basket.map((b) => `
        <li>
          <span class="line-amt num">€${b.amount}</span>
          <span class="line-id"><strong>${esc(b.pick.ticker)}</strong><span class="co">${esc(b.pick.name)}</span></span>
          <span class="line-th">${esc(b.theme)}<em>${pct(b.gap)} vs alvo</em></span>
          <span class="line-cat">${esc(b.pick.catalyst)}</span>
        </li>`).join("") + `</ol>
      <p class="why">Reparticao proporcional ao desvio face ao alvo, calculada em ${esc(D.built)}.
        Executa como <strong>planos programados</strong> — €0 de comissao. Em ordens avulsas sao
        €${rec.basket.length} de settlement, ${((rec.basket.length / spent) * 100).toFixed(0)}% do aporte.</p>
    </div>` + (alts.length ? `<div class="carry"><b>Alternativas por tema:</b> ` +
      alts.map((b) => `${esc(b.theme)} — ${b.alternatives.map((a) => esc(a.ticker)).join(", ")}`).join(" · ") +
      `</div>` : "");
  }

  function alloc(rows) {
    const max = Math.max(...rows.map((r) => Math.max(r.pct, r.actual)), 1) * 1.25;
    const inBasket = new Set(D.rec.basket.map((b) => b.theme));
    return `<div><h2 class="sec">Alocacao — actual vs alvo</h2><div class="alloc">` +
      [...rows].sort((a, b) => b.gap - a.gap).map((r) => `
        <div class="alloc-row ${inBasket.has(r.theme) ? "lead" : ""}" title="${esc(r.theme)}: ${r.actual.toFixed(1)}% actual, alvo ${r.pct}%">
          <span class="nm">${esc(r.theme)}</span>
          <span class="track">
            <span class="fill" style="width:${Math.max((r.actual / max) * 100, 0.8)}%"></span>
            <span class="mark" style="left:${(r.pct / max) * 100}%"></span>
          </span>
          <span class="val num">${r.actual.toFixed(0)}% / ${r.pct}%</span>
        </div>`).join("") +
      `</div><div class="alloc-key">
        <span><i style="background:var(--accent)"></i>Peso actual</span>
        <span><i style="background:var(--ink);width:2px"></i>Alvo</span>
      </div></div>`;
  }

  function positions(v, note) {
    const rowsHtml = v.positions.map((p) => {
      const price = p.price === null ? `<span class="dash">—</span>`
        : `${esc(p.priceCurrency === "USD" ? "$" : "")}${p.price}` +
          (p.stale ? ` <span class="stale" title="Preco de ${esc(p.priceAsof)}">${dm(p.priceAsof)}</span>` : "");
      return `<tr data-id="${esc(p.id)}"${p.id === touched && !busy ? " data-flash" : ""}>
        <td class="num">${esc(p.date)}</td>
        <td class="k">${esc(p.ticker)}</td>
        <td>${esc(p.name)}</td>
        <td>${esc(p.theme)}</td>
        <td class="num">${p.units}</td>
        <td class="num">${eur(p.cost_eur)}</td>
        <td class="num">${price}</td>
        <td class="num">${p.value === null ? `<span class="dash">—</span>` : eur(p.value) +
          (p.valueFrom === "manual" ? ` <span class="stale">manual</span>` : "")}</td>
        <td class="num">${p.pl === null ? `<span class="dash">—</span>`
          : `<b class="pl ${dir(p.pl)}">${signed(p.pl, "€")}</b><em class="sub pl ${dir(p.pl)}">${signed(p.plPct, "")}</em>`}</td>
        <td class="rowact">${mode === "readonly" ? "" :
          `<button type="button" class="mini" data-act="edit">Editar</button>
           <button type="button" class="mini" data-act="del">Apagar</button>`}</td>
      </tr>`;
    }).join("");

    const multi = v.holdings.filter((h) => h.lines > 1);
    const avg = multi.length ? `<div><h2 class="sec">Custo medio por nome</h2><div class="tw"><table>
      <thead><tr><th>Ticker</th><th>Compras</th><th>Unidades</th><th>Custo</th><th>Custo medio/un.</th><th>Valor</th><th>P/L</th></tr></thead>
      <tbody>` + multi.map((h) => `<tr>
        <td class="k">${esc(h.ticker)}</td><td class="num">${h.lines}</td>
        <td class="num">${Number(h.units.toFixed(6))}</td><td class="num">${eur(h.cost)}</td>
        <td class="num">${eur(h.avgCost)}</td>
        <td class="num">${h.value === null ? "—" : eur(h.value)}</td>
        <td class="num">${h.pl === null ? "—" : `<b class="pl ${dir(h.pl)}">${signed(h.pl, "€")}</b>`}</td>
      </tr>`).join("") + `</tbody></table></div></div>` : "";

    const table = v.positions.length ? `<div class="tw"><table class="pos">
      <thead><tr><th>Data</th><th>Ticker</th><th>Nome</th><th>Tema</th><th>Un.</th><th>Custo</th>
        <th>Preco</th><th>Valor</th><th>P/L</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>`
      : `<div class="empty">Carteira vazia. Regista a primeira compra aqui em baixo — fica gravada na propria pagina.</div>`;

    return `<div><h2 class="sec">Posicoes</h2>${table}${form(note)}</div>${avg}`;
  }

  function form(note) {
    if (mode === "readonly") {
      return `<p class="lede">Vista so de leitura — as compras registam-se em PORTFOLIO.md.</p>`;
    }
    const e = editing ? state.positions.find((p) => p.id === editing) : null;
    const banner = {
      connecting: `<span class="pill wait">a ligar…</span>`,
      local: `<span class="pill warn">so neste browser</span> as linhas nao chegam ao repo — copia-as para PORTFOLIO.md`,
      live: `<span class="pill ok">grava na pagina</span> a rotina seguinte copia-as para PORTFOLIO.md`,
    }[mode] || "";

    return `<form class="posform" ${busy ? "inert" : ""}>
      <div class="form-head">
        <h3>${e ? "Editar linha" : "Registar compra"}</h3>
        <span class="form-mode">${banner}</span>
      </div>
      <div class="fields">
        <label>Ticker<input name="ticker" list="tickers" required autocomplete="off"
          value="${e ? esc(e.ticker) : ""}" placeholder="LEU"></label>
        <label>Nome<input name="name" value="${e ? esc(e.name) : ""}" placeholder="Centrus Energy"></label>
        <label class="wide">Tema<select name="theme" required>${THEMES.map((t) =>
          `<option${e && e.theme === t ? " selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
        <label>Data<input type="date" name="date" required value="${e ? esc(e.date) : D.built}"></label>
        <label>Unidades<input type="number" name="units" step="any" min="0" required
          value="${e ? e.units : ""}" placeholder="0,53"></label>
        <label>Custo total €<input type="number" name="cost" step="0.01" min="0" required
          value="${e ? e.cost_eur : ""}" placeholder="30,00"></label>
      </div>
      <div class="form-actions">
        <button type="submit" ${mode === "connecting" || busy ? "disabled" : ""}>${
          busy ? `<span class="spin"></span>a gravar…` : (e ? "Guardar" : "Registar compra")}</button>
        ${e ? `<button type="button" class="ghost" data-act="cancel">Cancelar</button>` : ""}
        <span class="form-note" role="status">${esc(note || "")}</span>
      </div>
      <datalist id="tickers">${D.buylist.picks.map((p) =>
        `<option value="${esc(p.ticker)}">${esc(p.name)}</option>`).join("")}</datalist>
    </form>`;
  }

  /* ── eventos ── */
  function wire() {
    const f = host.querySelector(".posform");
    if (f) {
      f.addEventListener("submit", (ev) => {
        ev.preventDefault();
        const d = Object.fromEntries(new FormData(f));
        if (!(Number(d.units) > 0) || !(Number(d.cost) >= 0)) {
          host.querySelector(".form-note").textContent = "Unidades tem de ser maior que zero.";
          return;
        }
        addOrUpdate(d);
      });
      // Escrever o ticker preenche nome e tema a partir da buy-list.
      f.querySelector('input[name="ticker"]').addEventListener("input", (ev) => {
        const p = D.buylist.picks.find((x) => x.ticker.toUpperCase() === ev.target.value.trim().toUpperCase());
        if (!p) return;
        const name = f.querySelector('input[name="name"]');
        if (!name.value) name.value = p.name;
        if (THEMES.includes(p.theme)) f.querySelector('select[name="theme"]').value = p.theme;
      });
      const cancel = f.querySelector('[data-act="cancel"]');
      if (cancel) cancel.addEventListener("click", () => { editing = null; render(); });
    }

    host.querySelectorAll("tr[data-id] .mini").forEach((b) => b.addEventListener("click", () => {
      const id = b.closest("tr").dataset.id;
      if (b.dataset.act === "del") return remove(id);
      editing = id;
      render();
      host.querySelector('.posform input[name="ticker"]')?.focus();
    }));
  }

  // Nota que sobreviveu ao recarregamento depois de um publish bem sucedido.
  let boot = "";
  try {
    boot = sessionStorage.getItem("scanner_form_note") || "";
    sessionStorage.removeItem("scanner_form_note");
  } catch (e) {}
  render(boot);
})();

/* ── Tese ── */
(function () {
  const t = D.thesis;
  const host = document.getElementById("p-tese");
  if (!t.names.length) {
    host.innerHTML = `<div class="empty">Ainda sem tese profunda. Corre a rotina de sabado
      (<strong>prompts/10-tese-profunda.md</strong>) e os nomes da carteira aparecem aqui.</div>`;
    return;
  }

  const slug = (x) => "th-" + x.toLowerCase().replace(/[^a-z0-9]/g, "");
  host.innerHTML = `<p class="lede">${md(t.intro)}</p>
    <nav class="thesis-nav" aria-label="Nomes analisados">` +
      t.names.map((n) => `<a href="#${slug(n.ticker)}"><b>${esc(n.ticker)}</b>${esc(n.name)}</a>`).join("") +
    `</nav>
    <div class="thesis">` + t.names.map((n) => `
      <article id="${slug(n.ticker)}">
        <header class="th-head">
          <div class="th-title">
            <span class="tk">${esc(n.ticker)}</span>
            <h3>${esc(n.name)}</h3>
            ${n.verdictKey ? `<span class="verdict" data-v="${esc(n.verdictKey)}" title="${esc(n.verdict)}">${esc(n.verdictKey)}</span>` : ""}
          </div>
          <div class="th-meta">
            <span>${esc(n.theme)}</span>
            ${n.why ? `<span><span class="k">porque entrou:</span> ${esc(n.why)}</span>` : ""}
            ${n.confidence ? `<span><span class="k">confianca:</span> ${esc(n.confidence)}</span>` : ""}
          </div>
        </header>
        <div class="lens">` +
          n.lenses.map((l) => `<section>
            <h4>${esc(l.title)}</h4>
            <div class="prose">${rich(l.body, /Cenario/i.test(l.title) ? "scen" : "")}</div>
          </section>`).join("") +
          (n.falsifier ? `<p class="falsifier"><b>Falsificador</b><span>${md(n.falsifier)}</span></p>` : "") +
        `</div>
      </article>`).join("") + `</div>`;

  // A jump-nav e a unica navegacao util com cinco textos longos — mas o hash
  // muda de separador se o utilizador voltar mais tarde, por isso e interceptada.
  host.querySelectorAll(".thesis-nav a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById(a.getAttribute("href").slice(1))
      ?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }));
})();


/* ── Noticias ── */
(function () {
  const n = D.news;
  const host = document.getElementById("p-noticias");
  if (!n.items.length) {
    host.innerHTML = `<div class="empty">Ainda sem digest. A rotina diaria escreve
      <strong>NEWS.md</strong> (<strong>prompts/11-news.md</strong>) e aparece aqui.</div>`;
    return;
  }

  // O que toca a carteira vem primeiro; depois o cabaz; depois o resto.
  const order = { carteira: 0, cabaz: 1, vigiar: 2 };
  const items = [...n.items].sort((a, b) => order[a.relevance] - order[b.relevance]);
  const tag = { carteira: "afeta a tua carteira", cabaz: "no cabaz do mes", vigiar: "em vigilancia" };

  host.innerHTML = `<p class="lede">Digest de ${esc(n.date)} — ${esc(n.window)}, sobre
      ${esc(n.scope)}. ${n.items.length} nome${n.items.length === 1 ? "" : "s"} com noticia material.</p>
    <div class="news">` + items.map((i) => `
      <article class="item" data-r="${esc(i.relevance)}"><div class="stripe"></div><div class="in">
        <div class="hd">
          <span class="chip tick">${esc(i.ticker)}</span>
          <span class="co">${esc(i.name)}</span>
          <span class="tag">${tag[i.relevance]}</span>
        </div>
        <p>${md(i.what)}</p>
        <p class="why"><b>Porque importa:</b> ${md(i.why)}</p>
        <p class="why">${md(i.source)}</p>
      </div></article>`).join("") + `</div>` +
    (n.quiet ? `<div class="carry"><b>Sem noticia material:</b> ${md(n.quiet.replace(/^\*\*.*?\*\*\s*/, ""))}</div>` : "") +
    (n.note ? `<div class="carry">${md(n.note)}</div>` : "");
})();

/* ── Buy-list ── */
(function () {
  const b = D.buylist;
  const flag = {};
  b.carry.forEach((c) => (flag[c.ticker] = c));
  let sort = { k: "score", d: -1 };

  const host = document.getElementById("p-buylist");
  host.innerHTML = `<p class="lede">Buy-list de ${esc(b.date)} — ${b.picks.length} nomes no perimetro. A €${D.portfolio.monthly}/mes compras 1-2 por mes: isto e o funil, nao a lista de compras.</p>
    <div><h2 class="sec">Candidatos</h2><div class="tw"><table id="blt">
      <thead><tr>
        <th data-k="score">Score</th><th data-k="ticker">Ticker</th><th data-k="name">Nome</th>
        <th data-k="theme">Tema</th><th data-k="account">Conta</th><th data-k="entry">Entrada</th>
        <th>Catalisador</th><th>Flag</th>
      </tr></thead><tbody></tbody>
    </table></div></div>
    ${b.carry.length ? `<div><h2 class="sec">Alertas de carry</h2><div class="tw"><table><thead><tr><th>Ticker</th><th>Flag</th><th>Nota</th></tr></thead><tbody>` +
      b.carry.map((c) => `<tr><td class="k">${esc(c.ticker)}</td><td><span class="chip ${/INVALIDADO/i.test(c.flag) ? "high" : "warn"}">${esc(c.flag.replace(/[⚠️]/g, "").trim())}</span></td><td class="w">${esc(c.note)}</td></tr>`).join("") +
      `</tbody></table></div></div>` : ""}
    ${b.excluded.length ? `<div><h2 class="sec">Fora do perimetro</h2><div class="tw"><table><thead><tr><th>Ticker</th><th>Nome</th><th>Motivo</th></tr></thead><tbody>` +
      b.excluded.map((x) => `<tr><td class="k">${esc(x.ticker)}</td><td>${esc(x.name)}</td><td class="w">${esc(x.reason)}</td></tr>`).join("") +
      `</tbody></table></div></div>` : ""}`;

  const tbody = host.querySelector("#blt tbody");
  function draw() {
    const rows = [...b.picks].sort((x, y) => {
      const a = x[sort.k], c = y[sort.k];
      if (typeof a === "number") return (a - c) * sort.d;
      return String(a).localeCompare(String(c)) * sort.d;
    });
    tbody.innerHTML = rows.map((p) => {
      const f = flag[p.ticker];
      return `<tr>
        <td><span class="sc num" data-s="${p.score}">${p.score}</span></td>
        <td class="k">${esc(p.ticker)}</td><td>${esc(p.name)}</td><td>${esc(p.theme)}</td>
        <td><span class="chip" data-acct="${esc(p.account)}">${esc(p.account)}</span></td><td class="num">${esc(p.entry)}</td>
        <td class="w">${esc(p.catalyst)} ${deadlinePill(p.deadline)}</td>
        <td>${f ? `<span class="chip ${/INVALIDADO/i.test(f.flag) ? "high" : "warn"}" title="${esc(f.note)}">${esc(f.flag.replace(/[⚠️]/g, "").trim())}</span>` : ""}</td>
      </tr>`;
    }).join("");
    host.querySelectorAll("#blt th[data-k]").forEach((th) => {
      th.innerHTML = th.innerHTML.replace(/\s*<span class="ar">.*?<\/span>/, "") +
        (th.dataset.k === sort.k ? `<span class="ar">${sort.d === 1 ? " ▲" : " ▼"}</span>` : "");
    });
  }
  host.querySelectorAll("#blt th[data-k]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.k;
    sort = { k, d: sort.k === k ? -sort.d : k === "score" ? -1 : 1 };
    draw();
  }));
  draw();
})();

/* ── Semana ── */
(function () {
  const w = D.weekly;
  document.getElementById("p-semana").innerHTML = w.blocks.length
    ? `<p class="lede">Sintese semanal de ${esc(w.date)}.</p><div class="wk">` +
      w.blocks.map((s) => `<article><h3>${esc(s.title)}</h3><div class="body">${md(s.body)}</div></article>`).join("") + `</div>`
    : `<div class="empty">Ainda sem sintese semanal.</div>`;
})();

show(localStorage.getItem("scanner_tab") || "hoje");
</script>
