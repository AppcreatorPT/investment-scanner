tateEl = document.getElementById(\"portfolio-state\");\n  const THEMES = D.portfolio.targets.map((t) => t.theme);\n\n  /* Estado vivo da carteira. A fonte e o bloco #portfolio-state — nunca o DOM. */\n  function readState() {\n    try {\n      const s = JSON.parse(stateEl.textContent);\n      if (s && s.schema === 1 && Array.isArray(s.positions)) return s;\n    } catch (e) { /* bloco partido: melhor carteira vazia que lixo */ }\n    return { schema: 1, updated: \"\", positions: [] };\n  }\n\n  let state = readState();\n  let artifact = null;\n  let mode = \"connecting\";   // connecting · live · local · readonly\n  let editing = null;\n  let busy = false;\n\n  /* ── modo local: so este browser, nunca chega ao repo ── */\n  const LOCAL_KEY = \"scanner_positions\";\n  function loadLocal() {\n    try {\n      const raw = localStorage.getItem(LOCAL_KEY);\n      if (!raw) return null;\n      const saved = JSON.parse(raw);\n      // Se a pagina foi republicada depois deste rascunho, a pagina ganha:\n      // o repo e a carteira a serio, isto era so uma conveniencia.\n      if (saved.basedOn !== state.updated) { localStorage.removeItem(LOCAL_KEY); return null; }\n      return Array.isArray(saved.positions) ? saved.positions : null;\n    } catch (e) { return null; }\n  }\n  function saveLocal() {\n    try {\n      localStorage.setItem(LOCAL_KEY, JSON.stringify({ basedOn: state.updated, positions: state.positions }));\n    } catch (e) { /* browser sem storage: fica so em memoria */ }\n  }\n\n  /* ── republicar: espelho exacto de fill() em scripts/page-source.ts ──\n     A ordem importa. O state primeiro, porque a fonte reinserida contem ela propria\n     um %%PORTFOLIO_STATE%% que nao deve ser tocado. */\n  const stateJson = (s) => JSON.stringify(s).replace(/\u003c/g, \"\\\\u003c\");\n  function fullDocument(json) {\n    const tpl = JSON.parse(document.getElementById(\"page-source\").textContent);\n    return tpl\n      .replace(\"%%PORTFOLIO_STATE%%\", () => json)\n      .replace(\"%%PAGE_SOURCE%%\", () => JSON.stringify(tpl).replace(/\u003c/g, \"\\\\u003c\"));\n  }\n\n  const uuid = () => (crypto.randomUUID ? crypto.randomUUID()\n    : \"pos-\" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36));\n\n  /* ── ligacao a capability ── */\n  const use = (window.claude && typeof window.claude.use === \"function\")\n    ? window.claude.use(\"artifact\").catch(() => null)\n    : Promise.resolve(null);\n\n  use.then((a) => {\n    artifact = a;\n    if (a) { setMode(\"live\"); return; }\n    const local = loadLocal();\n    if (local) state = { ...state, positions: local };\n    setMode(\"local\");\n  });\n\n  function setMode(next) { mode = next; render(); }\n\n  /* ── gravar ── */\n  async function commit(positions, note) {\n    const before = state;\n    state = { schema: 1, updated: new Date().toISOString(), positions };\n    editing = null;\n\n    if (mode !== \"live\") { saveLocal(); render(note || \"guardado neste browser\"); return; }\n\n    busy = true;\n    render(\"a gravar…\");\n    try {\n      // A vista recarrega depois de publicar; o rascunho do formulario sobrevive aqui.\n      try { sessionStorage.setItem(\"scanner_form_note\", note || \"\"); } catch (e) {}\n      await publishWithRetry(fullDocument(stateJson(state)));\n      // Normalmente a vista recarrega aqui. Se por alguma razao nao recarregar,\n      // o formulario tem de voltar a funcionar em vez de ficar preso em \"a gravar\".\n      busy = false;\n      render(\"gravado\");\n    } catch (err) {\n      busy = false;\n      state = before;      // desfaz o optimismo: o que nao gravou nao aconteceu\n      handleError(err);\n    }\n  }\n\n  async function publishWithRetry(html) {\n    try {\n      return await artifact.publish(html);\n    } catch (err) {\n      // So o erro transitorio se repete, uma vez, com espera aleatoria.\n      if (err && err.code === \"upstream_error\") {\n        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));\n        return await artifact.publish(html);\n      }\n      throw err;\n    }\n  }\n\n  function handleError(err) {\n    const code = (err && err.code) || \"upstream_error\";\n    if (code === \"conflict\") {\n      render(\"Alguem gravou primeiro — a pagina vai recarregar com a versao mais recente.\");\n      return;\n    }\n    if ([\"not_writer\", \"not_granted\", \"not_declared\", \"consent_required\",\n         \"capability_disabled\", \"capability_removed\"].includes(code)) {\n      artifact = null;\n      setMode(\"local\");\n      render(\"Esta vista nao pode gravar na pagina. As linhas ficam so neste browser.\");\n      return;\n    }\n    const msg = {\n      too_large: \"A pagina ficou grande demais para gravar. Regista esta compra em PORTFOLIO.md.\",\n      rate_limited: \"Gravacoes a mais seguidas — espera um minuto e tenta outra vez.\",\n      invalid_content: \"A pagina nao ficou num formato gravavel. Regista em PORTFOLIO.md e reconstroi.\",\n      transform_error: \"A pagina nao ficou num formato gravavel. Regista em PORTFOLIO.md e reconstroi.\",\n    }[code] || \"Nao foi possivel gravar. Tenta outra vez daqui a pouco.\";\n    render(msg);\n  }\n\n  /* ── acoes ── */\n  function addOrUpdate(f) {\n    const p = {\n      id: editing || uuid(),\n      date: f.date, ticker: f.ticker.trim().toUpperCase(), name: f.name.trim(),\n      theme: f.theme, units: Number(f.units), cost_eur: Number(f.cost), value_eur: null,\n    };\n    const next = editing\n      ? state.positions.map((x) => (x.id === editing ? { ...x, ...p } : x))\n      : [...state.positions, p];\n    commit(next, editing ? \"linha actualizada\" : \"compra registada\");\n  }\n\n  function remove(id) {\n    const p = state.positions.find((x) => x.id === id);\n    if (!p) return;\n    if (!confirm(`Apagar ${p.ticker} — ${p.units} unidades por €${p.cost_eur.toFixed(2)}?`)) return;\n    commit(state.positions.filter((x) => x.id !== id), \"linha apagada\");\n  }\n\n  /* ── render ── */\n  function render(note) {\n    const v = valuePositions(state.positions, D.book, D.built);\n    const { rows } = themeRows(v.positions, D.portfolio.targets);\n    const parts = [];\n\n    if (state.positions.length) parts.push(statRow(v.totals));\n    parts.push(basket());\n    parts.push(alloc(rows));\n    parts.push(positions(v, note));\n    host.innerHTML = parts.join(\"\");\n    wire();\n  }\n\n  const eur = (n) => \"€\" + n.toFixed(2);\n  const signed = (n, unit) => (n >= 0 ? \"+\" : \"−\") + unit + Math.abs(n).toFixed(unit === \"€\" ? 2 : 1) + (unit === \"€\" ? \"\" : \"%\");\n  const dir = (n) => (n > 0 ? \"up\" : n \u003c 0 ? \"down\" : \"flat\");\n  const dm = (iso) => (iso || \"\").split(\"-\").reverse().slice(0, 2).join(\"-\");\n\n  /* Resumo antes do detalhe. Nao e um grafico — sao quatro numeros que se leem de relance. */\n  function statRow(t) {\n    const tiles = [\n      `\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Investido\u003c/span>\u003cb class=\"num\">${eur(t.invested)}\u003c/b>\n        \u003cem>${state.positions.length} linha${state.positions.length === 1 ? \"\" : \"s\"}\u003c/em>\u003c/div>`,\n      `\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">Valor actual\u003c/span>\n        \u003cb class=\"num\">${t.value === null ? \"—\" : eur(t.value)}\u003c/b>\n        \u003cem>${t.unpriced\n          ? `so ${t.priced} de ${state.positions.length} linhas — as outras sem preco`\n          : (D.book.asof ? `preco de ${dm(D.book.asof)}` : \"sem precos\")}\u003c/em>\u003c/div>`,\n    ];\n\n    tiles.push(t.pl === null\n      ? `\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">P/L\u003c/span>\u003cb class=\"num\">—\u003c/b>\n          \u003cem>falta preco em ${t.unpriced} linha${t.unpriced === 1 ? \"\" : \"s\"}\u003c/em>\u003c/div>`\n      : `\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">P/L\u003c/span>\n          \u003cb class=\"num pl ${dir(t.pl)}\">${signed(t.pl, \"€\")}\u003c/b>\n          \u003cem class=\"pl ${dir(t.pl)}\">${signed(t.plPct, \"\")}\u003c/em>\u003c/div>`);\n\n    const b = t.bench;\n    if (b && b.plPct !== null && t.plPct !== null) {\n      const d = t.plPct - b.plPct;\n      tiles.push(`\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">vs ${esc(b.ticker)}\u003c/span>\n        \u003cb class=\"num pl ${dir(d)}\">${d >= 0 ? \"+\" : \"−\"}${Math.abs(d).toFixed(1)} pp\u003c/b>\n        \u003cem>${esc(b.ticker)} ${signed(b.plPct, \"\")} no mesmo periodo${b.uncovered ? ` · ${b.uncovered} linha(s) sem historico` : \"\"}\u003c/em>\u003c/div>`);\n    } else if (b && b.plPct !== null) {\n      // O benchmark sabe-se; o que falta e o nosso P/L. Mostrar o que se sabe e\n      // dizer o que impede a comparacao — nao um travessao sem explicacao.\n      tiles.push(`\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">${esc(b.ticker)} no mesmo periodo\u003c/span>\n        \u003cb class=\"num pl ${dir(b.plPct)}\">${signed(b.plPct, \"\")}\u003c/b>\n        \u003cem>comparacao completa quando todas as linhas tiverem preco\u003c/em>\u003c/div>`);\n    } else if (b) {\n      tiles.push(`\u003cdiv class=\"stat\">\u003cspan class=\"lbl\">vs ${esc(b.ticker)}\u003c/span>\u003cb class=\"num\">—\u003c/b>\n        \u003cem>sem historico do benchmark para ${b.uncovered} destas datas\u003c/em>\u003c/div>`);\n    }\n\n    return `\u003cdiv class=\"stats\">${tiles.join(\"\")}\u003c/div>` +\n      (t.anyStale ? `\u003cp class=\"lede\">Ha precos com mais de ${D.staleAfterDays} dias — marcados na tabela.\u003c/p>` : \"\");\n  }\n\n  function basket() {\n    const rec = D.rec;\n    if (!rec.basket.length) {\n      return `\u003cdiv class=\"hero hero-empty\">\u003cp class=\"eyebrow\">O cabaz deste mes\u003c/p>\n        \u003cp class=\"why\">Nenhum candidato passou o filtro — todos os nomes dos temas mais descobertos\n        estao travados por flag, lockup, praca por confirmar ou marcados como indisponiveis.\u003c/p>\u003c/div>`;\n    }\n    const spent = rec.basket.reduce((s, b) => s + b.amount, 0);\n    const alts = rec.basket.filter((b) => b.alternatives.length);\n    return `\u003cdiv class=\"hero\">\n      \u003cdiv class=\"hero-head\">\u003cp class=\"eyebrow\">O cabaz deste mes\u003c/p>\u003cspan class=\"amt num\">€${spent}\u003c/span>\u003c/div>\n      \u003col class=\"basket\">` + rec.basket.map((b) => `\n        \u003cli>\n          \u003cspan class=\"line-amt num\">€${b.amount}\u003c/span>\n          \u003cspan class=\"line-id\">\u003cstrong>${esc(b.pick.ticker)}\u003c/strong>\u003cspan class=\"co\">${esc(b.pick.name)}\u003c/span>\u003c/span>\n          \u003cspan class=\"line-th\">${esc(b.theme)}\u003cem>${pct(b.gap)} vs alvo\u003c/em>\u003c/span>\n          \u003cspan class=\"line-cat\">${esc(b.pick.catalyst)}\u003c/span>\n        \u003c/li>`).join(\"\") + `\u003c/ol>\n      \u003cp class=\"why\">Reparticao proporcional ao desvio face ao alvo, calculada em ${esc(D.built)}.\n        Executa como \u003cstrong>planos programados\u003c/strong> — €0 de comissao. Em ordens avulsas sao\n        €${rec.basket.length} de settlement, ${((rec.basket.length / spent) * 100).toFixed(0)}% do aporte.\u003c/p>\n    \u003c/div>` + (alts.length ? `\u003cdiv class=\"carry\">\u003cb>Alternativas por tema:\u003c/b> ` +\n      alts.map((b) => `${esc(b.theme)} — ${b.alternatives.map((a) => esc(a.ticker)).join(\", \")}`).join(\" · \") +\n      `\u003c/div>` : \"\");\n  }\n\n  function alloc(rows) {\n    const max = Math.max(...rows.map((r) => Math.max(r.pct, r.actual)), 1) * 1.25;\n    const inBasket = new Set(D.rec.basket.map((b) => b.theme));\n    return `\u003cdiv>\u003ch2 class=\"sec\">Alocacao — actual vs alvo\u003c/h2>\u003cdiv class=\"alloc\">` +\n      [...rows].sort((a, b) => b.gap - a.gap).map((r) => `\n        \u003cdiv class=\"alloc-row ${inBasket.has(r.theme) ? \"lead\" : \"\"}\" title=\"${esc(r.theme)}: ${r.actual.toFixed(1)}% actual, alvo ${r.pct}%\">\n          \u003cspan class=\"nm\">${esc(r.theme)}\u003c/span>\n          \u003cspan class=\"track\">\n            \u003cspan class=\"fill\" style=\"width:${Math.max((r.actual / max) * 100, 0.8)}%\">\u003c/span>\n            \u003cspan class=\"mark\" style=\"left:${(r.pct / max) * 100}%\">\u003c/span>\n          \u003c/span>\n          \u003cspan class=\"val num\">${r.actual.toFixed(0)}% / ${r.pct}%\u003c/span>\n        \u003c/div>`).join(\"\") +\n      `\u003c/div>\u003cdiv class=\"alloc-key\">\n        \u003cspan>\u003ci style=\"background:var(--accent)\">\u003c/i>Peso actual\u003c/span>\n        \u003cspan>\u003ci style=\"background:var(--ink);width:2px\">\u003c/i>Alvo\u003c/span>\n      \u003c/div>\u003c/div>`;\n  }\n\n  function positions(v, note) {\n    const rowsHtml = v.positions.map((p) => {\n      const price = p.price === null ? `\u003cspan class=\"dash\">—\u003c/span>`\n        : `${esc(p.priceCurrency === \"USD\" ? \"$\" : \"\")}${p.price}` +\n          (p.stale ? ` \u003cspan class=\"stale\" title=\"Preco de ${esc(p.priceAsof)}\">${dm(p.priceAsof)}\u003c/span>` : \"\");\n      return `\u003ctr data-id=\"${esc(p.id)}\">\n        \u003ctd class=\"num\">${esc(p.date)}\u003c/td>\n        \u003ctd class=\"k\">${esc(p.ticker)}\u003c/td>\n        \u003ctd>${esc(p.name)}\u003c/td>\n        \u003ctd>${esc(p.theme)}\u003c/td>\n        \u003ctd class=\"num\">${p.units}\u003c/td>\n        \u003ctd class=\"num\">${eur(p.cost_eur)}\u003c/td>\n        \u003ctd class=\"num\">${price}\u003c/td>\n        \u003ctd class=\"num\">${p.value === null ? `\u003cspan class=\"dash\">—\u003c/span>` : eur(p.value) +\n          (p.valueFrom === \"manual\" ? ` \u003cspan class=\"stale\">manual\u003c/span>` : \"\")}\u003c/td>\n        \u003ctd class=\"num\">${p.pl === null ? `\u003cspan class=\"dash\">—\u003c/span>`\n          : `\u003cb class=\"pl ${dir(p.pl)}\">${signed(p.pl, \"€\")}\u003c/b>\u003cem class=\"sub pl ${dir(p.pl)}\">${signed(p.plPct, \"\")}\u003c/em>`}\u003c/td>\n        \u003ctd class=\"rowact\">${mode === \"readonly\" ? \"\" :\n          `\u003cbutton type=\"button\" class=\"mini\" data-act=\"edit\">Editar\u003c/button>\n           \u003cbutton type=\"button\" class=\"mini\" data-act=\"del\">Apagar\u003c/button>`}\u003c/td>\n      \u003c/tr>`;\n    }).join(\"\");\n\n    const multi = v.holdings.filter((h) => h.lines > 1);\n    const avg = multi.length ? `\u003cdiv>\u003ch2 class=\"sec\">Custo medio por nome\u003c/h2>\u003cdiv class=\"tw\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth>Ticker\u003c/th>\u003cth>Compras\u003c/th>\u003cth>Unidades\u003c/th>\u003cth>Custo\u003c/th>\u003cth>Custo medio/un.\u003c/th>\u003cth>Valor\u003c/th>\u003cth>P/L\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>` + multi.map((h) => `\u003ctr>\n        \u003ctd class=\"k\">${esc(h.ticker)}\u003c/td>\u003ctd class=\"num\">${h.lines}\u003c/td>\n        \u003ctd class=\"num\">${Number(h.units.toFixed(6))}\u003c/td>\u003ctd class=\"num\">${eur(h.cost)}\u003c/td>\n        \u003ctd class=\"num\">${eur(h.avgCost)}\u003c/td>\n        \u003ctd class=\"num\">${h.value === null ? \"—\" : eur(h.value)}\u003c/td>\n        \u003ctd class=\"num\">${h.pl === null ? \"—\" : `\u003cb class=\"pl ${dir(h.pl)}\">${signed(h.pl, \"€\")}\u003c/b>`}\u003c/td>\n      \u003c/tr>`).join(\"\") + `\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>` : \"\";\n\n    const table = v.positions.length ? `\u003cdiv class=\"tw\">\u003ctable class=\"pos\">\n      \u003cthead>\u003ctr>\u003cth>Data\u003c/th>\u003cth>Ticker\u003c/th>\u003cth>Nome\u003c/th>\u003cth>Tema\u003c/th>\u003cth>Un.\u003c/th>\u003cth>Custo\u003c/th>\n        \u003cth>Preco\u003c/th>\u003cth>Valor\u003c/th>\u003cth>P/L\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>${rowsHtml}\u003c/tbody>\u003c/table>\u003c/div>`\n      : `\u003cdiv class=\"empty\">Carteira vazia. Regista a primeira compra aqui em baixo — fica gravada na propria pagina.\u003c/div>`;\n\n    return `\u003cdiv>\u003ch2 class=\"sec\">Posicoes\u003c/h2>${table}${form(note)}\u003c/div>${avg}`;\n  }\n\n  function form(note) {\n    if (mode === \"readonly\") {\n      return `\u003cp class=\"lede\">Vista so de leitura — as compras registam-se em PORTFOLIO.md.\u003c/p>`;\n    }\n    const e = editing ? state.positions.find((p) => p.id === editing) : null;\n    const banner = {\n      connecting: `\u003cspan class=\"pill wait\">a ligar…\u003c/span>`,\n      local: `\u003cspan class=\"pill warn\">so neste browser\u003c/span> as linhas nao chegam ao repo — copia-as para PORTFOLIO.md`,\n      live: `\u003cspan class=\"pill ok\">grava na pagina\u003c/span> a rotina seguinte copia-as para PORTFOLIO.md`,\n    }[mode] || \"\";\n\n    return `\u003cform class=\"posform\" ${busy ? \"inert\" : \"\"}>\n      \u003cdiv class=\"form-head\">\n        \u003ch3>${e ? \"Editar linha\" : \"Registar compra\"}\u003c/h3>\n        \u003cspan class=\"form-mode\">${banner}\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"fields\">\n        \u003clabel>Ticker\u003cinput name=\"ticker\" list=\"tickers\" required autocomplete=\"off\"\n          value=\"${e ? esc(e.ticker) : \"\"}\" placeholder=\"LEU\">\u003c/label>\n        \u003clabel>Nome\u003cinput name=\"name\" value=\"${e ? esc(e.name) : \"\"}\" placeholder=\"Centrus Energy\">\u003c/label>\n        \u003clabel class=\"wide\">Tema\u003cselect name=\"theme\" required>${THEMES.map((t) =>\n          `\u003coption${e && e.theme === t ? \" selected\" : \"\"}>${esc(t)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n        \u003clabel>Data\u003cinput type=\"date\" name=\"date\" required value=\"${e ? esc(e.date) : D.built}\">\u003c/label>\n        \u003clabel>Unidades\u003cinput type=\"number\" name=\"units\" step=\"any\" min=\"0\" required\n          value=\"${e ? e.units : \"\"}\" placeholder=\"0,53\">\u003c/label>\n        \u003clabel>Custo total €\u003cinput type=\"number\" name=\"cost\" step=\"0.01\" min=\"0\" required\n          value=\"${e ? e.cost_eur : \"\"}\" placeholder=\"30,00\">\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"form-actions\">\n        \u003cbutton type=\"submit\" ${mode === \"connecting\" ? \"disabled\" : \"\"}>${e ? \"Guardar\" : \"Registar compra\"}\u003c/button>\n        ${e ? `\u003cbutton type=\"button\" class=\"ghost\" data-act=\"cancel\">Cancelar\u003c/button>` : \"\"}\n        \u003cspan class=\"form-note\" role=\"status\">${esc(note || \"\")}\u003c/span>\n      \u003c/div>\n      \u003cdatalist id=\"tickers\">${D.buylist.picks.map((p) =>\n        `\u003coption value=\"${esc(p.ticker)}\">${esc(p.name)}\u003c/option>`).join(\"\")}\u003c/datalist>\n    \u003c/form>`;\n  }\n\n  /* ── eventos ── */\n  function wire() {\n    const f = host.querySelector(\".posform\");\n    if (f) {\n      f.addEventListener(\"submit\", (ev) => {\n        ev.preventDefault();\n        const d = Object.fromEntries(new FormData(f));\n        if (!(Number(d.units) > 0) || !(Number(d.cost) >= 0)) {\n          host.querySelector(\".form-note\").textContent = \"Unidades tem de ser maior que zero.\";\n          return;\n        }\n        addOrUpdate(d);\n      });\n      // Escrever o ticker preenche nome e tema a partir da buy-list.\n      f.querySelector('input[name=\"ticker\"]').addEventListener(\"input\", (ev) => {\n        const p = D.buylist.picks.find((x) => x.ticker.toUpperCase() === ev.target.value.trim().toUpperCase());\n        if (!p) return;\n        const name = f.querySelector('input[name=\"name\"]');\n        if (!name.value) name.value = p.name;\n        if (THEMES.includes(p.theme)) f.querySelector('select[name=\"theme\"]').value = p.theme;\n      });\n      const cancel = f.querySelector('[data-act=\"cancel\"]');\n      if (cancel) cancel.addEventListener(\"click\", () => { editing = null; render(); });\n    }\n\n    host.querySelectorAll(\"tr[data-id] .mini\").forEach((b) => b.addEventListener(\"click\", () => {\n      const id = b.closest(\"tr\").dataset.id;\n      if (b.dataset.act === \"del\") return remove(id);\n      editing = id;\n      render();\n      host.querySelector('.posform input[name=\"ticker\"]')?.focus();\n    }));\n  }\n\n  // Nota que sobreviveu ao recarregamento depois de um publish bem sucedido.\n  let boot = \"\";\n  try {\n    boot = sessionStorage.getItem(\"scanner_form_note\") || \"\";\n    sessionStorage.removeItem(\"scanner_form_note\");\n  } catch (e) {}\n  render(boot);\n})();\n\n/* ── Tese ── */\n(function () {\n  const t = D.thesis;\n  const host = document.getElementById(\"p-tese\");\n  if (!t.names.length) {\n    host.innerHTML = `\u003cdiv class=\"empty\">Ainda sem tese profunda. Corre a rotina de sabado\n      (\u003cstrong>prompts/10-tese-profunda.md\u003c/strong>) e os nomes da carteira aparecem aqui.\u003c/div>`;\n    return;\n  }\n\n  const slug = (x) => \"th-\" + x.toLowerCase().replace(/[^a-z0-9]/g, \"\");\n  host.innerHTML = `\u003cp class=\"lede\">${esc(t.intro)}\u003c/p>\n    \u003cnav class=\"thesis-nav\" aria-label=\"Nomes analisados\">` +\n      t.names.map((n) => `\u003ca href=\"#${slug(n.ticker)}\">\u003cb>${esc(n.ticker)}\u003c/b>${esc(n.name)}\u003c/a>`).join(\"\") +\n    `\u003c/nav>\n    \u003cdiv class=\"thesis\">` + t.names.map((n) => `\n      \u003carticle id=\"${slug(n.ticker)}\">\n        \u003cheader class=\"th-head\">\n          \u003cdiv class=\"th-title\">\n            \u003cspan class=\"tk\">${esc(n.ticker)}\u003c/span>\n            \u003ch3>${esc(n.name)}\u003c/h3>\n            ${n.verdictKey ? `\u003cspan class=\"verdict\" data-v=\"${esc(n.verdictKey)}\" title=\"${esc(n.verdict)}\">${esc(n.verdictKey)}\u003c/span>` : \"\"}\n          \u003c/div>\n          \u003cdiv class=\"th-meta\">\n            \u003cspan>${esc(n.theme)}\u003c/span>\n            ${n.why ? `\u003cspan>\u003cspan class=\"k\">porque entrou:\u003c/span> ${esc(n.why)}\u003c/span>` : \"\"}\n            ${n.confidence ? `\u003cspan>\u003cspan class=\"k\">confianca:\u003c/span> ${esc(n.confidence)}\u003c/span>` : \"\"}\n          \u003c/div>\n        \u003c/header>\n        \u003cdiv class=\"lens\">` +\n          n.lenses.map((l) => `\u003csection>\n            \u003ch4>${esc(l.title)}\u003c/h4>\n            \u003cdiv class=\"prose\">${rich(l.body, /Cenario/i.test(l.title) ? \"scen\" : \"\")}\u003c/div>\n          \u003c/section>`).join(\"\") +\n          (n.falsifier ? `\u003cp class=\"falsifier\">\u003cb>Falsificador\u003c/b>\u003cspan>${md(n.falsifier)}\u003c/span>\u003c/p>` : \"\") +\n        `\u003c/div>\n      \u003c/article>`).join(\"\") + `\u003c/div>`;\n\n  // A jump-nav e a unica navegacao util com cinco textos longos — mas o hash\n  // muda de separador se o utilizador voltar mais tarde, por isso e interceptada.\n  host.querySelectorAll(\".thesis-nav a\").forEach((a) => a.addEventListener(\"click\", (e) => {\n    e.preventDefault();\n    document.getElementById(a.getAttribute(\"href\").slice(1))\n      ?.scrollIntoView({ behavior: matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? \"auto\" : \"smooth\", block: \"start\" });\n  }));\n})();\n\n\n/* ── Noticias ── */\n(function () {\n  const n = D.news;\n  const host = document.getElementById(\"p-noticias\");\n  if (!n.items.length) {\n    host.innerHTML = `\u003cdiv class=\"empty\">Ainda sem digest. A rotina diaria escreve\n      \u003cstrong>NEWS.md\u003c/strong> (\u003cstrong>prompts/11-news.md\u003c/strong>) e aparece aqui.\u003c/div>`;\n    return;\n  }\n\n  // O que toca a carteira vem primeiro; depois o cabaz; depois o resto.\n  const order = { carteira: 0, cabaz: 1, vigiar: 2 };\n  const items = [...n.items].sort((a, b) => order[a.relevance] - order[b.relevance]);\n  const tag = { carteira: \"afeta a tua carteira\", cabaz: \"no cabaz do mes\", vigiar: \"em vigilancia\" };\n\n  host.innerHTML = `\u003cp class=\"lede\">Digest de ${esc(n.date)} — ${esc(n.window)}, sobre\n      ${esc(n.scope)}. ${n.items.length} nome${n.items.length === 1 ? \"\" : \"s\"} com noticia material.\u003c/p>\n    \u003cdiv class=\"news\">` + items.map((i) => `\n      \u003carticle class=\"item\" data-r=\"${esc(i.relevance)}\">\u003cdiv class=\"stripe\">\u003c/div>\u003cdiv class=\"in\">\n        \u003cdiv class=\"hd\">\n          \u003cspan class=\"chip tick\">${esc(i.ticker)}\u003c/span>\n          \u003cspan class=\"co\">${esc(i.name)}\u003c/span>\n          \u003cspan class=\"tag\">${tag[i.relevance]}\u003c/span>\n        \u003c/div>\n        \u003cp>${md(i.what)}\u003c/p>\n        \u003cp class=\"why\">\u003cb>Porque importa:\u003c/b> ${md(i.why)}\u003c/p>\n        \u003cp class=\"why\">${md(i.source)}\u003c/p>\n      \u003c/div>\u003c/article>`).join(\"\") + `\u003c/div>` +\n    (n.quiet ? `\u003cdiv class=\"carry\">\u003cb>Sem noticia material:\u003c/b> ${md(n.quiet.replace(/^\\*\\*.*?\\*\\*\\s*/, \"\"))}\u003c/div>` : \"\") +\n    (n.note ? `\u003cdiv class=\"carry\">${md(n.note)}\u003c/div>` : \"\");\n})();\n\n/* ── Buy-list ── */\n(function () {\n  const b = D.buylist;\n  const flag = {};\n  b.carry.forEach((c) => (flag[c.ticker] = c));\n  let sort = { k: \"score\", d: -1 };\n\n  const host = document.getElementById(\"p-buylist\");\n  host.innerHTML = `\u003cp class=\"lede\">Buy-list de ${esc(b.date)} — ${b.picks.length} nomes no perimetro. A €${D.portfolio.monthly}/mes compras 1-2 por mes: isto e o funil, nao a lista de compras.\u003c/p>\n    \u003cdiv>\u003ch2 class=\"sec\">Candidatos\u003c/h2>\u003cdiv class=\"tw\">\u003ctable id=\"blt\">\n      \u003cthead>\u003ctr>\n        \u003cth data-k=\"score\">Score\u003c/th>\u003cth data-k=\"ticker\">Ticker\u003c/th>\u003cth data-k=\"name\">Nome\u003c/th>\n        \u003cth data-k=\"theme\">Tema\u003c/th>\u003cth data-k=\"account\">Conta\u003c/th>\u003cth data-k=\"entry\">Entrada\u003c/th>\n        \u003cth>Catalisador\u003c/th>\u003cth>Flag\u003c/th>\n      \u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>\n    \u003c/table>\u003c/div>\u003c/div>\n    ${b.carry.length ? `\u003cdiv>\u003ch2 class=\"sec\">Alertas de carry\u003c/h2>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ticker\u003c/th>\u003cth>Flag\u003c/th>\u003cth>Nota\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>` +\n      b.carry.map((c) => `\u003ctr>\u003ctd class=\"k\">${esc(c.ticker)}\u003c/td>\u003ctd>\u003cspan class=\"chip ${/INVALIDADO/i.test(c.flag) ? \"high\" : \"warn\"}\">${esc(c.flag.replace(/[⚠️]/g, \"\").trim())}\u003c/span>\u003c/td>\u003ctd class=\"w\">${esc(c.note)}\u003c/td>\u003c/tr>`).join(\"\") +\n      `\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>` : \"\"}\n    ${b.excluded.length ? `\u003cdiv>\u003ch2 class=\"sec\">Fora do perimetro\u003c/h2>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Ticker\u003c/th>\u003cth>Nome\u003c/th>\u003cth>Motivo\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>` +\n      b.excluded.map((x) => `\u003ctr>\u003ctd class=\"k\">${esc(x.ticker)}\u003c/td>\u003ctd>${esc(x.name)}\u003c/td>\u003ctd class=\"w\">${esc(x.reason)}\u003c/td>\u003c/tr>`).join(\"\") +\n      `\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>` : \"\"}`;\n\n  const tbody = host.querySelector(\"#blt tbody\");\n  function draw() {\n    const rows = [...b.picks].sort((x, y) => {\n      const a = x[sort.k], c = y[sort.k];\n      if (typeof a === \"number\") return (a - c) * sort.d;\n      return String(a).localeCompare(String(c)) * sort.d;\n    });\n    tbody.innerHTML = rows.map((p) => {\n      const f = flag[p.ticker];\n      return `\u003ctr>\n        \u003ctd>\u003cspan class=\"sc num\" data-s=\"${p.score}\">${p.score}\u003c/span>\u003c/td>\n        \u003ctd class=\"k\">${esc(p.ticker)}\u003c/td>\u003ctd>${esc(p.name)}\u003c/td>\u003ctd>${esc(p.theme)}\u003c/td>\n        \u003ctd>\u003cspan class=\"chip\" data-acct=\"${esc(p.account)}\">${esc(p.account)}\u003c/span>\u003c/td>\u003ctd class=\"num\">${esc(p.entry)}\u003c/td>\n        \u003ctd class=\"w\">${esc(p.catalyst)} ${deadlinePill(p.deadline)}\u003c/td>\n        \u003ctd>${f ? `\u003cspan class=\"chip ${/INVALIDADO/i.test(f.flag) ? \"high\" : \"warn\"}\" title=\"${esc(f.note)}\">${esc(f.flag.replace(/[⚠️]/g, \"\").trim())}\u003c/span>` : \"\"}\u003c/td>\n      \u003c/tr>`;\n    }).join(\"\");\n    host.querySelectorAll(\"#blt th[data-k]\").forEach((th) => {\n      th.innerHTML = th.innerHTML.replace(/\\s*\u003cspan class=\"ar\">.*?\u003c\\/span>/, \"\") +\n        (th.dataset.k === sort.k ? `\u003cspan class=\"ar\">${sort.d === 1 ? \" ▲\" : \" ▼\"}\u003c/span>` : \"\");\n    });\n  }\n  host.querySelectorAll(\"#blt th[data-k]\").forEach((th) => th.addEventListener(\"click\", () => {\n    const k = th.dataset.k;\n    sort = { k, d: sort.k === k ? -sort.d : k === \"score\" ? -1 : 1 };\n    draw();\n  }));\n  draw();\n})();\n\n/* ── Semana ── */\n(function () {\n  const w = D.weekly;\n  document.getElementById(\"p-semana\").innerHTML = w.blocks.length\n    ? `\u003cp class=\"lede\">Sintese semanal de ${esc(w.date)}.\u003c/p>\u003cdiv class=\"wk\">` +\n      w.blocks.map((s) => `\u003carticle>\u003ch3>${esc(s.title)}\u003c/h3>\u003cdiv class=\"body\">${md(s.body)}\u003c/div>\u003c/article>`).join(\"\") + `\u003c/div>`\n    : `\u003cdiv class=\"empty\">Ainda sem sintese semanal.\u003c/div>`;\n})();\n\nshow(localStorage.getItem(\"scanner_tab\") || \"hoje\");\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

<script>
/* Injectado pelo build a partir de scripts/prices.ts + scripts/valuation.ts —
   a mesma conta de P/L que corre no build corre aqui. Nao editar a mao. */
const emptyBook = () => ({
  asof: "",
  fx: {},
  prices: {},
  benchmark: { ticker: "SPY", currency: "USD", source: "", history: {} }
});
const DATE = /^\d{4}-\d{2}-\d{2}$/;
const URL_RE = /^https?:\/\/\S+$/;
function quoteErrors(ticker, q) {
  const e = [];
  if (!q || typeof q !== "object")
    return [`${ticker}: cotacao nao e um objecto`];
  if (typeof q.price !== "number" || !Number.isFinite(q.price) || q.price <= 0)
    e.push(`${ticker}: price tem de ser um numero positivo`);
  if (!q.currency || typeof q.currency !== "string")
    e.push(`${ticker}: falta currency`);
  if (!DATE.test(String(q.asof ?? "")))
    e.push(`${ticker}: asof tem de ser YYYY-MM-DD`);
  if (!URL_RE.test(String(q.source ?? "")))
    e.push(`${ticker}: source tem de ser um URL — um preco sem fonte e inventado (Licao #23)`);
  return e;
}
function parseBook(raw) {
  if (!raw || !raw.trim())
    return { book: emptyBook(), reason: "sem output/prices.json" };
  let d;
  try {
    d = JSON.parse(raw);
  } catch (err) {
    return { book: emptyBook(), reason: `prices.json com JSON malformado: ${err.message}` };
  }
  const base = emptyBook();
  const book = {
    asof: typeof d?.asof === "string" ? d.asof : "",
    fx: d?.fx && typeof d.fx === "object" ? d.fx : {},
    prices: {},
    benchmark: { ...base.benchmark, ...d?.benchmark ?? {} }
  };
  let dropped = 0;
  for (const [t, q] of Object.entries(d?.prices ?? {})) {
    if (quoteErrors(t, q).length)
      dropped++;
    else
      book.prices[t] = q;
  }
  if (!book.benchmark.history || typeof book.benchmark.history !== "object")
    book.benchmark.history = {};
  return { book, reason: dropped ? `ok (${dropped} cotacao(oes) rejeitada(s) por falta de fonte/data)` : "ok" };
}
function applyQuotes(book, patch) {
  const log = [];
  const out = { ...book, prices: { ...book.prices } };
  for (const [ticker, q] of Object.entries(patch ?? {})) {
    const errs = quoteErrors(ticker, q);
    if (errs.length) {
      log.push(`recusado — ${errs.join("; ")}` + (book.prices[ticker] ? " (fica o preco anterior)" : ""));
      continue;
    }
    const before = book.prices[ticker];
    out.prices[ticker] = q;
    log.push(before ? `${ticker}: ${before.price} (${before.asof}) → ${q.price} (${q.asof})` : `${ticker}: ${q.price} ${q.currency} (${q.asof}) — novo`);
  }
  return { book: out, log };
}
function daysBetween(from, to) {
  const a = Date.parse(from + "T00:00:00Z"), b = Date.parse(to + "T00:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b))
    return 1 / 0;
  return Math.round((b - a) / 86400000);
}
const STALE_AFTER_DAYS = 4;
function toEur(amount, currency, book) {
  if (currency === "EUR")
    return amount;
  const fx = book.fx[currency];
  if (!fx || !(fx.per_eur > 0))
    return null;
  return amount / fx.per_eur;
}
function benchAt(book, date) {
  const dates = Object.keys(book.benchmark.history ?? {}).filter((d) => DATE.test(d)).sort();
  let hit = null;
  for (const d of dates) {
    if (d <= date)
      hit = d;
    else
      break;
  }
  return hit ? { date: hit, point: book.benchmark.history[hit] } : null;
}
function benchLatest(book) {
  const dates = Object.keys(book.benchmark.history ?? {}).filter((d) => DATE.test(d)).sort();
  return dates.length ? { date: dates.at(-1), point: book.benchmark.history[dates.at(-1)] } : null;
}

function valuePositions(positions, book, today) {
  const valued = positions.map((p) => {
    const q = book.prices[p.ticker];
    const eur = q ? toEur(q.price, q.currency, book) : null;
    let value = null;
    let valueFrom = null;
    if (p.value_eur && p.value_eur > 0) {
      value = p.value_eur;
      valueFrom = "manual";
    } else if (eur !== null) {
      value = eur * p.units;
      valueFrom = "mercado";
    }
    return {
      ...p,
      price: q ? q.price : null,
      priceCurrency: q?.currency ?? "",
      priceAsof: q?.asof ?? "",
      priceSource: q?.source ?? "",
      stale: !!q && daysBetween(q.asof, today) > STALE_AFTER_DAYS,
      value,
      valueFrom,
      pl: value === null ? null : value - p.cost_eur,
      plPct: value === null || !p.cost_eur ? null : (value - p.cost_eur) / p.cost_eur * 100
    };
  });
  const byTicker = new Map;
  for (const p of valued) {
    const h = byTicker.get(p.ticker) ?? {
      ticker: p.ticker,
      name: p.name,
      theme: p.theme,
      units: 0,
      cost: 0,
      lines: 0,
      avgCost: 0,
      value: null,
      pl: null,
      plPct: null,
      price: p.price,
      priceCurrency: p.priceCurrency,
      priceAsof: p.priceAsof,
      stale: p.stale
    };
    h.units += p.units;
    h.cost += p.cost_eur;
    h.lines += 1;
    if (p.value !== null)
      h.value = (h.value ?? 0) + p.value;
    byTicker.set(p.ticker, h);
  }
  const holdings = [...byTicker.values()].map((h) => ({
    ...h,
    avgCost: h.units ? h.cost / h.units : 0,
    pl: h.value === null ? null : h.value - h.cost,
    plPct: h.value === null || !h.cost ? null : (h.value - h.cost) / h.cost * 100
  }));
  const invested = valued.reduce((s, p) => s + p.cost_eur, 0);
  const pricedRows = valued.filter((p) => p.value !== null);
  const value = pricedRows.length ? pricedRows.reduce((s, p) => s + (p.value ?? 0), 0) : null;
  const complete = pricedRows.length === valued.length && valued.length > 0;
  return {
    positions: valued,
    holdings,
    totals: {
      invested,
      value,
      pl: complete && value !== null ? value - invested : null,
      plPct: complete && value !== null && invested ? (value - invested) / invested * 100 : null,
      priced: pricedRows.length,
      unpriced: valued.length - pricedRows.length,
      anyStale: valued.some((p) => p.stale),
      bench: benchmark(valued, book)
    }
  };
}
function benchmark(positions, book) {
  const now = benchLatest(book);
  if (!now || !positions.length)
    return null;
  const eurNow = now.point.spy / now.point.usd_per_eur;
  let cost = 0, value = 0, covered = 0, uncovered = 0;
  for (const p of positions) {
    const then = p.date ? benchAt(book, p.date) : null;
    if (!then || !(then.point.usd_per_eur > 0) || !(then.point.spy > 0)) {
      uncovered++;
      continue;
    }
    const eurThen = then.point.spy / then.point.usd_per_eur;
    cost += p.cost_eur;
    value += p.cost_eur * (eurNow / eurThen);
    covered++;
  }
  if (!covered)
    return { ticker: book.benchmark.ticker, covered, uncovered, cost: 0, value: null, plPct: null, asof: now.date };
  return {
    ticker: book.benchmark.ticker,
    covered,
    uncovered,
    cost,
    value,
    plPct: cost ? (value - cost) / cost * 100 : null,
    asof: now.date
  };
}
function themeRows(positions, targets) {
  const byTheme = {};
  let total = 0;
  for (const p of positions) {
    const v = p.value ?? p.cost_eur;
    byTheme[p.theme] = (byTheme[p.theme] ?? 0) + v;
    total += v;
  }
  const rows = targets.map((t) => {
    const value = byTheme[t.theme] ?? 0;

BLA AMT-130 — tres eventos binarios no mesmo trimestre. EYPT LUGANO provou que -70% em 24h e literal, nao teorico. Posicoes max 3-5% por pick binario; diversificar datas de catalisador.\n\n2. **Correçao de mercado SPY -1.4% esta semana**: SPY $776.34→$765.72. Setembro historicamente e o pior mes do ano para SPY (media -0.5% a -1.5%). Outubro-Novembro tem earnings cluster (NBIS, CRWV, IONQ, SOUN, VIRT, BGC, RKLB). Correçao ate $740-750 possivel antes de novo high.\n\n3. **Estimativas de preco sem fonte primaria**: Esta semana IONQ foi corrigido de \"$68 est.\" para $46.26 real (-32% de diferença). CRWV foi corrigido de \"$105 est.\" para ~$90. Padrao Licoes #15, #22, #23 — \"est.\" sem fonte e inventado. Rever todos os precos \"est.\" no track record com fontes primarias no proximo update.\n\n4. **HYPE/CFTC: endorsement nao e aprovacao**: ATH $77.62 foi atingido por catalisador politico-narrativo (Trump). Mecanismo de compliance (KYC on-chain, leverage caps, custody rules) ainda nao definido. Se CFTC anunciar regras onerosas ou processo demorado, correccao -30-40% possivel. Nao aumentar posicao em ATH sem mais clareza regulatoria.\n\n5. **Cluster AI compute — NBIS, CRWV, IONQ, SOUN**: Todos dependem de capex AI dos hyperscalers. Se Meta, Google ou Microsoft guiarem para freeze de capex em Q3 earnings (Nov 2026), o sector corrige simultaneamente. Vigiar Meta Q3 Nov — primeiro gate.\n\n6. **Rearmamento europeu valuation stretch**: HAG.DE Jefferies Hold, JPMorgan Neutral EUR 85. R3NK.DE, THEON.AS, EXOS.PA todos com valuations elevadas vs historico. Tese de rearmamento intacta mas re-rating individual ficou mais dificil — rotacao intra-sector, nao saida do tema.\n\n7. **Correlacao cripto intra-sector**: HYPE +35% esta semana por catalisador especifico. AAVE +15%. ONDO +18% de low. Quando BTC corrige, todos descem independentemente dos catalisadores individuais. Correlacao BTC de HYPE, AAVE, ONDO, MORPHO e estruturalmente alta.\n\n8. **Insider selling cluster (persistente)**: LUNR CEO $14.7M (Aug 13 — mesmo dia Q2 miss); RKLB CEO Beck $286M Jul (10b5-1); NBIS vigiar Form 4. Regra: escala > 2% market cap em 3 dias = revisao de posicao."},{"title":"O que mudou esta semana","body":"*Vs sintese 2026-08-15.*\n\n| Ticker | Mudanca | Classificacao |\n|--------|---------|---------------|\n| EYPT | LUGANO primary endpoint MISS Aug 17; -69% para $4.57 | ❌ FALHOU BINARIO — REMOVIDA |\n| HYPE | Trump/CFTC endorsement Aug 19; ATH $77.62 Aug 21; +35% vs semana passada | ✅ NOVO CATALISADOR — atualizado |\n| CRWV | Q2 $2.58B beat; FY $12.4-13.2B raised; Anthropic+Meta; preco ~$90 | ATUALIZADO + ⚠️ preco revisto Aug-15 |\n| RKLB | Q2 $234.1M record; Neutron Q4 launchpad \"janela estreita\"; Iridium $870M/yr | ATUALIZADO |\n| IONQ | SkyWater concluido Jul 31; preco real $46.26 (nao $68 est.) | ⚠️ CORRECAO PRECO (Licao #23) |\n| AAVE | +15% esta semana; $98.88; approaching breakout $108 | ATUALIZADO |\n| ONDO | Abandoned blockchain plans Jul 28 (pivot para rede privada); $0.388 | ⚠️ PIVOT ESTRATEGICO |\n| VKTX | Maintenance study topline pendente; $34.29 (de $33.12 Aug-15) | CARRY |\n| PRME | PM647 IND/CTA Q3 pendente; Beam arbitragem confirmada; $3.29 | CARRY |\n| NBIS | $248.43; Burry short continua; nenhuma actualizacao material | CARRY |\n| LUNR | Recuperacao de -44% para -9% vs entrada | CARRY |\n| SPY | -1.4% esta semana ($776.34→$765.72); benchmark Apr-05 baixou de +10.5% para +9.0% | MERCADO |"}]},"thesis":{"date":"2026-08-26","intro":"Cinco nomes: os quatro que o dashboard esta a recomendar comprar este mes (LEU, KTOS, RKLB, IONQ) mais o outro score-5 que ficou de fora do cabaz (PRME). Carteira vazia, por isso o perimetro e o que muda uma decisao das proximas semanas. Nao ha alvos de preco aqui — ha juizo com analogia. Nao e conselho de investimento.  **A seccao LEU foi corrigida na mesma ronda** — o falsificador que eu tinha escrito ja tinha disparado a 6 de Agosto. A correccao esta a vista dentro da seccao.","names":[{"ticker":"LEU","name":"Centrus Energy","theme":"Materiais & Energia","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"O melhor analogo desta empresa e **ela propria, ha doze anos**. A USEC — a antecessora\ndirecta da Centrus — pediu **Chapter 11 a 5 de Marco de 2014**, depois de nao conseguir\nencontrar investidores para os ~$4 mil milhoes do American Centrifuge Plant. **O projecto\nera o mesmo. O sitio era o mesmo: Piketon, Ohio. A tecnologia era a mesma familia de\ncentrifugas.** A empresa [saiu do Chapter 11 a 30 de Setembro de 2014 como Centrus](https://www.centrusenergy.com/news/centrus-energy-corp-emerges-from-chapter-11-restructuring/),\ncom nove milhoes de accoes novas e $240,4M de divida nova ([10-K FY2014](https://www.sec.gov/Archives/edgar/data/0001065059/000106505915000012/leu-20141231x10k.htm)).\nQuem tinha a accao antiga ficou sem nada.\n\n**O que e diferente agora — e a diferenca e maior do que eu tinha lido.** A USEC morreu por\nnao conseguir financiar a fabrica. A Centrus esta a financia-la com dinheiro que nao e nem\ncapital proprio nem divida: um award de $900M do DOE, e agora **prepagamentos de clientes**.\nNo acordo com a X-energy, o CEO Amir Vexler diz textualmente que acordos destes fornecem\n[\"non-dilutive, non-debt capital to support our build out\"](https://www.centrusenergy.com/news/centrus-energy-signs-leu-and-haleu-supply-agreement-with-x-energy/).\nE exactamente o mecanismo que faltou em 2014.\n\n**O que continua igual:** a fabrica ainda nao produz. A gestao mantem **2029** como alvo de\nproducao comercial em Piketon, com \"esforcos em curso para avaliar se o calendario pode ser\ncomprimido\". Entre a assinatura e a entrega vao anos — e foi no intervalo que a USEC morreu.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**Isto e uma historia de balanco disfarcada de historia de resultados.** O backlog comercial\nchega a **$4,5 mil milhoes ate 2040**, dos quais $3,0B de enriquecimento contingente de LEU e\nHALEU ([Q2 2026](https://www.centrusenergy.com/news/centrus-reports-second-quarter-2026-results/)).\nO prepagamento entra agora; a receita correspondente entra a partir de 2029-2030. Quem compra\na accao pelo backlog esta a comprar uma data, nao um fluxo.\n\n**Prepagamento e um passivo com uma obrigacao de entrega a prazo fixo.** Resolve o\nfinanciamento e, ao mesmo tempo, vende enriquecimento em avanco. Se o preco do SWU subir\nmuito ate 2030, parte da capacidade nova esta comprometida a precos de 2026. O mercado ve o\nlado bom do prepagamento — e o lado que financia — e nao costuma olhar para o outro.\n\n**A tese certa pela razao errada:** se o HALEU for mesmo escasso e caro, o racional para os\nprojectistas de SMR nao e esperar — e **redesenhar para LEU+ (enriquecimento ate ~10%)**,\nque ja tem cadeia de fornecimento. Nesse mundo a Centrus continua a vender LEU, mas o premio\nde monopolio do HALEU dissolve-se sem uma unica noticia ma sobre a empresa.\n\n**Nota sobre o contrato do DOE, que continua a valer:** o HALEU produzido ao abrigo desse\ncontrato e propriedade do DOE. Essa parte do negocio nao escala com o preco do uranio. O que\nmudou e que ja **nao e a unica parte** — e a distincao que a primeira versao desta tese\nfalhou.\n\n**Sobre a buy-list:** o catalisador registado — \"nova centrifuga Oak Ridge Q4 2026\" — **esta\ncorrecto**. A empresa espera concluir a primeira centrifuga nova em Oak Ridge ate ao fim de\n2026. Vale so distinguir o que e: Oak Ridge e **fabrico** e o marco prova que a cadeia de\nfornecimento fecha; **producao comercial** e em Piketon, em 2029.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"Com uma qualificacao que a primeira versao nao tinha: a empresa da lucro. O Q2 2026 trouxe\n**$176,1M de receita, $16,8M de resultado liquido GAAP ($0,77 por accao diluida) e $1,77 de\nEPS ajustado**. Nao e uma promessa; e uma demonstracao de resultados.\n\nO \"caro\" e sobre o multiplo, nao sobre a qualidade. Os screeners publicos poem o P/E TTM\nalgures entre ~57x e ~80x contra uma **mediana a 5 anos de 14,6x** para a mesma empresa\n(GuruFocus e Simply Wall St, 2026 — opiniao de terceiros, nao facto auditado). Nao e preciso\nacreditar no numero exacto para ler o sinal: o mercado esta a pagar hoje pelo Piketon de 2029.\n\nO segundo sinal e a volatilidade do proprio multiplo. Segundo a Investing.com, a accao caiu\nde ~$383 em Outubro de 2025 para ~$191,85 em Abril de 2026 — **-52% em seis meses**. Quando o\npreco se move dessa maneira e os factos estruturais nao, o que se move e o apetite.","verdict":"caro","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | O calendario comprime-se: producao comercial em Piketon antes de 2029, e mais offtakes com prepagamento a empilhar-se sobre o da X-energy | Gestao a confirmar calendario comprimido; novos 8-K a nomear contrapartes | baixa a media |\n| Base | Backlog e prepagamentos acumulam-se conforme o plano, com receita material so no fim da decada; a accao negoceia sentimento nuclear e nao resultados | Filings trimestrais a reafirmar 2029; marco de Oak Ridge ate ao fim de 2026 | alta |\n| Bear | Derrapagem do calendario de Piketon, expansao europeia (Urenco/Orano) a comer o premio de escassez, ou o SWU a subir acima dos precos ja vendidos em prepagamento | Qualquer reafirmacao de data para depois de 2029; apropriacoes do DOE | media |","verdict":"","falsifier":"um adiamento da producao comercial de Piketon para depois de 2029, ou a renegociacao de um dos offtakes com prepagamento. **E o calendario que sustenta esta tese, nao a procura** — a procura ja esta contratada."}],"verdict":"caro","verdictKey":"caro","falsifier":"um adiamento da producao comercial de Piketon para depois de 2029, ou a renegociacao de um dos offtakes com prepagamento. **E o calendario que sustenta esta tese, nao a procura** — a procura ja esta contratada."},{"ticker":"KTOS","name":"Kratos Defense","theme":"Geopolitica & Defesa","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"O analogo nao esta em 1980 — esta nos ultimos dois anos, no proprio programa. Em Janeiro de\n2024 a Forca Aerea americana financiou cinco desenhos de Collaborative Combat Aircraft\n(Anduril, Boeing, General Atomics, Lockheed, Northrop). Em\n[Abril de 2024 so a Anduril e a General Atomics avancaram](https://defensescoop.com/2024/04/24/anduril-general-atomics-air-force-cca-program/).\nE em [17 de Junho de 2026 a USAF adjudicou a producao do Incremento 1 — as primeiras 150\naeronaves — a Anduril e a General Atomics](https://defensescoop.com/2026/06/17/air-force-picks-anduril-general-atomics-to-build-first-operational-cca-drones/).\n\nA Kratos foi a empresa que **voou primeiro** o conceito, com o XQ-58A. Nao esta no contrato\nde producao. Este e o padrao mais antigo e mais caro da aquisicao de defesa americana: **quem\nganha o demonstrador nao ganha o programa**. O demonstrador prova que a coisa e possivel; o\nprograma vai para quem consegue industrializa-la e para quem controla o software de missao.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**A Kratos monetiza como fornecedor, nao como prime.** No unico CCA operacional ja\nadjudicado a uma equipa que a inclui — o MUX TACAIR dos Marines,\n[um OTA de $231,5M anunciado a 8 de Janeiro de 2026](https://defensescoop.com/2026/01/08/marine-corps-cca-drones-northrop-grumman-kratos-team-contract/)\n— **o prime e a Northrop Grumman**, que integra a sua arquitectura aberta de autonomia\n(Prism) na celula XQ-58 da Kratos ([USNI, 12 de Janeiro de 2026](https://news.usni.org/2026/01/12/northrop-grumman-to-advance-kratos-xq-58-valkyrie-drone-for-marines-corps-loyal-wingman-program)).\nMargem de fornecedor de celula nao e margem de prime de sistema de missao.\n\n**O valor esta a migrar da celula para o software.** Um aviao barato e barato para toda a\ngente construir; o que e dificil de replicar e a autonomia e a integracao de missao. Se a\ntese \"drones baratos ganham a proxima guerra\" estiver certa, o dinheiro pode ir quase todo\npara os donos do stack de autonomia — e a Kratos vende-lhes a fuselagem.\n\n**A escala nao bate certo com o preco.** A Kratos diz que vai subir a producao para\n**~40 Valkyries por ano ate ao fim de 2027**. O Incremento 1 sao 150 aeronaves e o Incremento\n2 podera chegar a ~2.350. A accao esta a ser comprada por um programa em que a empresa,\nhoje, nao esta.\n\n**Correccao a buy-list:** o `why_now` registado — \"unico loyal wingman US em producao\" —\ndeixou de ser verdade a 17 de Junho de 2026. Quem esta em producao e o YFQ-42A da General\nAtomics e o YFQ-44A da Anduril.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"Impossivel de dizer com honestidade — mas o onus da prova esta do lado optimista. Nao ha\naqui um multiplo comparavel util: a Kratos tem um negocio legado de alvos aereos e\nturbinas com margem baixa e previsivel, e por cima uma opcao sobre CCA. O que se pode dizer\nsem inventar e a assimetria de ordens de grandeza: o valor contratado **visivel e atribuivel**\nao programa Valkyrie sao dezenas de milhoes — um\n[contrato de $34,8M para integracao de sistema de missao](https://www.kratosdefense.com/newsroom/kratos-receives-34-8m-contract-for-valkyrie-mission-system-integration)\ne uma fatia de um OTA de $231,5M em que nao e prime — enquanto a tese que sustenta a accao\nfala de milhares de fuselagens num incremento cujos fornecedores ainda nao foram anunciados.\n\nNao ponho um alvo. Ponho a pergunta: quanto e que ja esta pago do Incremento 2?","verdict":"impossivel de dizer","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | A Kratos entra no Incremento 2 (ate ~2.350 aeronaves) ou fecha uma encomenda internacional grande de XQ-58 | Anuncio de fornecedores do Incremento 2 — data ainda nao publica | baixa a media |\n| Base | Fornecedor de celula e de alvos com crescimento real mas linear: ~40 Valkyries/ano ate fim de 2027, mais o legado | Divulgacoes de entregas em 2027; resultados trimestrais | alta |\n| Bear | Os primes de autonomia integram verticalmente a celula e a Kratos fica um fornecedor de componentes num mercado com muitos concorrentes | Qualquer CCA adjudicado a um prime que fabrique a propria fuselagem | media |","verdict":"","falsifier":"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa."}],"verdict":"impossivel de dizer","verdictKey":"incerto","falsifier":"a Kratos nomeada **prime** em qualquer adjudicacao de producao de CCA. Isso inverte a leitura toda — deixa de ser fornecedor e passa a ser dono do programa."},{"ticker":"RKLB","name":"Rocket Lab USA","theme":"Espaco & Deep Tech","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"Outra vez a propria empresa. O **Electron** voou pela primeira vez a **25 de Maio de 2017**,\nchegou ao espaco e nao chegou a orbita por causa de uma falha de equipamento de comunicacoes\nem terra; **orbitou ao segundo voo, a 21 de Janeiro de 2018**. Oito meses entre \"quase\" e\n\"feito\", e um negocio real depois disso.\n\nO **Neutron** foi anunciado a **1 de Marco de 2021 com estreia prevista para 2024**. Passou\npara meados de 2025, depois para\n[o fim de 2026](https://spaceflightnow.com/2025/11/11/rocket-lab-delays-debut-of-neutron-rocket-to-2026/),\ne em Agosto de 2026 a\n[janela para 2026 \"esta a estreitar\"](https://spaceflightnow.com/2026/08/10/window-for-2026-launch-debut-of-rocket-labs-neutron-rocket-is-narrowing-as-development-continues/),\ncom [2027 em cima da mesa](https://spacenews.com/first-neutron-launch-may-slip-to-2027/).\nA 21 de Janeiro rebentou um tanque do primeiro andar num teste de carregamento com agua.\n\n**A licao do analogo e dupla, e as duas metades importam:** a Rocket Lab acaba por fazer o\nfoguetao voar — mas o calendario que anuncia nunca se cumpre. Quem comprou o Electron pela\ndata perdeu; quem comprou pela empresa ganhou. Cinco anos de derrapagem no Neutron sao\nconsistentes com o historico, nao uma anomalia.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**\"Entrega a rampa\" nao e \"lancamento\".** A linguagem do filing e sobre alinhar a producao do\ntanque do primeiro andar com a entrega do Neutron **a rampa** no Q4 2026. Entre estar na\nrampa e voar fica o **static fire integrado em Wallops** — descrito como o marco de maior\nrisco de todo o caminho. Quem le \"Q4 2026\" como data de voo esta a saltar o passo mais\nperigoso.\n\n**O mercado endereçavel do Neutron e \"quem nao e a SpaceX\".** O Neutron foi desenhado para\nmega-constelacoes, e o maior operador de mega-constelacoes do mundo tem foguetoes proprios e\nnao compra lancamentos. O que sobra e real — governo, operadores comerciais, defesa — mas e\nmenor do que o TAM que se cita.\n\n**A parte que ja ganha dinheiro nao e o foguetao.** A divisao de sistemas espaciais\n(componentes, satelites, Photon) e o negocio com receita hoje; o mercado esta a valorizar o\nlancador. Se o Neutron derrapar mais um ano, o que segura a empresa e o segmento que quase\nninguem discute.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"E a forma do \"caro\" importa: isto e uma opcao com theta. Nao vale a pena procurar um\nmultiplo: nao ha lucro estabilizado para dividir. A leitura\nhonesta e estrutural — o preco e essencialmente **uma opcao de compra sobre o Neutron\nfuncionar**, montada em cima de um negocio de componentes que gera receita. Opcoes perdem\nvalor com o tempo. Cada trimestre em que a estreia escorrega sem falha catastrofica nao e\nneutro: e premio a evaporar-se. Foi por isso que os avisos de carry ja registados\n(\"Neutron Q4 2026 nao reafirmado; escorregamento 2027 possivel\") sao a informacao mais\nimportante do nome, e nao um rodape.","verdict":"caro","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | Static fire integrado limpo e orbita no primeiro ou segundo voo ate meados de 2027; a carteira media-lift converte-se | Static fire integrado concluido em LC-3 sem anomalia | media |\n| Base | Entrega a rampa no Q4 2026, primeiro voo em 2027, orbita ao segundo — o padrao do proprio Electron | Anuncio de data de static fire; resultados trimestrais | alta |\n| Bear | Nova falha estrutural em teste empurra para 2028 e obriga a aumento de capital antes de haver receita de Neutron | Anomalia em teste; qualquer prospecto de emissao | media |","verdict":"","falsifier":"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \"aspiracao\" em \"plano\", e sobe o cenario base de uma prateleira."}],"verdict":"caro","verdictKey":"caro","falsifier":"um static fire integrado concluido em LC-3 sem anomalia. E o unico evento que transforma a data de \"aspiracao\" em \"plano\", e sobe o cenario base de uma prateleira."},{"ticker":"IONQ","name":"IonQ","theme":"IA & Computacao","why":"cabaz do mes","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"**Celera Genomics, 2000-2001.** A Celera sequenciou o genoma humano — a proeza cientifica da\ndecada — e a accao [chegou a ~$276 em Marco de 2000](https://money.cnn.com/2000/04/10/companies/celera/).\nEm [Abril de 2001 estava a $33,50](https://www.forbes.com/2001/04/11/0411sf.html). A ciencia\nestava certa. O modelo de negocio — vender acesso a dados genomicos — e que nao aguentou.\n\nO que aconteceu ao dinheiro e a parte que interessa: **foi para quem fazia as maquinas.**\nA Illumina fez IPO em Julho de 2000, tres anos antes de o Projecto Genoma acabar, levantando\n$96M a $16 por accao, e tornou-se a infraestrutura de medicao de toda a industria\n([Century of Bio](https://centuryofbio.com/p/illumina)). Numa revolucao de plataforma, o\nvalor assenta muitas vezes em quem vende as picaretas, nao em quem anuncia a descoberta.\n\n**O que e igual:** uma capacidade genuinamente nova, um vencedor simbolico, e um mercado\ndisposto a pagar hoje por receita que so faz sentido daqui a uma decada.\n**O que e diferente:** a IonQ tem receita a serio a entrar e clientes governamentais — a\nCelera nunca teve. O analogo avisa sobre a **forma** do risco, nao garante o desfecho.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**A qualidade da receita nao e a quantidade.** A IonQ reportou\n[$64,7M no Q1 2026, +755% em termos homologos](https://www.businesswire.com/news/home/20260506736198/en/IonQ-Announces-First-Quarter-2026-Financial-Results),\ne subiu o guidance anual para $280-290M. Mas parte material desse crescimento vem de\n**aquisicoes e de trabalho especializado de hardware**, nao de adopcao organica de\ncomputacao quantica por iao aprisionado. Crescimento comprado e crescimento; nao e prova de\nmercado.\n\n**A IonQ esta a comprar as suas proprias picaretas.** Recebeu os primeiros QPUs\ncompletamente integrados da **SkyWater** — uma fundicao. Na analogia da Celera, isso poe a\nIonQ do lado de quem *usa* o instrumento. Quem fornece fundicao, criogenia, lasers e\nfotonica vende a toda a industria quantica, ganhe quem ganhar a arquitectura.\n\n**A arquitectura nao e exclusiva.** Iao aprisionado tem concorrentes directos — Quantinuum,\nAlpine Quantum Technologies. E a exclusao da IonQ de um pacote federal de ~$2 mil milhoes\npara quantica e um sinal de que o Estado nao esta a tratar a empresa como campea nacional\nunica. Ambos os pontos vem de comentario publico, nao de filings: **confianca parcial**.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"A empresa diz que espera perdas significativas e despesa operacional crescente no futuro\nprevisivel. Nao ha lucro para multiplicar, e um multiplo sobre vendas de uma receita\nparcialmente adquirida compara mal com o que quer que seja. O ancoradouro honesto e\nqualitativo: **o preco e uma afirmacao sobre marcos tecnicos futuros**, e uma parte\ndesproporcionada dele depende de coisas — correccao de erros a escala util, o roadmap de\n256 e 10.000 qubits — que ainda nao aconteceram.\n\nNota de honestidade que este projecto ja pagou para aprender: em Agosto de 2026 o\n`TRACK_RECORD.md` corrigiu um preco de IONQ que tinha sido \"estimado\" em $68 quando o real\nera $46,26 (Licao #23). Aqui nao ha estimativa nenhuma. Ha um veredicto e a razao dele.","verdict":"caro","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | Vantagem quantica demonstrada num problema comercial real com cliente pagante nomeado, e receita organica a ultrapassar a adquirida | Publicacao revista por pares + contrato comercial nomeado | baixa |\n| Base | Receita continua a crescer por aquisicao e contratos governamentais; a accao negoceia marcos tecnicos e sentimento sobre IA | Resultados trimestrais; anuncios de roadmap | alta |\n| Bear | Um concorrente de iao aprisionado chega primeiro a um marco de correccao de erros, ou o financiamento publico roda para outra arquitectura | Adjudicacoes federais; marcos anunciados por Quantinuum/AQT | media |","verdict":"","falsifier":"receita **organica** de computacao quantica (excluindo aquisicoes e trabalho de hardware a feitio) a crescer mais depressa que a adquirida, dois trimestres seguidos. Isso transformaria a tese de \"aposta em marcos\" em \"negocio\"."}],"verdict":"caro","verdictKey":"caro","falsifier":"receita **organica** de computacao quantica (excluindo aquisicoes e trabalho de hardware a feitio) a crescer mais depressa que a adquirida, dois trimestres seguidos. Isso transformaria a tese de \"aposta em marcos\" em \"negocio\"."},{"ticker":"PRME","name":"Prime Medicine","theme":"Longevidade & Saude","why":"score-5 fora do cabaz","confidence":"parcial","lenses":[{"title":"Analogo historico","body":"**Casgevy, 2023-2026.** A primeira terapia de edicao genetica CRISPR aprovada — a prova\ndefinitiva de que a tecnologia funciona em doentes. E depois: **mais de dois anos apos a\naprovacao, cerca de 60 doentes tratados** nos EUA, Medio Oriente e Europa somados. As vendas\nde 2025 foram $116M com 64 infusoes ([BioSpace](https://www.biospace.com/business/vertex-crispr-set-lofty-goal-for-casgevy-gene-therapy-as-patient-starts-ramp)).\n\nO gargalo e a parte que ninguem tinha modelado. Segundo o\n[STAT, a 5 de Fevereiro de 2026](https://www.statnews.com/2026/02/05/vertex-crispr-sickle-cell-treatment-casgevy-faces-rollout-bottleneck/),\nos centros especializados descobriram que **nao conseguem recolher celulas suficientes** para\nfabricar o tratamento. Nao foi a ciencia, nao foi o regulador, nao foi o pagador — foi a\nafereses. Aprovacao nao e receita, e a restricao que decide costuma ser operacional e\naborrecida.\n\n**A desanalogia, que joga a favor da PRME:** os programas principais da Prime para a doenca\nde Wilson e para o defice de alfa-1-antitripsina sao **in vivo**, entregues ao figado. Nao ha\nrecolha de celulas do doente, logo o gargalo especifico do Casgevy nao se aplica. O analogo\navisa que ha *sempre* um gargalo operacional invisivel — nao que seja o mesmo.","verdict":"","falsifier":""},{"title":"O invisivel","body":"**O verdadeiro catalisador de curto prazo nao e o IND. E o financiamento.** A Prime reportou\n**$149,2M de caixa e equivalentes a 31 de Marco de 2026, com runway \"para dentro de 2027\"**\n([resultados Q1 2026](https://investors.primemedicine.com/news-releases/news-release-details/prime-medicine-reports-first-quarter-2026-financial-results-and)).\nOs dados clinicos iniciais do PM647 sao esperados **em 2027**. Faz-se a conta: a caixa acaba\nmais ou menos quando os dados chegam. Ou entra dinheiro antes dos dados — em condicoes\nditadas por quem empresta — ou a empresa negoceia a partir de uma posicao fraca. Um aumento\nde capital antes do readout e o cenario base, nao o risco de cauda.\n\n**O programa mais avancado nao e o que a buy-list segue.** O PM577a para Wilson **ja tem IND\naprovado nos EUA e CTA na Nova Zelandia** e esta a entrar num Fase 1/2 global, com um\n[estudo de pre-selecao ja registado](https://clinicaltrials.gov/study/NCT07226622). O\nPM647 (AATD) e que espera submissao no Q3 2026. A cronologia real e mais avancada do que\n\"dois catalisadores sequenciais\" sugere — e tambem mais dependente de um so activo.\n\n**A resolucao da arbitragem com a Beam** ([Prime Medicine, 2026](https://investors.primemedicine.com/news-releases/news-release-details/prime-medicine-announces-positive-resolution-arbitration-beam))\ntirou um overhang, mas o que fez em substancia foi clarificar fronteiras de propriedade\nintelectual entre edicao de base e prime editing. Isso importa mais para um futuro\nlicenciador do que para o proximo trimestre.","verdict":"","falsifier":""},{"title":"Under/over-value","body":"E biotecnologia pre-receita: nao ha multiplo. Qualquer numero que eu produzisse aqui seria\ninventado, e este projecto ja aprendeu essa licao tres vezes (#15 VKTX, #22 PRME, #23 IONQ —\na #22 e literalmente sobre este nome, um preco \"estimado\" de $4,50 quando o real era $3,19).\n\nO unico ancoradouro legitimo e a relacao entre **caixa e tempo**: $149,2M a 31 de Marco de\n2026, dados em 2027. Quem comprar aqui esta a comprar o direito de participar numa\nrecapitalizacao provavel antes de ver os dados. Isso pode compensar — mas e o que se esta a\ncomprar, e vale a pena dize-lo em voz alta.","verdict":"impossivel de dizer","falsifier":""},{"title":"Cenarios","body":"| Cenario | Tese | Gatilho datavel | Probabilidade |\n|---------|------|-----------------|---------------|\n| Bull | IND do PM647 submetido no Q3 2026 **e** financiamento nao dilutivo (parceria ou royalty) que estica o runway para la dos dados de 2027 | Press release de submissao ate 30 de Setembro de 2026; anuncio de parceria | baixa |\n| Base | IND submetido dentro ou perto da janela, seguido de aumento de capital dilutivo antes do readout de 2027 | Janela Q3 fecha a 30 de Setembro; qualquer prospecto de emissao | alta |\n| Bear | O IND escorrega para Q4, a caixa aperta, e a emissao acontece com a accao em baixo — ou aparece um sinal de seguranca no Fase 1/2 de Wilson | Ausencia de comunicado ate 30 de Setembro; updates de seguranca do PM577a | media |","verdict":"","falsifier":"financiamento **nao dilutivo** — parceria, royalty ou marco pago — que leve o runway para alem dos dados de 2027. Isso remove o motor de preco dominante e devolve o nome ao terreno em que a ciencia decide. _Gerado pelo investment-scanner em 2026-08-26 seguindo `prompts/10-tese-profunda.md`. Juizo qualitativo com analogia datada, sem alvos de preco. Nao e conselho de investimento._"}],"verdict":"impossivel de dizer","verdictKey":"incerto","falsifier":"financiamento **nao dilutivo** — parceria, royalty ou marco pago — que leve o runway para alem dos dados de 2027. Isso remove o motor de preco dominante e devolve o nome ao terreno em que a ciencia decide. _Gerado pelo investment-scanner em 2026-08-26 seguindo `prompts/10-tese-profunda.md`. Juizo qualitativo com analogia datada, sem alvos de preco. Nao e conselho de investimento._"}]},"news":{"date":"2026-08-26","window":"ultimas 48h","scope":"carteira (vazia) + cabaz do mes + alertas abertos do delta","items":[{"ticker":"IONQ","name":"IonQ","what":"A subsidiaria Skyloom chegou a **84 terminais opticos em orbita** com os satelites York Space lancados a 16-Jul num Falcon 9, para a Tranche 1 da SDA","why":"E receita de defesa a serio — e nao vem da computacao quantica. Reforca a leitura de que o crescimento e em parte adquirido e adjacente, nao adopcao organica de iao aprisionado","source":"[IonQ, 24-Ago-2026](https://www.ionq.com/news/ionqs-skyloom-optical-communications-terminals-rea const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
  .replace(/\[(.+?)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";

const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());

/** Markdown de leitura: paragrafos e tabelas. Nao e um parser geral — cobre o que a tese usa. */
function rich(src, tableClass = "") {
  const lines = String(src ?? "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith("|") && /^\|[\s:|-]+\|$/.test((lines[i + 1] ?? "").trim())) {
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      out.push(`<div class="tw"><table class="${tableClass}"><thead><tr>` +
        head.map((h) => `<th>${esc(h)}</th>`).join("") + `</tr></thead><tbody>` +
        rows.map((r) => `<tr>` + r.map((c, n) => {
          const prob = tableClass === "scen" && n === head.length - 1;
          // data-l e o rotulo que substitui o cabecalho quando a tabela vira cartoes no telemovel.
          const label = tableClass === "scen" && n > 0 ? ` data-l="${esc(head[n])}"` : "";
          return `<td${label}>${prob ? `<span class="prob" data-p="${esc(c.split(" ")[0])}">${esc(c)}</span>` : md(c)}</td>`;
        }).join("") + `</tr>`).join("") + `</tbody></table></div>`);
    } else if (!line.trim()) {
      i++;
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !lines[i].trim().startsWith("|")) para.push(lines[i++]);
      out.push(`<p>${md(para.join(" "))}</p>`);
    }
  }
  return out.join("");
}

/** Pill de prazo: so aparece quando a data foi mesmo lida do texto do catalisador. */
function deadlinePill(iso) {
  if (!iso) return "";
  const d = Math.round((Date.parse(iso + "T00:00:00Z") - Date.parse(D.built + "T00:00:00Z")) / 86400000);
  if (d < 0) return `<span class="due" data-d="passou">passou</span>`;
  if (d <= 7)  return `<span class="due" data-d="ja">${d === 0 ? "hoje" : d + "d"}</span>`;
  if (d <= 30) return `<span class="due" data-d="perto">${d}d</span>`;
  if (d <= 90) return `<span class="due" data-d="longe">${Math.round(d / 7)}sem</span>`;
  return "";
}

function markSeen(id) {
  const key = { hoje: "delta", noticias: "news", tese: "thesis", semana: "weekly" }[id];
  const date = { hoje: D.delta.date, noticias: D.news.date, tese: D.thesis.date, semana: D.weekly.date }[id];
  if (!key || !date) return;
  fresh[id] = false;
  seen[key] = date;
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {}
  const dot = nav.querySelector(`.tab[data-t="${id}"] .dot`);

}

function show(id) {
  nav.querySelectorAll(".tab").forEach((b) => {
    const on = b.dataset.t === id;
    b.setAttribute("aria-selected", String(on));
    b.tabIndex = on ? 0 : -1;
  });
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("on", p.id === "p-" + id));
  try { localStorage.setItem("scanner_tab", id); } catch (e) {}
  markSeen(id);
}

  if (b) show(b.dataset.t);
});

/* Setas navegam entre separadores, como um tablist deve fazer. */
nav.addEventListener("keydown", (e) => {
  const keys = { ArrowRight: 1, ArrowLeft: -1, Home: "first", End: "last" };
  if (!(e.key in keys)) return;
  e.preventDefault();
  const ids = TABS.map((t) => t.id);
  const at = ids.indexOf(e.target.dataset.t);
  const next = keys[e.key] === "first" ? 0
    : keys[e.key] === "last" ? ids.length - 1
    : (at + keys[e.key] + ids.length) % ids.length;
  show(ids[next]);
  nav.querySelector(`.tab[data-t="${ids[next]}"]`).focus();
});

      fresh.tese ? `tese de ${esc(D.thesis.date)}` : "",
